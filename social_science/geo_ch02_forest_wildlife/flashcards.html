<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards — Forest and Wildlife Resources</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Mono:wght@400;500&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#04100a;--card:#0a1e10;--card2:#0f2616;--border:#1a3a22;--text:#d4f0dc;--muted:#3a6a48;--green:#4ade80;--amber:#fbbf24;--red:#f87171;--blue:#60a5fa;--purple:#a78bfa;--teal:#34d399;--orange:#fb923c}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Lato',sans-serif;min-height:100vh}

header{text-align:center;padding:1.8rem 1rem 1rem}
header h1{font-family:'Playfair Display',serif;font-size:clamp(1.4rem,4vw,2rem);font-weight:900;color:#4ade80}
header p{color:var(--muted);font-family:'DM Mono',monospace;font-size:.72rem;margin-top:.3rem}

.filters{display:flex;justify-content:center;flex-wrap:wrap;gap:.4rem;padding:.5rem 1rem 1.2rem}
.filters button{font-family:'Lato',sans-serif;font-weight:700;font-size:.74rem;padding:.35rem .9rem;border-radius:99px;border:1.5px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;transition:all .2s}
.filters button:hover{color:var(--text)}
.filters button.active{border-color:var(--green);color:var(--green);background:rgba(74,222,128,.1)}

.progress{display:flex;justify-content:center;align-items:center;gap:1.2rem;padding:0 1rem .8rem;font-family:'DM Mono',monospace;font-size:.72rem;color:var(--muted)}
.progress .count{color:var(--green);font-weight:700}
.progress .known{color:var(--teal)}
.prog-bar{width:140px;height:5px;background:var(--card);border-radius:9px;overflow:hidden}
.prog-fill{height:100%;background:var(--green);border-radius:9px;transition:width .3s}

.deck{display:flex;justify-content:center;align-items:center;padding:1rem;min-height:380px;perspective:1200px}
.flip-card{width:100%;max-width:520px;height:320px;cursor:pointer;position:relative;transform-style:preserve-3d;transition:transform .5s}
.flip-card.flipped{transform:rotateY(180deg)}
.flip-card .front,.flip-card .back{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:2rem;text-align:center;border:1px solid var(--border)}
.flip-card .front{background:var(--card)}
.flip-card .back{background:var(--card2);transform:rotateY(180deg)}
.flip-card .front h2{font-family:'Playfair Display',serif;font-size:1.15rem;font-weight:700;line-height:1.55;color:var(--text)}
.flip-card .back p{font-size:.88rem;line-height:1.75;color:var(--text)}
.flip-card .back p strong{color:var(--green)}
.flip-card .back p em{color:var(--teal);font-style:normal}
.cat-badge{font-family:'DM Mono',monospace;font-size:.62rem;padding:.15rem .55rem;border-radius:99px;margin-bottom:.8rem}
.hint{font-family:'DM Mono',monospace;font-size:.68rem;color:var(--muted);margin-top:1rem}

.controls{display:flex;justify-content:center;gap:.6rem;padding:.8rem 1rem;flex-wrap:wrap}
.ctrl{font-family:'Lato',sans-serif;font-weight:700;font-size:.76rem;padding:.4rem 1.1rem;border-radius:99px;border:1.5px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;transition:all .2s}
.ctrl:hover{color:var(--text);border-color:#2a5a3a}
.ctrl.know{border-color:var(--teal);color:var(--teal);background:rgba(52,211,153,.06)}

.keys{text-align:center;padding:.5rem;font-family:'DM Mono',monospace;font-size:.62rem;color:var(--muted)}

.site-nav{display:flex;align-items:center;justify-content:space-between;padding:.42rem 1.2rem;background:rgba(4,16,10,.95);backdrop-filter:blur(14px);border-bottom:1px solid rgba(26,58,42,.75);position:sticky;top:0;z-index:9999}
.site-nav-logo{display:flex;align-items:center;text-decoration:none}
.site-nav-img{height:28px;border-radius:4px}
.site-nav-back{font-family:'DM Mono',monospace;font-size:.68rem;color:#4a8a5a;text-decoration:none;border:1px solid rgba(26,58,42,.9);border-radius:99px;padding:.2rem .65rem}
.site-nav-back:hover{color:#4ade80}
</style>
</head>
<body>
<nav class="site-nav"><a href="../../index.html" class="site-nav-logo"><img src="../../logos/learnr-colored-dark.svg" alt="learnr" class="site-nav-img"></a><a href="../../index.html" class="site-nav-back">&#8592; Back to Portal</a></nav>

<header>
  <h1>Flashcards</h1>
  <p>Forest &amp; Wildlife Resources · Geography Ch.2 · 40 Cards</p>
</header>

<div class="filters" id="filters"></div>
<div class="progress"><span class="count" id="pos">1 / 40</span><div class="prog-bar"><div class="prog-fill" id="prog"></div></div><span class="known" id="knownCount">0 known</span></div>
<div class="deck" id="deck"></div>
<div class="controls">
  <button class="ctrl" onclick="prev()">← Prev</button>
  <button class="ctrl" onclick="flipCard()">⟳ Flip</button>
  <button class="ctrl know" onclick="markKnown()">✓ Know it</button>
  <button class="ctrl" onclick="next()">Next →</button>
  <button class="ctrl" onclick="shuffle()">⤮ Shuffle</button>
  <button class="ctrl" onclick="resetAll()">↺ Reset</button>
</div>
<div class="keys">Keyboard: ← → (navigate) · Space (flip) · K (know it) · S (shuffle)</div>

<script>
const CARDS=[
// bio (8)
{cat:'bio',q:'Why is India called a "mega-biodiversity" country?',a:'India has about <strong>8% of the total species</strong> in the world (est. 1.6 million) while occupying only 2.4% of world\'s land area. It has 47,000+ plant species and 89,000+ animal species. India is one of 12 mega-biodiversity countries.'},
{cat:'bio',q:'How many plant and animal species does India have?',a:'<strong>~47,000 plant species</strong> (15,000 flowering plants — 6th in world, 4th in Asia).\n<strong>~89,000 animal species</strong> including 1,200+ birds, 2,500+ fish, 50,000+ insects. Many species still undiscovered!'},
{cat:'bio',q:'What are endemic species? Give Indian examples.',a:'Species found <strong>only in particular isolated areas</strong> and nowhere else in the world.\nExamples: Andaman teal, Nicobar pigeon, Mithun (Arunachal Pradesh), Manipur bush quail. Western Ghats has very high endemism.'},
{cat:'bio',q:'Name two biodiversity hotspots in India.',a:'1. <strong>Western Ghats</strong> — 6,000+ plant species, many endemic frogs and reptiles.\n2. <strong>Eastern Himalayas</strong> — rich in orchids, bamboo, rare animals.\nAlso: NE India and Andaman & Nicobar Islands.'},
{cat:'bio',q:'What percentage of India\'s land area is under forest cover?',a:'About <strong>21.67%</strong> (as per 2021 Forest Survey of India). The National Forest Policy 1988 targets 33% for plains and 67% for hilly regions. India is far from these targets.'},
{cat:'bio',q:'What are biotic and abiotic resources in forests?',a:'<strong>Biotic:</strong> living things — trees, animals, birds, insects, microorganisms, fungi.\n<strong>Abiotic:</strong> non-living — soil, water, rocks, minerals, sunlight, air.\nForests are complex ecosystems with both.'},
{cat:'bio',q:'Why are forests important for ecological balance?',a:'Forests:\n• Regulate climate and rainfall\n• Prevent soil erosion and floods\n• Maintain water cycle\n• Provide habitat for wildlife\n• Absorb CO₂ (carbon sink)\n• Provide oxygen\n• Maintain food chains'},
{cat:'bio',q:'What fraction of India\'s geographical area should ideally be under forests?',a:'<strong>33% for plains, 67% for hilly/mountainous areas</strong> — as per National Forest Policy 1988. Current cover (~21.67%) is well below target. Only NE states and some hilly areas meet the target.'},

// iucn (8)
{cat:'iucn',q:'What is the IUCN and what does it do?',a:'<strong>International Union for Conservation of Nature.</strong>\nClassifies species into threat categories (Normal, Endangered, Vulnerable, Rare, Endemic, Extinct). Publishes the <strong>Red Data Book</strong> listing threatened species worldwide.'},
{cat:'iucn',q:'What are "endangered species"? Give Indian examples.',a:'Species in <strong>danger of extinction</strong>. Survival unlikely if threats continue.\nExamples: <strong>Black buck, Indian rhinoceros, Indian wild ass, lion-tailed macaque, sangai (brow-antlered deer), crocodile.</strong>'},
{cat:'iucn',q:'What is the difference between vulnerable and endangered species?',a:'<strong>Endangered:</strong> In immediate danger of extinction. Very few left.\n<strong>Vulnerable:</strong> Populations declining — likely to BECOME endangered if threats continue.\nVulnerable is one step before endangered.'},
{cat:'iucn',q:'Name species that have gone extinct in India.',a:'<strong>Asiatic cheetah</strong> — last seen in India in 1952.\n<strong>Pink-headed duck</strong> — last seen in 1930s.\n<strong>Sumatran rhinoceros</strong> — extinct in India.\nHuman activities (hunting, habitat loss) are the main cause.'},
{cat:'iucn',q:'What are "rare species"? Give examples.',a:'Species with <strong>small populations</strong>. Not currently endangered but could become so.\nExamples: <strong>Himalayan brown bear, wild Asiatic buffalo, desert fox, hornbill.</strong>\nThey exist in limited geographic areas.'},
{cat:'iucn',q:'What is the "Red Data Book"?',a:'Published by IUCN — lists all <strong>threatened species</strong> of plants and animals. Uses colour-coded categories (critically endangered, endangered, vulnerable, etc.). India has 44 critically endangered and 113 endangered species listed.'},
{cat:'iucn',q:'Give examples of "normal species" in India.',a:'Species with population at <strong>safe survival level</strong>. No immediate threat.\nExamples: <strong>Cattle, sal, pine, rodents, common birds (crow, sparrow), insects like houseflies.</strong>\nThey are widespread and abundant.'},
{cat:'iucn',q:'What is the difference between extinct and endangered?',a:'<strong>Extinct:</strong> Species no longer found anywhere after extensive searches. Gone forever (e.g., Asiatic cheetah in India).\n<strong>Endangered:</strong> Still alive but in danger of becoming extinct soon if not protected.'},

// cause (8)
{cat:'cause',q:'What is the single largest cause of deforestation in India?',a:'<strong>Agricultural expansion.</strong> After independence, vast forest areas were converted to farmland to feed the growing population. Between 1951-1980, over <strong>26,200 sq km</strong> of forest land was cleared for agriculture.'},
{cat:'cause',q:'How did the British contribute to deforestation?',a:'The British exploited forests massively:\n• <strong>Railway sleepers</strong> — millions of trees felled for rail network.\n• <strong>Ship-building</strong> — teak forests destroyed.\n• Commercial agriculture expansion.\n• Forest cover fell from ~40% to 19% during British rule.'},
{cat:'cause',q:'What is shifting cultivation and why does it cause deforestation?',a:'Also called <strong>Jhum/slash-and-burn</strong>. Trees are cut, burned; ash used as fertiliser. Land cultivated 2-3 years, then abandoned.\nProblem: cycle shortened from 20-30 years to 3-5 years — forests don\'t get time to regenerate.'},
{cat:'cause',q:'How have large dams caused forest loss?',a:'River valley projects <strong>submerged over 5,000 sq km</strong> of forest between 1951-1980.\nExamples: Narmada dam, Tehri dam.\nForests are permanently flooded. Wildlife displaced. Tribal communities lose their homes.'},
{cat:'cause',q:'How does mining cause deforestation?',a:'<strong>Open-cast mining</strong> destroys entire forest areas.\nExamples:\n• Doon Valley (Uttarakhand): limestone quarrying devastated forests.\n• Sariska (Rajasthan): mining threatened tiger reserve.\nMining leaves permanent scars on the landscape.'},
{cat:'cause',q:'How does overgrazing affect forests?',a:'India has ~<strong>500 million livestock</strong>. Grazing pressure on forests is enormous.\n• Animals eat seedlings — prevents forest regeneration.\n• Soil gets compacted.\n• Grass cover depleted.\n• 270 million tonnes of fuelwood collected annually exceeds sustainable limit.'},
{cat:'cause',q:'What role did forest fires play in depletion?',a:'Forest fires destroy thousands of hectares annually.\n• Natural fires (lightning) — rare.\n• <strong>Human-caused fires</strong> — clearing land, carelessness, arson.\n• Dry deciduous forests especially vulnerable (summer months).\n• Destroy wildlife habitat and soil organisms.'},
{cat:'cause',q:'How does habitat fragmentation threaten wildlife?',a:'When large forests are broken into <strong>small isolated patches</strong> by roads, farms, dams:\n• Animals can\'t move between patches.\n• Genetic diversity decreases (inbreeding).\n• Large animals need big territories — can\'t survive in small patches.\n• Corridors between reserves are critical.'},

// conserve (8)
{cat:'conserve',q:'What is the difference between a National Park and a Wildlife Sanctuary?',a:'<strong>National Park:</strong> Strictest protection. NO human activity (grazing, farming, logging) allowed. 104 in India.\n<strong>Wildlife Sanctuary:</strong> Limited human activity allowed (grazing in some). 566 in India.\nBoth protect habitats.'},
{cat:'conserve',q:'What is Project Tiger? Has it been successful?',a:'Launched in <strong>1973</strong> to protect tigers and their habitats.\n• Started with 9 reserves, now 53.\n• Tiger population: 1,827 (2006) → <strong>3,167 (2022)</strong>.\n• Major success! India has 70% of world\'s wild tigers.\n• Key reserves: Jim Corbett, Ranthambore, Sundarbans.'},
{cat:'conserve',q:'Name 3 important Biosphere Reserves in India.',a:'1. <strong>Nilgiri</strong> (Tamil Nadu/Kerala/Karnataka) — first in India (1986).\n2. <strong>Sundarbans</strong> (West Bengal) — mangrove, Royal Bengal Tiger.\n3. <strong>Nanda Devi</strong> (Uttarakhand) — UNESCO World Heritage.\nTotal: 18 biosphere reserves in India.'},
{cat:'conserve',q:'What is the Wildlife Protection Act, 1972?',a:'India\'s most important wildlife law:\n• <strong>Banned hunting</strong> and poaching of all wild animals.\n• Created framework for National Parks and Sanctuaries.\n• Established Wildlife Advisory Board.\n• Provided for punishment of offenders.\n• Amended several times to strengthen protection.'},
{cat:'conserve',q:'What is the Forest Conservation Act, 1980?',a:'Restricted <strong>diversion of forest land</strong> for non-forest purposes.\n• Central government approval needed to convert forest to non-forest use.\n• States cannot de-reserve forests without centre\'s permission.\n• Significantly slowed rate of deforestation after 1980.'},
{cat:'conserve',q:'What is the Forest Rights Act, 2006?',a:'Recognised rights of <strong>tribal and forest-dwelling communities</strong>:\n• Right to live in forests.\n• Right to collect minor forest produce (honey, herbs, fruits).\n• Habitat rights for particularly vulnerable tribes.\n• Historic — reversed colonial-era injustice against tribals.'},
{cat:'conserve',q:'What is the difference between in-situ and ex-situ conservation?',a:'<strong>In-situ:</strong> Protecting species in their natural habitat (National Parks, Sanctuaries, Biosphere Reserves). Preferred method.\n<strong>Ex-situ:</strong> Protecting outside natural habitat (zoos, botanical gardens, gene banks, seed banks). Backup method.'},
{cat:'conserve',q:'What is CITES?',a:'<strong>Convention on International Trade in Endangered Species</strong> of Wild Fauna and Flora.\n• International agreement to regulate/ban trade in threatened species.\n• India is a signatory.\n• Bans trade in tiger parts, ivory, rhino horn, etc.\n• Helps reduce poaching for international markets.'},

// community (8)
{cat:'community',q:'What was the Chipko Movement?',a:'<strong>1970s, Garhwal (Uttarakhand).</strong> Villagers (especially women) hugged trees to prevent commercial felling.\nLeaders: Sunderlal Bahuguna, Gaura Devi, Chandi Prasad Bhatt.\nSlogan: "Ecology is permanent economy."\nResult: 15-year ban on green felling in Himalayas.'},
{cat:'community',q:'Who are the Bishnoi? Why are they famous for conservation?',a:'A community in <strong>Rajasthan</strong> that has protected wildlife and trees since the 1700s.\n• In 1731, <strong>Amrita Devi</strong> and 363 Bishnois sacrificed their lives to protect khejri trees.\n• Still protect blackbuck and chinkara.\n• Filed case against Salman Khan for poaching (1998).'},
{cat:'community',q:'What is Joint Forest Management (JFM)?',a:'<strong>Government + community partnership</strong> to manage forests (since 1988).\n• Communities protect forests from fire, grazing, encroachment.\n• In return: access to non-timber products (fruits, honey, herbs).\n• 84,000+ JFM committees across 27 states.\n• Odisha alone: 10,000+ communities involved.'},
{cat:'community',q:'What are Sacred Groves?',a:'Patches of forests <strong>protected by communities for religious reasons</strong>.\n• Dedicated to local deities — trees cannot be cut.\n• Preserve rare and endemic species.\n• Found in Meghalaya, Rajasthan, MP, Maharashtra, Kerala.\n• Ancient form of conservation — centuries old!\n• Some have species found nowhere else.'},
{cat:'community',q:'What is the Bhairodev Dakav "Sonchuri"?',a:'In <strong>Alwar district, Rajasthan</strong>, 5 villages declared 1,200 hectares of forest as their <strong>own wildlife sanctuary</strong>.\n• Self-imposed rules: no hunting, no tree felling.\n• Named "Sonchuri" (community conservation area).\n• No government intervention — purely community-driven!'},
{cat:'community',q:'How did the Chipko Movement influence government policy?',a:'Direct results:\n• <strong>15-year ban</strong> on commercial green felling in Himalayan forests.\n• Inspired the Forest Conservation Act, 1980.\n• Government recognised community role in conservation.\n• Inspired similar movements: Appiko (Karnataka, 1983), Narmada Bachao Andolan.\n• Global recognition of grassroots environmentalism.'},
{cat:'community',q:'Give an example of "poachers turned protectors."',a:'<strong>Periyar Tiger Reserve, Kerala.</strong>\n• Former poachers and sandalwood smugglers were reformed.\n• They became <strong>forest guards and tourist guides</strong>.\n• Their knowledge of forests helps in anti-poaching operations.\n• Shows that involving local people (even former offenders) in conservation works!'},
{cat:'community',q:'Why does the chapter emphasise community conservation?',a:'Key message: <strong>Government laws alone cannot protect forests</strong>.\n• Communities living near forests know them best.\n• They have economic incentive to protect (sustainable use).\n• Traditional knowledge is invaluable.\n• JFM, sacred groves, Bishnoi example — all prove community conservation is effective and lasting.'},
];

const CATS={bio:{label:'Biodiversity',color:'var(--green)',bg:'rgba(74,222,128,.12)'},iucn:{label:'IUCN Classification',color:'var(--purple)',bg:'rgba(167,139,250,.12)'},cause:{label:'Causes of Depletion',color:'var(--amber)',bg:'rgba(251,191,36,.12)'},conserve:{label:'Conservation',color:'var(--teal)',bg:'rgba(52,211,153,.12)'},community:{label:'Community Movements',color:'var(--orange)',bg:'rgba(251,146,60,.12)'}};

let filtered=[...CARDS],idx=0,known=new Set(),currentCat='all';

function buildFilters(){const f=document.getElementById('filters');let h=`<button class="active" onclick="setFilter('all',this)">All (${CARDS.length})</button>`;for(const[k,v]of Object.entries(CATS)){const n=CARDS.filter(c=>c.cat===k).length;h+=`<button onclick="setFilter('${k}',this)">${v.label} (${n})</button>`;}f.innerHTML=h;}
function setFilter(cat,btn){currentCat=cat;document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');filtered=cat==='all'?[...CARDS]:CARDS.filter(c=>c.cat===cat);idx=0;render();}
function render(){if(!filtered.length)return;if(idx>=filtered.length)idx=0;if(idx<0)idx=filtered.length-1;const c=filtered[idx],cat=CATS[c.cat];document.getElementById('deck').innerHTML=`<div class="flip-card" id="fc" onclick="flipCard()"><div class="front"><span class="cat-badge" style="background:${cat.bg};color:${cat.color}">${cat.label}</span><h2>${c.q}</h2><span class="hint">tap to flip</span></div><div class="back"><span class="cat-badge" style="background:${cat.bg};color:${cat.color}">${cat.label}</span><p>${c.a.replace(/\n/g,'<br>')}</p></div></div>`;document.getElementById('pos').textContent=`${idx+1} / ${filtered.length}`;document.getElementById('prog').style.width=((idx+1)/filtered.length*100)+'%';document.getElementById('knownCount').textContent=known.size+' known';}
function flipCard(){document.getElementById('fc')?.classList.toggle('flipped')}
function next(){idx++;render()} function prev(){idx--;render()}
function markKnown(){known.add(filtered[idx].q);next();}
function shuffle(){filtered.sort(()=>Math.random()-.5);idx=0;render();}
function resetAll(){known.clear();filtered=currentCat==='all'?[...CARDS]:CARDS.filter(c=>c.cat===currentCat);idx=0;render();}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();else if(e.key==='ArrowLeft')prev();else if(e.key===' '){e.preventDefault();flipCard();}else if(e.key==='k'||e.key==='K')markKnown();else if(e.key==='s'||e.key==='S')shuffle();});
buildFilters();render();
</script>
</body>
</html>
