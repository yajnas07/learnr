<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Question Bank — Forest and Wildlife Resources</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Mono:wght@400;500&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#04100a;--card:#0a1e10;--card2:#0f2616;--border:#1a3a22;--text:#d4f0dc;--muted:#3a6a48;--green:#4ade80;--amber:#fbbf24;--red:#f87171;--blue:#60a5fa;--purple:#a78bfa;--teal:#34d399;--orange:#fb923c}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Lato',sans-serif;min-height:100vh}

header{text-align:center;padding:1.8rem 1rem 1rem}
header h1{font-family:'Playfair Display',serif;font-size:clamp(1.4rem,4vw,2rem);font-weight:900;color:#4ade80}
header p{color:var(--muted);font-family:'DM Mono',monospace;font-size:.72rem;margin-top:.3rem}

.filters{display:flex;justify-content:center;flex-wrap:wrap;gap:.4rem;padding:.5rem 1rem 1rem}
.filters button{font-family:'Lato',sans-serif;font-weight:700;font-size:.72rem;padding:.32rem .85rem;border-radius:99px;border:1.5px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;transition:all .2s}
.filters button:hover{color:var(--text)}
.filters button.active{border-color:var(--green);color:var(--green);background:rgba(74,222,128,.08)}

.score-bar{display:flex;justify-content:center;gap:1.5rem;padding:0 1rem .8rem;font-family:'DM Mono',monospace;font-size:.72rem;color:var(--muted)}
.score-bar span.right{color:var(--green)} .score-bar span.wrong{color:var(--red)}

.questions{max-width:820px;margin:auto;padding:0 1rem 3rem;display:flex;flex-direction:column;gap:1rem}
.q-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.3rem 1.4rem;transition:border-color .2s}
.q-card:hover{border-color:#2a5a3a}
.q-num{font-family:'DM Mono',monospace;font-size:.65rem;color:var(--green);margin-bottom:.4rem}
.q-text{font-size:.88rem;font-weight:600;line-height:1.7;margin-bottom:.9rem}
.opts{display:grid;gap:.4rem}
.opt{display:flex;align-items:flex-start;gap:.5rem;padding:.5rem .8rem;border-radius:9px;border:1px solid var(--border);cursor:pointer;font-size:.82rem;line-height:1.5;transition:all .15s;background:transparent}
.opt:hover{border-color:#2a5a3a;background:var(--card2)}
.opt.correct{border-color:var(--green);background:rgba(74,222,128,.1);color:var(--green)}
.opt.wrong{border-color:var(--red);background:rgba(248,113,113,.08);color:var(--red)}
.opt .circle{min-width:20px;height:20px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;margin-top:1px}
.opt.correct .circle{border-color:var(--green);background:var(--green);color:#000}
.opt.wrong .circle{border-color:var(--red);background:var(--red);color:#fff}
.explain{display:none;margin-top:.7rem;font-size:.78rem;line-height:1.7;color:var(--muted);background:var(--card2);border-radius:8px;padding:.7rem 1rem;border-left:3px solid var(--green)}
.explain.show{display:block}

.site-nav{display:flex;align-items:center;justify-content:space-between;padding:.42rem 1.2rem;background:rgba(4,16,10,.95);backdrop-filter:blur(14px);border-bottom:1px solid rgba(26,58,42,.75);position:sticky;top:0;z-index:9999}
.site-nav-logo{display:flex;align-items:center;text-decoration:none}
.site-nav-img{height:28px;border-radius:4px}
.site-nav-back{font-family:'DM Mono',monospace;font-size:.68rem;color:#4a8a5a;text-decoration:none;border:1px solid rgba(26,58,42,.9);border-radius:99px;padding:.2rem .65rem}
.site-nav-back:hover{color:#4ade80}
</style>
</head>
<body>
<nav class="site-nav"><a href="../../index.html" class="site-nav-logo"><img src="../../logos/learnr-colored-dark.svg" alt="learnr" class="site-nav-img"></a><a href="../../index.html" class="site-nav-back">&#8592; Back to Portal</a></nav>

<header>
  <h1>Question Bank</h1>
  <p>Forest &amp; Wildlife Resources · Geography Ch.2 · 30 MCQs</p>
</header>

<div class="filters" id="filters"></div>
<div class="score-bar"><span>Score: <span class="right" id="sc-r">0</span> ✓ / <span class="wrong" id="sc-w">0</span> ✗</span><span id="sc-tot">0 / 30 attempted</span></div>
<div class="questions" id="qlist"></div>

<script>
const QS=[
// Biodiversity
{cat:'bio',q:'India is one of how many mega-biodiversity countries in the world?',ops:['8','10','12','15'],ans:2,exp:'India is one of 12 mega-biodiversity countries. It has about 8% of the world\'s total species while occupying only 2.4% of the world\'s land area.'},
{cat:'bio',q:'Approximately how many plant species are found in India?',ops:['15,000','27,000','47,000','97,000'],ans:2,exp:'India has approximately 47,000 plant species, of which about 15,000 are flowering plants. This makes India 10th in the world and 4th in Asia for plant diversity.'},
{cat:'bio',q:'Which of these is a biodiversity hotspot in India?',ops:['Thar Desert','Indo-Gangetic Plains','Western Ghats','Deccan Plateau'],ans:2,exp:'The Western Ghats is one of the world\'s 36 biodiversity hotspots. It has over 6,000 plant species, many endemic frogs, reptiles, and amphibians found nowhere else.'},
{cat:'bio',q:'What percentage of India\'s geographical area is under forest cover?',ops:['11.5%','21.67%','33%','40%'],ans:1,exp:'India\'s forest cover is about 21.67% of total geographical area (Forest Survey of India, 2021). The National Forest Policy 1988 targets 33% for plains and 67% for hilly areas.'},
{cat:'bio',q:'India has what percentage of the world\'s total species?',ops:['2.4%','5%','8%','12%'],ans:2,exp:'India has about 8% of the world\'s total number of species (estimated at 1.6 million). This is remarkable given India has only 2.4% of the world\'s land area.'},

// IUCN
{cat:'iucn',q:'Which of these is an "endangered" species in India?',ops:['Sal tree','Crow','Black buck','Blue sheep'],ans:2,exp:'Black buck is classified as endangered — in danger of extinction. Other endangered species include Indian rhinoceros, Indian wild ass, lion-tailed macaque, and sangai (brow-antlered deer).'},
{cat:'iucn',q:'The Asiatic cheetah was last seen in India in:',ops:['1900','1927','1952','1975'],ans:2,exp:'The Asiatic cheetah was last seen in India in 1952 and is now classified as extinct in India. It was hunted to extinction. India recently reintroduced African cheetahs from Namibia (2022).'},
{cat:'iucn',q:'Which category of species is defined as "likely to become endangered if conditions worsen"?',ops:['Rare','Vulnerable','Endemic','Normal'],ans:1,exp:'Vulnerable species have declining populations and are likely to move into the endangered category if the negative factors affecting them continue. Examples: Blue sheep, Asiatic elephant, Gangetic dolphin.'},
{cat:'iucn',q:'Endemic species are those which are:',ops:['Found worldwide','Found only in specific isolated areas','Very common','Recently discovered'],ans:1,exp:'Endemic species are found only in particular isolated geographical areas and nowhere else in the world. Examples: Andaman teal, Nicobar pigeon, Mithun (Arunachal Pradesh).'},
{cat:'iucn',q:'The IUCN Red Data Book is:',ops:['A textbook on forests','A list of endangered habitats','A list of threatened species','A government policy document'],ans:2,exp:'The IUCN Red Data Book lists all threatened species of plants and animals worldwide. It classifies them into categories like critically endangered, endangered, vulnerable, etc.'},

// Causes
{cat:'cause',q:'The single largest cause of deforestation in India since independence is:',ops:['Mining','Agricultural expansion','Urbanisation','Forest fires'],ans:1,exp:'Agricultural expansion is the single largest cause. Over 26,200 sq km of forest was cleared for agriculture between 1951-1980. Growing population demanded more farmland.'},
{cat:'cause',q:'How much forest was submerged by river valley projects between 1951-1980?',ops:['500 sq km','2,000 sq km','5,000+ sq km','20,000 sq km'],ans:2,exp:'Large dams and river valley projects submerged over 5,000 sq km of forests between 1951-1980. Major projects like Narmada, Tehri permanently flooded vast forest areas.'},
{cat:'cause',q:'Shifting cultivation is also known as:',ops:['Terrace farming','Jhum cultivation','Plantation agriculture','Mixed farming'],ans:1,exp:'Shifting cultivation (Jhum/slash-and-burn) involves cutting and burning trees, using ash as fertiliser, cultivating for 2-3 years, then moving on. The shortened cycle (now 3-5 years vs earlier 20-30) doesn\'t allow forest recovery.'},
{cat:'cause',q:'During British colonial rule, India\'s forest cover declined from about 40% to:',ops:['30%','25%','19%','10%'],ans:2,exp:'British exploited forests massively for railway sleepers, shipbuilding, and commercial agriculture. Forest cover fell from approximately 40% to 19% during the colonial period (1860s-1947).'},
{cat:'cause',q:'The Doon Valley case is an example of deforestation due to:',ops:['Dam construction','Mining (limestone quarrying)','Agriculture','Urbanisation'],ans:1,exp:'In the Doon Valley (Uttarakhand), indiscriminate limestone quarrying destroyed forests and ecology. The Supreme Court ordered closure of many mines. It became a landmark environmental case.'},

// Conservation
{cat:'conserve',q:'Project Tiger was launched in:',ops:['1960','1972','1973','1980'],ans:2,exp:'Project Tiger was launched in 1973 to protect tigers and their habitats. It started with 9 reserves and now has 53. Tiger population has grown from 1,827 (2006) to 3,167 (2022) — a major success.'},
{cat:'conserve',q:'How many National Parks does India have?',ops:['53','66','104','566'],ans:2,exp:'India has 104 National Parks with the strictest protection — no human activity (grazing, farming, logging) is allowed. Famous ones: Jim Corbett, Kaziranga, Ranthambore, Sundarbans.'},
{cat:'conserve',q:'The Wildlife (Protection) Act was passed in:',ops:['1965','1972','1980','1986'],ans:1,exp:'The Indian Wildlife (Protection) Act, 1972 banned hunting and poaching, established the framework for National Parks and Sanctuaries, and created the Wildlife Advisory Board. Most important wildlife legislation.'},
{cat:'conserve',q:'The Forest Conservation Act (1980) primarily:',ops:['Promoted commercial logging','Restricted diversion of forest land','Banned all entry into forests','Created wildlife sanctuaries'],ans:1,exp:'The Forest Conservation Act 1980 restricted diversion of forest land for non-forest purposes. Central government approval became mandatory. This significantly slowed the rate of deforestation.'},
{cat:'conserve',q:'The Forest Rights Act, 2006 is significant because it:',ops:['Banned tribal people from forests','Recognised rights of tribal/forest-dwelling communities','Created new national parks','Promoted commercial forestry'],ans:1,exp:'The Forest Rights Act 2006 was historic — it recognised the rights of tribal and forest-dwelling communities including the right to live in forests, collect minor forest produce, and habitat rights.'},

// Community
{cat:'community',q:'The Chipko Movement took place in:',ops:['Rajasthan, 1960s','Uttarakhand, 1970s','Kerala, 1980s','Karnataka, 1990s'],ans:1,exp:'The Chipko Movement started in the 1970s in Garhwal, Uttarakhand. Villagers (especially women) hugged trees to prevent felling. Leaders: Sunderlal Bahuguna, Gaura Devi, Chandi Prasad Bhatt.'},
{cat:'community',q:'Which community in Rajasthan has been protecting wildlife since the 1700s?',ops:['Gujjars','Bishnoi','Bhils','Meenas'],ans:1,exp:'The Bishnoi community of Rajasthan has protected blackbuck, chinkara, and khejri trees since the 1700s. In 1731, Amrita Devi and 363 Bishnois sacrificed their lives to save khejri trees.'},
{cat:'community',q:'Joint Forest Management (JFM) involves:',ops:['Only government managing forests','Only villagers managing forests','Government and community partnership','International organisations managing forests'],ans:2,exp:'JFM is a partnership between government and local communities (since 1988). Communities protect forests from fire, grazing, and encroachment. In return, they get access to non-timber products. 84,000+ committees exist.'},
{cat:'community',q:'Sacred Groves are:',ops:['Government-owned forests','Forest patches protected by communities for religious reasons','Scientific research stations','Tourism areas'],ans:1,exp:'Sacred Groves are forest patches protected by local communities due to religious beliefs. They preserve rare and endemic species. Found in Meghalaya, Rajasthan, MP, Maharashtra, Kerala — an ancient form of conservation.'},
{cat:'community',q:'In Alwar (Rajasthan), five villages declared 1,200 hectares as:',ops:['A mining zone','Their own wildlife sanctuary (Sonchuri)','Agricultural land','A tourist resort'],ans:1,exp:'Five villages in Alwar declared 1,200 hectares as "Bhairodev Dakav Sonchuri" — their own wildlife sanctuary with self-imposed rules against hunting and tree felling. Purely community-driven, no government intervention.'},

// Mixed
{cat:'bio',q:'The target forest cover for hilly/mountainous areas as per National Forest Policy 1988 is:',ops:['21%','33%','50%','67%'],ans:3,exp:'The National Forest Policy 1988 set a target of 33% forest cover for plains and 67% for hilly/mountainous regions. Current national average is only 21.67% — well below both targets.'},
{cat:'conserve',q:'India\'s first National Park is:',ops:['Kaziranga','Jim Corbett','Ranthambore','Gir'],ans:1,exp:'Jim Corbett National Park (Uttarakhand) was established in 1936 as Hailey National Park — India\'s first. Named after hunter-turned-conservationist Jim Corbett. Now also a Tiger Reserve.'},
{cat:'cause',q:'India has approximately how many livestock animals that put pressure on forests?',ops:['100 million','250 million','500 million','800 million'],ans:2,exp:'India has approximately 500 million livestock animals. This enormous grazing pressure on forests prevents regeneration of seedlings, compacts soil, and depletes grass cover. Additionally, 270 million tonnes of fuelwood is collected annually.'},
{cat:'conserve',q:'How many Biosphere Reserves does India have?',ops:['8','14','18','25'],ans:2,exp:'India has 18 Biosphere Reserves that combine conservation with sustainable development and research. Examples: Nilgiri (first, 1986), Sundarbans, Nanda Devi, Gulf of Mannar, Pachmarhi.'},
{cat:'community',q:'The slogan "Ecology is permanent economy" is associated with:',ops:['Medha Patkar','Sunderlal Bahuguna','Chandi Prasad Bhatt','Gaura Devi'],ans:1,exp:'This famous slogan was coined by Sunderlal Bahuguna, the leader of the Chipko Movement. It emphasises that protecting ecology (environment) is more important than short-term economic gains from felling trees.'},
];

const CATS={bio:{l:'Biodiversity',c:'var(--green)'},iucn:{l:'IUCN Classification',c:'var(--purple)'},cause:{l:'Causes of Depletion',c:'var(--amber)'},conserve:{l:'Conservation',c:'var(--teal)'},community:{l:'Community Movements',c:'var(--orange)'}};

let filtered=[...QS],scoreR=0,scoreW=0,attempted=0,answered=new Set();

function buildFilters(){const f=document.getElementById('filters');let h=`<button class="active" onclick="filter('all',this)">All (${QS.length})</button>`;for(const[k,v]of Object.entries(CATS)){const n=QS.filter(q=>q.cat===k).length;h+=`<button onclick="filter('${k}',this)">${v.l} (${n})</button>`;}f.innerHTML=h;}
function filter(cat,btn){document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');filtered=cat==='all'?[...QS]:QS.filter(q=>q.cat===cat);render();}
function render(){const c=document.getElementById('qlist');c.innerHTML=filtered.map((q,i)=>{const gi=QS.indexOf(q);const letters='ABCD';return`<div class="q-card" id="q${gi}"><div class="q-num">Q${gi+1} · ${CATS[q.cat].l}</div><div class="q-text">${q.q}</div><div class="opts">${q.ops.map((o,j)=>`<div class="opt" data-qi="${gi}" data-oi="${j}" onclick="answer(${gi},${j},this)"><span class="circle">${letters[j]}</span><span>${o}</span></div>`).join('')}</div><div class="explain" id="exp${gi}">${q.exp}</div></div>`;}).join('');}
function answer(qi,oi,el){if(answered.has(qi))return;answered.add(qi);attempted++;const q=QS[qi];const opts=document.querySelectorAll(`[data-qi="${qi}"]`);opts.forEach(o=>{const idx=+o.dataset.oi;if(idx===q.ans)o.classList.add('correct');else if(idx===oi)o.classList.add('wrong');});if(oi===q.ans)scoreR++;else scoreW++;document.getElementById('sc-r').textContent=scoreR;document.getElementById('sc-w').textContent=scoreW;document.getElementById('sc-tot').textContent=`${attempted} / ${QS.length} attempted`;document.getElementById(`exp${qi}`).classList.add('show');}
buildFilters();render();
</script>
</body>
</html>
