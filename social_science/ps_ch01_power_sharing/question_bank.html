<script>
const QS = [
  // ── MCQ ──
  { id:1, type:'mcq', topic:'bel', strip:'strip-bel',
    q:'What percentage of Belgium\'s population speaks Dutch (Flemish)?',
    opts:['40%','59%','74%','80%'],
    ans:1, explanation:'59% of Belgium is Dutch-speaking (Flemish) in the north. French-speaking Walloons are 40% (south) and German-speaking 1% (east). Note: Brussels capital is 80% French — adding to the tension.',
    tip:'Remember: 59% Dutch, 40% French. Brussels reverses this (80% French) — that\'s the twist that made power sharing necessary.' },

  { id:2, type:'mcq', topic:'bel', strip:'strip-bel',
    q:'Which of the following is NOT a feature of Belgium\'s power-sharing model?',
    opts:['Equal Dutch and French ministers in central cabinet','Community governments for cultural/education affairs','Sinhala declared the only official language','Brussels as a separate bilingual region'],
    ans:2, explanation:'"Sinhala declared the only official language" is from Sri Lanka\'s Sinhala Only Act (1956) — an example of MAJORITARIANISM, not power sharing. It is the opposite of what Belgium did.',
    tip:'This is a classic "identify the odd one out" question. Three options describe Belgium; one describes Sri Lanka\'s mistake.' },

  { id:3, type:'mcq', topic:'sl', strip:'strip-sl',
    q:'The Sinhala Only Act of Sri Lanka was passed in which year?',
    opts:['1948','1956','1976','1983'],
    ans:1, explanation:'The Official Language Act (Sinhala Only Act) was passed in 1956 — declaring Sinhala as the only official language, replacing English. This was the turning point that began systematic Tamil alienation.',
    tip:'1948 = independence; 1956 = Sinhala Only Act; 1976 = LTTE founded; 1983 = civil war begins. All four dates matter.' },

  { id:4, type:'mcq', topic:'sl', strip:'strip-sl',
    q:'What does LTTE stand for?',
    opts:['Lanka Tamil Trade Enterprise','Liberation Tigers of Tamil Eelam','Lankan Tamil Territorial Elite','Lanka Tamil Treaty Enforcement'],
    ans:1, explanation:'LTTE = Liberation Tigers of Tamil Eelam — the armed Tamil separatist organisation founded in 1976 that demanded an independent Tamil homeland "Eelam" in northern and eastern Sri Lanka.',
    tip:'LTTE = Liberation Tigers of Tamil Eelam. "Eelam" = the Tamil name for the proposed separate homeland.' },

  { id:5, type:'mcq', topic:'why', strip:'strip-why',
    q:'Which type of reason for power sharing is based on practical wisdom and desired outcomes?',
    opts:['Moral reason','Prudential reason','Constitutional reason','Democratic reason'],
    ans:1, explanation:'Prudential reasons are based on practical wisdom — sharing power is desirable because of its good outcomes (stability, peace, economic development). Moral reasons, in contrast, are based on principles of right and wrong regardless of outcomes.',
    tip:'Prudential = Practical. Moral = Principle. Both are important but different. Examiners often ask you to distinguish them.' },

  { id:6, type:'mcq', topic:'why', strip:'strip-why',
    q:'Power sharing is the "very spirit of democracy" — this statement refers to which kind of reason?',
    opts:['Prudential reason','Economic reason','Moral reason','Pragmatic reason'],
    ans:2, explanation:'This is a MORAL reason. Power sharing is the spirit of democracy because democracy means rule by ALL the people — not just 50%+1. Every citizen has a moral right to participate in governance, regardless of practical outcomes.',
    tip:'"Spirit of democracy" = moral reason. "Prevents civil war" = prudential reason. Learn to distinguish by the nature of the argument.' },

  { id:7, type:'mcq', topic:'forms', strip:'strip-forms',
    q:'Which constitutional amendment(s) in India established the Panchayati Raj system?',
    opts:['42nd Amendment','52nd Amendment','73rd Amendment','86th Amendment'],
    ans:2, explanation:'The 73rd Amendment (1992) established the Panchayati Raj system (rural local self-government) and the 74th Amendment (1992) established Urban Local Bodies (Municipalities). Both are examples of vertical power sharing / decentralisation.',
    tip:'73rd = rural Panchayats; 74th = urban Municipalities. Both passed in 1992 — remember the pair.' },

  { id:8, type:'mcq', topic:'forms', strip:'strip-forms',
    q:'The Union List, State List, and Concurrent List are examples of which form of power sharing?',
    opts:['Horizontal distribution','Vertical distribution','Social group sharing','Political party sharing'],
    ans:1, explanation:'The three Lists in India\'s 7th Schedule divide legislative powers between Centre and States — this is VERTICAL distribution of power (federalism). Horizontal = among organs at the same level (legislature, executive, judiciary).',
    tip:'Vertical = levels (Centre → State → Local). Horizontal = organs at same level (Legislature, Executive, Judiciary).' },

  { id:9, type:'mcq', topic:'forms', strip:'strip-forms',
    q:'Reservation of seats for SC/ST in the Indian Parliament is an example of power sharing among:',
    opts:['Different organs of government','Different levels of government','Social groups','Political parties and movements'],
    ans:2, explanation:'Reserved constituencies for SC/ST is power sharing among SOCIAL GROUPS — ensuring historically marginalised communities have representation in the legislature. This is Form 3 of power sharing.',
    tip:'Social group power sharing = reservations + minority rights + community representation. Not federalism (that\'s levels).' },

  { id:10, type:'mcq', topic:'bel', strip:'strip-bel',
    q:'Belgium transformed from a unitary state to a federal state through constitutional amendments completed in which year?',
    opts:['1970','1980','1989','1993'],
    ans:3, explanation:'The process of constitutional amendments ran from 1970 to 1993. The 4th and final amendment in 1993 formally declared Belgium a federal state. The transformation was gradual — not a single event.',
    tip:'First amendment = 1970; final = 1993. If asked "when did Belgium BECOME federal" — answer is 1993.' },

  // ── ASSERTION–REASON ──
  { id:11, type:'assert', topic:'bel', strip:'strip-bel',
    q:'<strong>Assertion (A):</strong> Belgium\'s central cabinet has equal numbers of Dutch and French-speaking ministers.<br><strong>Reason (R):</strong> Belgium has more French-speaking people than Dutch-speaking people.',
    opts:['Both A and R are true, and R is the correct explanation of A',
          'Both A and R are true, but R is NOT the correct explanation of A',
          'A is true but R is false',
          'A is false but R is true'],
    ans:2, explanation:'A is TRUE — Belgium\'s constitution does require equal Dutch/French ministers in the central cabinet.<br>R is FALSE — Belgium is 59% Dutch-speaking (Flemish, majority) and only 40% French-speaking. French are actually the minority nationally (but majority in Brussels). Equal representation was given despite the Dutch majority.',
    tip:'Read statistics carefully. Belgium = 59% Dutch, 40% French. The equal cabinet rule was given to the MINORITY (French) by the majority — that\'s why it\'s significant.' },

  { id:12, type:'assert', topic:'sl', strip:'strip-sl',
    q:'<strong>Assertion (A):</strong> Sri Lanka\'s civil war lasted 26 years.<br><strong>Reason (R):</strong> Majoritarianism in Sri Lanka alienated the Tamil minority and created conditions for armed conflict.',
    opts:['Both A and R are true, and R is the correct explanation of A',
          'Both A and R are true, but R is NOT the correct explanation of A',
          'A is true but R is false',
          'A is false but R is true'],
    ans:0, explanation:'Both A and R are TRUE. The civil war ran from 1983–2009 = 26 years. R correctly explains WHY the war happened — the chain: Sinhala-only Act → Tamil alienation → LTTE formed → civil war. R is the causal explanation of A.',
    tip:'This is a cause-and-effect A-R. R is the CAUSE; A is the EFFECT. So R correctly explains A → option A.' },

  { id:13, type:'assert', topic:'why', strip:'strip-why',
    q:'<strong>Assertion (A):</strong> Power sharing reduces the possibility of conflict between social groups.<br><strong>Reason (R):</strong> Power sharing is a prudential reason for accommodating diverse communities.',
    opts:['Both A and R are true, and R is the correct explanation of A',
          'Both A and R are true, but R is NOT the correct explanation of A',
          'A is true but R is false',
          'A is false but R is true'],
    ans:1, explanation:'A is TRUE — power sharing does reduce conflict. R is also TRUE — conflict reduction IS a prudential reason for power sharing. However, R does not EXPLAIN A — R labels the reason; it doesn\'t explain why power sharing reduces conflict. The causal mechanism (inclusion → loyalty → peace) is the actual explanation.',
    tip:'In A-R, "R is not the correct explanation" means R and A are both true but R is a description/label, not the actual cause of A.' },

  { id:14, type:'assert', topic:'forms', strip:'strip-forms',
    q:'<strong>Assertion (A):</strong> In India, the Supreme Court can declare a law passed by Parliament as unconstitutional.<br><strong>Reason (R):</strong> India has a system of checks and balances among the three organs of government.',
    opts:['Both A and R are true, and R is the correct explanation of A',
          'Both A and R are true, but R is NOT the correct explanation of A',
          'A is true but R is false',
          'A is false but R is true'],
    ans:0, explanation:'Both A and R are TRUE, and R correctly explains A. India\'s system of checks and balances (R) is precisely what allows the judiciary to review and strike down parliamentary legislation (A). Judicial review IS the expression of the checks and balances system.',
    tip:'Judicial review = horizontal power sharing = checks and balances. All three phrases refer to the same concept.' },

  // ── SHORT ANSWER ──
  { id:15, type:'short', topic:'bel', strip:'strip-bel', marks:2,
    q:'Describe the ethnic composition of Belgium and explain why it created a problem.',
    showAns:false,
    answer:`<strong>Ethnic composition:</strong><br>
    • Dutch-speaking (Flemish): <strong>59%</strong> — northern Flanders region<br>
    • French-speaking (Walloons): <strong>40%</strong> — southern Wallonia region<br>
    • German-speaking: <strong>1%</strong> — eastern cantons<br>
    • Brussels (capital): <strong>80% French, 20% Dutch</strong> — yet located in Dutch-speaking Flanders<br><br>
    <strong>Why it created a problem:</strong><br>
    The French minority in Brussels was historically economically and educationally dominant, while the Dutch-speaking majority felt politically and culturally threatened. If the Dutch majority had imposed its will, the French community would have been marginalised. If French dominance in Brussels continued, the Dutch felt disadvantaged. This tension between the communities required constitutional power-sharing arrangements.`,
    tip:'Always mention Brussels separately — it\'s the key complication. An examiner will specifically look for "80% French in capital despite being in Dutch region".' },

  { id:16, type:'short', topic:'sl', strip:'strip-sl', marks:2,
    q:'What is majoritarianism? How did it affect Sri Lanka?',
    showAns:false,
    answer:`<strong>Majoritarianism:</strong> The belief that the majority community should be able to rule a country in whatever way it wants, disregarding the wishes and interests of the minority.<br><br>
    <strong>Effect on Sri Lanka:</strong><br>
    • 1956 Sinhala Only Act excluded Tamils from government jobs<br>
    • University quotas and government employment favoured Sinhala<br>
    • Buddhism given state patronage; Tamil cultural identity marginalised<br>
    • Tamils felt like second-class citizens → demanded autonomy → then separation<br>
    • LTTE formed (1976); civil war erupted (1983–2009), lasting 26 years<br>
    • 70,000–100,000 people killed; economy devastated<br><br>
    <strong>Lesson:</strong> Majoritarianism destroys social peace and leads to civil conflict.`,
    tip:'"How did majoritarianism affect Sri Lanka" = give the chain: policies → alienation → LTTE → civil war → consequences. Show the causal chain.' },

  { id:17, type:'short', topic:'bel', strip:'strip-bel', marks:3,
    q:'Describe any three features of Belgium\'s power-sharing arrangements.',
    showAns:false,
    answer:`<strong>1. Equal Cabinet Representation:</strong><br>
    The central government must have equal numbers of Dutch and French-speaking ministers. Neither community can dominate national governance regardless of election results.<br><br>
    <strong>2. Community Governments:</strong><br>
    Three community governments (Dutch, French, German) are elected by members of each linguistic community regardless of where they live. They handle cultural affairs, education, and language policy — a unique non-territorial form of power sharing.<br><br>
    <strong>3. Special Status for Brussels:</strong><br>
    Brussels is a separate bilingual region with its own government giving equal representation to Dutch and French speakers. This solved the problem of Brussels being majority French despite being geographically in Flanders.<br><br>
    <strong>4. Regional Governments:</strong><br>
    Separate regional governments for Flanders, Wallonia, and Brussels handle local economic development and administration independently of the central government.`,
    tip:'For a 3-mark question, give 3 features clearly. Four given here for safety — use the best three. Community governments and Brussels are the most unique features of Belgium.' },

  { id:18, type:'short', topic:'why', strip:'strip-why', marks:2,
    q:'Distinguish between prudential and moral reasons for power sharing.',
    showAns:false,
    answer:`<table style="width:100%;border-collapse:collapse;font-size:.8rem">
    <tr><th style="padding:5px 8px;background:var(--card2);border:1px solid var(--border);color:var(--teal)">Prudential Reasons</th><th style="padding:5px 8px;background:var(--card2);border:1px solid var(--border);color:var(--green)">Moral Reasons</th></tr>
    <tr><td style="padding:5px 8px;border:1px solid var(--border)">Based on practical wisdom and desired outcomes</td><td style="padding:5px 8px;border:1px solid var(--border)">Based on principles of right and wrong</td></tr>
    <tr><td style="padding:5px 8px;border:1px solid var(--border)">Good because it prevents conflict and maintains stability</td><td style="padding:5px 8px;border:1px solid var(--border)">Good because it is democratic and just — regardless of outcomes</td></tr>
    <tr><td style="padding:5px 8px;border:1px solid var(--border)">"If we don't share power, there will be civil war" (outcome)</td><td style="padding:5px 8px;border:1px solid var(--border)">"Every citizen has a right to participate in governance" (principle)</td></tr>
    <tr><td style="padding:5px 8px;border:1px solid var(--border)">Sri Lanka's civil war shows the cost of NOT sharing</td><td style="padding:5px 8px;border:1px solid var(--border)">Power sharing is the very spirit of democracy</td></tr>
    </table>`,
    tip:'Comparison table = automatic full marks. Prudential = Practical (P = P). Moral = values/principles.' },

  { id:19, type:'short', topic:'forms', strip:'strip-forms', marks:2,
    q:'Explain horizontal distribution of power with examples from India.',
    showAns:false,
    answer:`<strong>Horizontal distribution of power</strong> = sharing power among the three organs of government — Legislature, Executive, and Judiciary — at the same level, so that each can check and balance the others.<br><br>
    <strong>The three organs:</strong><br>
    • <strong>Legislature</strong> (Parliament, State Assemblies): makes laws<br>
    • <strong>Executive</strong> (Cabinet, PM/CM, bureaucracy): implements laws<br>
    • <strong>Judiciary</strong> (Supreme Court, High Courts): interprets laws<br><br>
    <strong>Examples of checks and balances in India:</strong><br>
    • Supreme Court can declare any law passed by Parliament <em>unconstitutional</em> (judicial review)<br>
    • The President (executive) cannot make laws — that is Parliament's job<br>
    • Parliament cannot deliver court judgments — that is the judiciary's job<br>
    • The executive is accountable to the legislature (Parliament)<br><br>
    This prevents concentration of all power in any one organ.`,
    tip:'Always name all three organs. Always give at least two specific Indian examples. "Checks and balances" is the key phrase to use.' },

  { id:20, type:'short', topic:'forms', strip:'strip-forms', marks:2,
    q:'What is vertical distribution of power? How is it practiced in India?',
    showAns:false,
    answer:`<strong>Vertical distribution of power</strong> = dividing powers between higher and lower levels of government — central, state, and local. This is <strong>federalism</strong>.<br><br>
    <strong>In India:</strong><br>
    • <strong>Union List</strong> (97 subjects): defence, foreign affairs, currency, atomic energy — Centre's exclusive domain<br>
    • <strong>State List</strong> (66 subjects): police, agriculture, health, education — States' exclusive domain<br>
    • <strong>Concurrent List</strong> (47 subjects): both Centre and States can legislate; Centre prevails in conflict<br>
    • <strong>73rd Amendment (1992)</strong>: Panchayati Raj — rural local self-government (Gram Panchayat, Panchayat Samiti, Zilla Parishad)<br>
    • <strong>74th Amendment (1992)</strong>: Urban Local Bodies (Ward Councils, Municipal Committees, Municipal Corporations)`,
    tip:'The three Lists + local self-government (73rd/74th amendments) = complete answer on vertical sharing.' },

  { id:21, type:'short', topic:'forms', strip:'strip-forms', marks:2,
    q:'What is a coalition government? How is it a form of power sharing?',
    showAns:false,
    answer:`<strong>Coalition government:</strong> A government formed by two or more political parties that agree to cooperate and share power — usually when no single party wins a majority in elections.<br><br>
    <strong>How it is power sharing:</strong><br>
    • Different parties represent different social groups and interests<br>
    • In a coalition, all partner parties must be consulted on major decisions<br>
    • No single party can dictate policy unilaterally — compromise is necessary<br>
    • Power is shared through cabinet portfolios distributed among partner parties<br><br>
    <strong>India:</strong> Most governments since 1989 have been coalitions — the NDA (BJP-led) and UPA (Congress-led) alliances both included multiple parties.<br><br>
    Coalition government is Form 4 of power sharing — among political parties.`,
    tip:'"How is coalition power sharing?" — explain that different parties = different communities = their interests get represented. That\'s the mechanism.' },

  { id:22, type:'short', topic:'sl', strip:'strip-sl', marks:3,
    q:'Compare the outcomes of Belgium and Sri Lanka in dealing with ethnic diversity.',
    showAns:false,
    answer:`<strong>Belgium — Accommodation:</strong><br>
    • Chose to constitutionally recognise and accommodate all linguistic communities<br>
    • Equal cabinet representation, community governments, Brussels bilingual status<br>
    • Gradual transformation through 4 amendments (1970–1993) into a federal state<br>
    • Outcome: Peaceful coexistence, no civil war, strong economy, headquarters of the EU<br><br>
    <strong>Sri Lanka — Majoritarianism:</strong><br>
    • Sinhala majority imposed its will through Sinhala Only Act (1956), quotas, Buddhism<br>
    • Tamil minority felt excluded, formed political parties, then armed groups (LTTE, 1976)<br>
    • Civil war erupted in 1983, lasted 26 years, killed 70,000–100,000 people<br>
    • Outcome: Economic devastation, massive displacement, international isolation<br><br>
    <strong>Conclusion:</strong> Accommodation of diversity leads to stability; majoritarianism leads to conflict. The contrast between Belgium and Sri Lanka is the chapter's central argument.`,
    tip:'For comparison questions: give BOTH countries equal space. Don\'t write 80% about Belgium and 20% about Sri Lanka. Balance is key.' },

  { id:23, type:'short', topic:'why', strip:'strip-why', marks:2,
    q:'Why is power sharing considered to be the "very spirit of democracy"?',
    showAns:false,
    answer:`Democracy literally means "rule by the people" — meaning ALL the people, not just the majority. This is why power sharing is the spirit of democracy:<br><br>
    1. <strong>All citizens have a right to participate</strong> in governance, regardless of their numbers<br>
    2. <strong>Decisions affect everyone</strong> — those affected have a right to be consulted<br>
    3. <strong>Majoritarian democracy</strong> (rule by 50%+1 ignoring the rest) is only superficially democratic — it is "tyranny of the majority"<br>
    4. <strong>True democracy</strong> protects minority rights while allowing majority to govern<br>
    5. Power sharing ensures that <strong>no single group monopolises power</strong> — which would make democracy meaningless for the excluded groups<br><br>
    This is a MORAL reason for power sharing — right in principle, not just because it produces good outcomes.`,
    tip:'"Spirit of democracy" = moral reason. The answer must explain WHY it is the spirit — not just assert it. Include "tyranny of the majority" contrast.' },

  { id:24, type:'short', topic:'bel', strip:'strip-bel', marks:2,
    q:'What is a community government in Belgium? How is it different from a regional government?',
    showAns:false,
    answer:`<strong>Community Government:</strong> Elected by people belonging to a particular linguistic community — regardless of where in Belgium they live. Handles cultural affairs, education, and language-related issues.<br>
    Three community governments: Dutch, French, German.<br><br>
    <strong>Regional Government:</strong> Based on geographical territory — governs a specific region (Flanders, Wallonia, or Brussels). Handles economic development, local administration, and territorial issues.<br><br>
    <strong>Key Difference:</strong><br>
    • Regional = TERRITORY-based (where you live)<br>
    • Community = LANGUAGE/CULTURE-based (who you are)<br><br>
    A French-speaker living in Flanders participates in the French Community Government but is governed by the Flemish Regional Government. This non-territorial power sharing is unique to Belgium.`,
    tip:'The distinction between community (language-based) and regional (territory-based) is a frequently asked question. The non-territorial nature of community governments is Belgium\'s most unique feature.' },

  { id:25, type:'short', topic:'forms', strip:'strip-forms', marks:2,
    q:'Describe power sharing among social groups with examples from India and one other country.',
    showAns:false,
    answer:`<strong>Power sharing among social groups</strong> = ensuring that religious, linguistic, caste, and other minority communities have representation in governance — so that power is not monopolised by one dominant group.<br><br>
    <strong>India examples:</strong><br>
    • <strong>Reserved constituencies</strong> for Scheduled Castes and Scheduled Tribes in Lok Sabha and State Assemblies<br>
    • <strong>1/3 reservation</strong> for women in Panchayati Raj institutions (73rd Amendment)<br>
    • Minority rights: right to run own educational institutions (Article 30)<br>
    • National Minorities Commission safeguards minority interests<br><br>
    <strong>Belgium:</strong> Constitutional requirement of equal Dutch and French representation in the central cabinet — giving the French community (40% minority) equal say with the Dutch majority (59%).<br><br>
    <strong>Lebanon:</strong> By convention, the President must be a Maronite Christian, the PM must be Sunni, and the Speaker of Parliament must be Shia.`,
    tip:'"India and ONE other country" — Belgium is the safest choice since it\'s in the textbook. Always give specific examples, not vague statements.' },

  { id:26, type:'short', topic:'key', strip:'strip-key', marks:2,
    q:'Define: (a) ethnic group, (b) civil war.',
    showAns:false,
    answer:`<strong>(a) Ethnic group:</strong> A social group with a shared cultural tradition, history, language, or religion. The term refers to cultural identity — NOT racial identity. Two ethnic groups can be of the same race but have different languages or religions.<br>
    Examples: Flemish and Walloons in Belgium (language-based); Sinhala and Tamils in Sri Lanka (language + religion + history).<br><br>
    <strong>(b) Civil war:</strong> An armed conflict between the government (or state) and a section of its own citizens, or between two groups within the same country, over political power or rights.<br>
    Example: Sri Lanka civil war (1983–2009) between the Sri Lankan military and LTTE — 26 years, 70,000–100,000 killed.`,
    tip:'Two definitions in one question = 1 mark each. Give definition + example for each. Exact words don\'t matter as much as accuracy of meaning.' },

  // ── LONG ANSWER ──
  { id:27, type:'long', topic:'bel', strip:'strip-bel', marks:5,
    q:'Explain the power-sharing arrangements in Belgium. What lessons can other countries learn from Belgium\'s experience?',
    showAns:false,
    answer:`<strong>Belgium\'s Power-Sharing Arrangements:</strong><br><br>
    Belgium is a small European country with a complex ethnic composition — 59% Dutch-speaking (Flemish, north), 40% French-speaking (Walloon, south), and 1% German-speaking (east). Brussels, the capital, is 80% French despite being in a Dutch-speaking region. This created intense tension.<br><br>
    Belgium resolved this through <strong>4 constitutional amendments (1970–1993)</strong>, gradually transforming into a federal state with three levels of power sharing:<br><br>
    <strong>Level 1 — Federal (Central) Government:</strong><br>
    • Constitution mandates equal Dutch and French-speaking ministers in the cabinet<br>
    • Neither community can dominate national governance regardless of election results<br>
    • Central government handles: defence, foreign affairs, social security, finance<br><br>
    <strong>Level 2 — Regional Governments:</strong><br>
    • Flanders (Dutch, north), Wallonia (French, south), Brussels (bilingual)<br>
    • Each has its own directly elected assembly and executive<br>
    • Handle: economic development, employment, agriculture, local administration<br><br>
    <strong>Level 3 — Community Governments:</strong><br>
    • Three community governments: Dutch, French, German<br>
    • Elected by members of each linguistic community — <em>regardless of where they live</em><br>
    • Handle: education, culture, language policy — non-territorial power sharing<br><br>
    <strong>Special feature:</strong> Brussels has its own government with equal Dutch/French representation — addressing the problem of a French-majority city in a Dutch region.<br><br>
    <strong>Lessons for other countries:</strong><br>
    1. Accommodation is better than majoritarian suppression<br>
    2. Power sharing can be complex but complexity is worth it if it prevents conflict<br>
    3. Non-territorial community governance is possible alongside territorial governance<br>
    4. Constitutional guarantees (not just goodwill) are needed for genuine power sharing<br>
    5. Belgium is HQ of EU — showing that multi-ethnic accommodation leads to prosperity`,
    tip:'5-mark Belgium answer: include all 3 levels, 4 amendments context, and lessons. The three-level structure is the core of the answer.' },

  { id:28, type:'long', topic:'sl', strip:'strip-sl', marks:5,
    q:'Describe the measures taken by Sri Lanka that led to the alienation of Tamils and eventually to civil war.',
    showAns:false,
    answer:`<strong>Background:</strong><br>
    Sri Lanka became independent in 1948. Its ethnic composition: Sinhala 74%, Sri Lankan Tamil 11%, Indian Tamil 7%, Moors 7%. The democratically elected Sinhala majority chose majoritarianism over accommodation.<br><br>
    <strong>Measures that alienated Tamils:</strong><br><br>
    <strong>1. Sinhala Only Act (1956):</strong><br>
    Declared Sinhala the only official language, replacing English. Tamil-speaking Sri Lankans were suddenly required to know Sinhala for all government work, education, and employment. Overnight, thousands of Tamil professionals lost their career prospects.<br><br>
    <strong>2. University Admission Quotas:</strong><br>
    Quotas were introduced that favoured Sinhala students over equally or better-qualified Tamil students. This blocked Tamil access to higher education and professional careers.<br><br>
    <strong>3. Government Employment Discrimination:</strong><br>
    Government services, military, and police became overwhelmingly Sinhala-dominated. Tamils found systematic barriers to public sector employment.<br><br>
    <strong>4. State Patronage to Buddhism:</strong><br>
    Buddhism was given special state protection, despite Sri Lanka having significant Hindu Tamil, Christian, and Muslim populations. Buddhist festivals became national holidays; Tamil cultural and religious identity was marginalised.<br><br>
    <strong>Consequences:</strong><br>
    • Tamils first demanded a federal system → ignored<br>
    • Then demanded a separate state — LTTE formed (1976)<br>
    • Civil war erupted (1983) after anti-Tamil riots (Black July)<br>
    • War lasted 26 years (1983–2009), killing 70,000–100,000 people<br>
    • Economy devastated; millions displaced; international isolation<br><br>
    <strong>Lesson:</strong> Ignoring minority rights in a democracy creates alienation, armed conflict, and ultimately destroys the entire nation.`,
    tip:'Structure: Background → 4 specific measures → consequences → lesson. Each measure must be specific and named (Sinhala Only Act, not just "language policy").' },

  { id:29, type:'long', topic:'forms', strip:'strip-forms', marks:5,
    q:'Describe the four forms of power sharing with examples from India and other countries.',
    showAns:false,
    answer:`Power sharing means distributing political power so that no single person or group can monopolise it. There are four main forms:<br><br>
    <strong>Form 1 — Horizontal Distribution (Among Organs of Government):</strong><br>
    Power shared among legislature, executive, and judiciary — the three organs — at the same level. Each can check and balance the others ("checks and balances").<br>
    • India: Supreme Court can strike down unconstitutional laws (judicial review); Parliament cannot deliver verdicts; President cannot make laws<br>
    • USA: Presidential veto, Congressional override, Supreme Court review<br><br>
    <strong>Form 2 — Vertical Distribution (Among Levels of Government):</strong><br>
    Power divided between central, state, and local governments — federalism and decentralisation.<br>
    • India: Union List (97), State List (66), Concurrent List (47); Panchayati Raj (73rd Amendment 1992); Municipalities (74th Amendment 1992)<br>
    • Belgium: Federal + Regional + Community governments (three tiers)<br><br>
    <strong>Form 3 — Among Social Groups:</strong><br>
    Power shared with minority communities through reservations and constitutional rights.<br>
    • India: Reserved seats for SC/ST in Parliament; 1/3 women's reservation in Panchayats; minority right to run own institutions<br>
    • Belgium: Equal French/Dutch ministers in cabinet<br>
    • Lebanon: President = Christian, PM = Sunni, Speaker = Shia<br><br>
    <strong>Form 4 — Among Political Parties and Movements:</strong><br>
    Multi-party competition, coalition governments, pressure groups, civil society, free media.<br>
    • India: Coalition governments since 1989; trade unions, student groups influence policy; free press<br>
    • All democracies: Free media as "4th estate" checks government power<br><br>
    All four forms serve the same purpose: prevent dangerous concentration of power, ensure accountability, and make democracy real for all citizens.`,
    tip:'Four forms = 4 clear sections. For each: name it, define it, give 2 examples (India + one other). Equal space for all four = full marks.' },

  { id:30, type:'long', topic:'why', strip:'strip-why', marks:5,
    q:'Why is power sharing desirable? Discuss with reference to Belgium and Sri Lanka.',
    showAns:false,
    answer:`Power sharing is desirable for two kinds of reasons: prudential (practical) and moral (principled).<br><br>
    <strong>Prudential Reasons — Power Sharing is Practical Wisdom:</strong><br>
    Prudential reasons argue that power sharing is desirable because of its beneficial outcomes:<br>
    • Reduces the possibility of violent social conflict<br>
    • Maintains political stability and social peace<br>
    • Enables economic development (stability attracts investment)<br>
    • Even the majority benefits — civil wars are catastrophic for everyone<br><br>
    <em>Sri Lanka shows the cost of NOT sharing power:</em> The Sinhala majority's majoritarian policies led to Tamil alienation, LTTE, and 26 years of civil war (1983–2009) that killed 70,000–100,000 people and devastated the economy — including the Sinhala community itself. Refusing to share power was ultimately self-defeating.<br><br>
    <strong>Moral Reasons — Power Sharing is the Spirit of Democracy:</strong><br>
    Moral reasons argue that power sharing is intrinsically right, regardless of outcomes:<br>
    • Democracy = rule by ALL the people, not just 50%+1<br>
    • Every citizen has an equal right to participate in governance<br>
    • Majoritarianism = tyranny of the majority = anti-democratic in spirit<br>
    • Power sharing respects the dignity of all communities<br><br>
    <em>Belgium shows the moral and practical benefits of accommodation:</em> Despite having a Dutch majority (59%), Belgium gave equal cabinet representation to the French minority (40%), created community governments, and gradually built a federal system. Result: peaceful coexistence, strong economy, and Belgium became headquarters of the European Union.<br><br>
    <strong>Conclusion:</strong><br>
    The contrast between Belgium (accommodation) and Sri Lanka (majoritarianism) demonstrates both arguments — power sharing prevents destructive conflict (prudential) AND it is the right way to govern a diverse democracy (moral). Both reasons reinforce each other: what is morally right also turns out to be practically wise.`,
    tip:'5-mark "Why is power sharing desirable" = BOTH prudential AND moral reasons, BOTH Belgium AND Sri Lanka examples, conclusion that links them. This is the most important long answer in this chapter.' },
];

function pickColor(type){ return {mcq:'var(--blue)',assert:'var(--violet)',short:'var(--green)',long:'var(--amber)'}[type]||'#fff'; }
function pickLabel(type){ return {mcq:'MCQ',assert:'Assertion–Reason',short:'Short Answer',long:'Long Answer'}[type]||type; }
function pickMarks(type, marks){ if(type==='mcq'||type==='assert') return '1 mark'; return marks+' marks'; }

function render(filter){
  const container = document.getElementById('qMain');
  container.innerHTML = '';
  const list = filter==='all' ? QS : filter==='mcq' ? QS.filter(q=>q.type==='mcq') :
    filter==='assert' ? QS.filter(q=>q.type==='assert') :
    filter==='short'  ? QS.filter(q=>q.type==='short')  : QS.filter(q=>q.type==='long');

  list.forEach((q,i)=>{
    const col = pickColor(q.type);
    const isMCQ = q.type==='mcq'||q.type==='assert';
    let optsHtml = '';
    if(isMCQ){
      optsHtml = `<div class="mcq-body">
        <div class="mcq-opts">
          ${q.opts.map((o,oi)=>`<button class="opt-btn" onclick="checkAns(${q.id},${oi})">
            <span class="opt-lbl">${String.fromCharCode(65+oi)}.</span>${o}
          </button>`).join('')}
        </div>
        <div class="feedback" id="fb${q.id}"></div>
      </div>`;
    }
    const ansSection = !isMCQ ? `
      <button class="show-btn" onclick="toggleAns('ans${q.id}',this)">&#9656; Show Answer</button>
      <div class="ans-reveal" id="ans${q.id}">
        <div class="ans-body">
          <div class="ans-lbl">✦ MODEL ANSWER</div>
          <div class="ans-text">${q.answer}</div>
          ${q.tip?`<div class="tip">📌 Exam Tip: ${q.tip}</div>`:''}
        </div>
      </div>` : `
      <div class="ans-reveal" id="ans${q.id}">
        <div class="ans-body">
          <div class="ans-lbl">✦ EXPLANATION</div>
          <div class="ans-text">${q.explanation}</div>
          ${q.tip?`<div class="tip">📌 Exam Tip: ${q.tip}</div>`:''}
        </div>
      </div>`;

    container.innerHTML += `
    <div class="q-card ${q.strip}">
      <div class="q-header">
        <div class="q-num" style="background:${col}22;color:${col}">${q.id}</div>
        <div class="q-text">${q.q}</div>
      </div>
      <div class="q-meta">
        <span class="badge b-${q.type}">${pickLabel(q.type)}</span>
        <span class="badge b-${q.type==='short'?q.marks+'m':q.type==='long'?q.marks+'m':'1m'}">${pickMarks(q.type,q.marks)}</span>
      </div>
      ${optsHtml}
      ${ansSection}
    </div>`;
  });
}

function checkAns(id, chosen){
  const q = QS.find(x=>x.id===id);
  let card;
  document.querySelectorAll('#qMain .q-card').forEach(c=>{
    if(c.querySelector('.q-num')?.textContent==id) card=c;
  });
  if(!card) return;
  const opts = card.querySelectorAll('.opt-btn');
  opts.forEach((b,i)=>{
    b.disabled=true;
    if(i===q.ans) b.classList.add('correct');
    else if(i===chosen) b.classList.add('wrong');
  });
  const fb = document.getElementById('fb'+id);
  if(fb){ fb.textContent = chosen===q.ans ? '✓ Correct!' : `✗ Incorrect. Correct answer: ${String.fromCharCode(65+q.ans)}.`;
    fb.className = 'feedback '+(chosen===q.ans?'correct':'wrong'); }
  document.getElementById('ans'+id)?.classList.add('open');
}

function toggleAns(id, btn){
  const d=document.getElementById(id);
  d.classList.toggle('open');
  btn.textContent = d.classList.contains('open') ? '▾ Hide Answer' : '▶ Show Answer';
}

function filterQ(type, btn){
  document.querySelectorAll('nav.filters button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render(type);
}

render('all');
</script>
</body>
</html>
