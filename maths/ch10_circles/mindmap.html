<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mind Map — Circles</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #040810; font-family: 'Nunito', sans-serif; overflow: hidden; width: 100vw; height: 100vh; }
canvas { position: absolute; inset: 0; }

#ui {
  position: absolute; top: 0; left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: center;
  padding: .8rem 1.2rem; z-index: 10; pointer-events: none;
}
#ui h1 {
  font-family: 'Syne', sans-serif; font-size: 1.1rem; font-weight: 800;
  background: linear-gradient(135deg,#22c55e,#2dd4bf,#f59e0b);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
#ui p { font-family: 'DM Mono', monospace; font-size: .68rem; color: #475569; margin-top: .1rem; }

.ctrl-bar {
  position: absolute; bottom: 1rem; left: 50%; transform: translateX(-50%);
  display: flex; gap: .5rem; z-index: 10;
}
.ctrl-btn {
  font-family: 'Syne', sans-serif; font-weight: 700; font-size: .75rem;
  padding: .4rem 1rem; border-radius: 99px;
  border: 1.5px solid #334155; background: rgba(30,41,59,.9);
  color: #94a3b8; cursor: pointer; transition: all .2s; pointer-events: all;
}
.ctrl-btn:hover { border-color: #64748b; color: #e2e8f0; }

#tooltip {
  position: absolute; z-index: 20; pointer-events: none;
  background: #1e293b; border: 1px solid #334155;
  border-radius: 12px; padding: .7rem 1rem;
  max-width: 260px; font-size: .82rem; color: #e2e8f0;
  line-height: 1.6; display: none;
  box-shadow: 0 8px 24px rgba(0,0,0,.6);
}
#tooltip strong { font-family: 'Syne', sans-serif; display: block; margin-bottom: .3rem; }

.site-nav {
  display:flex; align-items:center; justify-content:space-between;
  padding:.42rem 1.2rem; width:100%; align-self:stretch; flex-shrink:0;
  background:rgba(4,8,16,.9); backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(26,45,69,.75);
  position:sticky; top:0; z-index:9999;
}
.site-nav-logo { display:flex; align-items:center; text-decoration:none; }
.site-nav-img  { height:28px; width:auto; display:block; border-radius:4px; }
.site-nav-back {
  font-family:'DM Mono',monospace; font-size:.68rem;
  color:#7a9ab8; text-decoration:none; transition:all .2s;
  border:1px solid rgba(26,45,69,.9); border-radius:99px;
  padding:.2rem .65rem; white-space:nowrap;
}
.site-nav-back:hover { color:#dde6f5; border-color:#2a4060; background:rgba(255,255,255,.04); }
</style>
</head>
<body>
<nav class="site-nav"><a href="../../index.html" class="site-nav-logo"><img src="../../logos/learnr-colored-dark.svg" alt="learnr" class="site-nav-img"></a><a href="../../index.html" class="site-nav-back">&#8592; Back to Portal</a></nav>
<div id="ui">
  <div>
    <h1>Circles</h1>
    <p>Class X · CBSE · Mind Map — hover nodes to explore</p>
  </div>
</div>

<div class="ctrl-bar">
  <button class="ctrl-btn" onclick="zoom(1.2)">＋ Zoom</button>
  <button class="ctrl-btn" onclick="zoom(0.83)">－ Zoom</button>
  <button class="ctrl-btn" onclick="resetView()">⌖ Reset</button>
</div>

<div id="tooltip"></div>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const tip = document.getElementById('tooltip');

let W, H, scale = 1, ox = 0, oy = 0;
let dragging = false, dragStart = {x:0,y:0}, dragOrigin = {x:0,y:0};

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  ox = W/2; oy = H/2 + 20;
  draw();
}
window.addEventListener('resize', resize);

const CENTER = {
  id:'c', label:'Circles', x:0, y:0, r:60,
  color:'#001a08', stroke:'#22c55e', textColor:'#86efac', fontSize:16
};

const BRANCHES = [
  {
    id:'basics', label:'Circle\nBasics', x:0, y:-290, r:44,
    color:'#001a08', stroke:'#22c55e', textColor:'#86efac',
    info:'A circle is the set of all points in a plane at a fixed distance (radius) from a fixed point (centre).\nA line and a circle can meet in 0, 1 or 2 points.',
    children:[
      { id:'ba1', label:'Secant\nLine', x:-180, y:-410, r:34, color:'#001a08', stroke:'#4ade80', textColor:'#bbf7d0',
        info:'A secant is a line that intersects a circle at TWO distinct points.\nThe part of a secant inside the circle is a chord.' },
      { id:'ba2', label:'Chord &\nRadius', x:0, y:-440, r:34, color:'#001a08', stroke:'#4ade80', textColor:'#bbf7d0',
        info:'Radius: distance from centre to any point on the circle.\nChord: a line segment joining two points on the circle.\nThe longest chord is the diameter (= 2 × radius).' },
      { id:'ba3', label:'Tangent\nLine', x:180, y:-410, r:34, color:'#001a08', stroke:'#4ade80', textColor:'#bbf7d0',
        info:'A tangent is a line that touches the circle at exactly ONE point — the point of contact.\nIt is the limiting position of a secant whose two points merge.' },
    ]
  },
  {
    id:'tan', label:'Tangent to\na Circle', x:-300, y:-185, r:44,
    color:'#001a12', stroke:'#2dd4bf', textColor:'#99f6e4',
    info:'A tangent touches a circle at exactly one point, called the point of contact.\nThere is exactly one tangent at any point on a circle.',
    children:[
      { id:'t1', label:'Point of\nContact', x:-510, y:-300, r:36, color:'#001a12', stroke:'#5eead4', textColor:'#ccfbf1',
        info:'The single point where a tangent meets the circle is the point of contact.\nAt this point the tangent and circle share exactly one common point.' },
      { id:'t2', label:'Limit of\nSecant', x:-540, y:-170, r:34, color:'#001a12', stroke:'#5eead4', textColor:'#ccfbf1',
        info:'As the two intersection points of a secant come closer, they finally coincide.\nThe secant then becomes a tangent — its limiting position.' },
      { id:'t3', label:'One Tangent\nper Point', x:-510, y:-55, r:34, color:'#001a12', stroke:'#5eead4', textColor:'#ccfbf1',
        info:'Through any point ON a circle, there is one and only one tangent line.' },
      { id:'t4', label:'Touches,\nNot Cuts', x:-330, y:-360, r:34, color:'#001a12', stroke:'#5eead4', textColor:'#ccfbf1',
        info:'A tangent only touches the circle; it never enters it.\nThe whole circle lies on one side of the tangent line.' },
    ]
  },
  {
    id:'perp', label:'Tangent ⊥\nRadius', x:-300, y:185, r:44,
    color:'#1a1200', stroke:'#f59e0b', textColor:'#fde68a',
    info:'THEOREM 1: The tangent at any point of a circle is perpendicular to the radius through the point of contact.\n(Radius ⊥ Tangent at the point of contact.)',
    children:[
      { id:'p1', label:'Radius ⊥\nTangent', x:-510, y:80, r:36, color:'#1a1200', stroke:'#fbbf24', textColor:'#fef3c7',
        info:'At the point of contact, the angle between the radius and the tangent is exactly 90°.\nThis is the key theorem of the chapter.' },
      { id:'p2', label:'Shortest\nDistance', x:-540, y:210, r:34, color:'#1a1200', stroke:'#fbbf24', textColor:'#fef3c7',
        info:'The radius is the shortest distance from the centre to the tangent line.\nThe shortest distance from a point to a line is the perpendicular — hence radius ⊥ tangent.' },
      { id:'p3', label:'Proof by\nContradiction', x:-500, y:340, r:34, color:'#1a1200', stroke:'#fbbf24', textColor:'#fef3c7',
        info:'Assume the radius is NOT perpendicular. Then another point of the tangent would be nearer the centre than the point of contact — but that point would lie inside the circle. Contradiction ⇒ radius ⊥ tangent.' },
      { id:'p4', label:'Converse\nUsed', x:-310, y:390, r:34, color:'#1a1200', stroke:'#fbbf24', textColor:'#fef3c7',
        info:'Converse: a line drawn perpendicular to a radius at its outer end is a tangent to the circle.\nUseful to prove that a given line is a tangent.' },
    ]
  },
  {
    id:'two', label:'Two Tangents\nTheorem', x:300, y:-185, r:44,
    color:'#12041c', stroke:'#d946ef', textColor:'#f0abfc',
    info:'THEOREM 2: The lengths of the two tangents drawn from an external point to a circle are equal.\nPA = PB where P is external and A, B are points of contact.',
    children:[
      { id:'w1', label:'Equal\nLengths', x:510, y:-300, r:36, color:'#12041c', stroke:'#e879f9', textColor:'#f5d0fe',
        info:'From an external point P, the two tangent segments PA and PB are equal:\nPA = PB.\nThe two tangents are mirror images about the line joining P to the centre.' },
      { id:'w2', label:'Congruent\nTriangles', x:540, y:-170, r:34, color:'#12041c', stroke:'#e879f9', textColor:'#f5d0fe',
        info:'Proof: △OAP ≅ △OBP (RHS) — OA=OB (radii), OP common, ∠OAP=∠OBP=90°.\nSo PA = PB by CPCT.' },
      { id:'w3', label:'Equal\nAngles', x:510, y:-55, r:34, color:'#12041c', stroke:'#e879f9', textColor:'#f5d0fe',
        info:'The line from the external point to the centre bisects the angle between the two tangents, and also bisects the angle between the two radii.\n∠OPA = ∠OPB.' },
    ]
  },
  {
    id:'num', label:'Number of\nTangents', x:300, y:185, r:44,
    color:'#0a0020', stroke:'#818cf8', textColor:'#c7d2fe',
    info:'The number of tangents from a point depends on its position relative to the circle: inside (0), on (1), or outside (2).',
    children:[
      { id:'n1', label:'Inside →\n0 Tangents', x:510, y:80, r:36, color:'#0a0020', stroke:'#a5b4fc', textColor:'#e0e7ff',
        info:'A point lying INSIDE the circle has NO tangent through it — every line through it is a secant.' },
      { id:'n2', label:'On →\n1 Tangent', x:540, y:220, r:34, color:'#0a0020', stroke:'#a5b4fc', textColor:'#e0e7ff',
        info:'A point ON the circle has exactly ONE tangent — the tangent at that point.' },
      { id:'n3', label:'Outside →\n2 Tangents', x:500, y:360, r:34, color:'#0a0020', stroke:'#a5b4fc', textColor:'#e0e7ff',
        info:'A point OUTSIDE the circle has exactly TWO tangents, and they are equal in length.' },
      { id:'n4', label:'Length\n√(d²−r²)', x:310, y:390, r:34, color:'#0a0020', stroke:'#a5b4fc', textColor:'#e0e7ff',
        info:'Tangent length from an external point at distance d from the centre of a circle of radius r:\nℓ = √(d² − r²)\n(from the right triangle radius ⊥ tangent).' },
    ]
  },
  {
    id:'app', label:'Applications', x:0, y:290, r:44,
    color:'#1a0010', stroke:'#f43f5e', textColor:'#fda4af',
    info:'Tangent properties solve problems on quadrilaterals circumscribing circles, wheels, pulleys and geometry proofs.',
    children:[
      { id:'ap1', label:'Circumscribed\nQuadrilateral', x:-170, y:420, r:34, color:'#1a0010', stroke:'#fb7185', textColor:'#fecdd3',
        info:'For a quadrilateral ABCD circumscribing a circle, the sums of opposite sides are equal:\nAB + CD = BC + DA\n(from equal tangents at each vertex).' },
      { id:'ap2', label:'Angle at\nCentre', x:0, y:460, r:34, color:'#1a0010', stroke:'#fb7185', textColor:'#fecdd3',
        info:'The angle between two tangents from an external point and the angle subtended by the two radii at the centre are supplementary (add to 180°).' },
      { id:'ap3', label:'Real-World\nWheels', x:170, y:420, r:34, color:'#1a0010', stroke:'#fb7185', textColor:'#fecdd3',
        info:'Tangents model belts on pulleys, a bicycle chain, and a ball resting on the ground — the contact line is tangent to the circle.' },
    ]
  }
];

// Build flat list
const allNodes = [CENTER];
const allEdges = [];
BRANCHES.forEach(b => {
  allNodes.push(b);
  allEdges.push({from:'c', to:b.id});
  (b.children||[]).forEach(ch => {
    allNodes.push(ch);
    allEdges.push({from:b.id, to:ch.id});
  });
});

function getNode(id) { return allNodes.find(n=>n.id===id); }

// Pan & zoom
canvas.addEventListener('mousedown', e => { dragging=true; dragStart={x:e.clientX,y:e.clientY}; dragOrigin={x:ox,y:oy}; });
canvas.addEventListener('mousemove', e => {
  if (dragging) { ox = dragOrigin.x+(e.clientX-dragStart.x); oy = dragOrigin.y+(e.clientY-dragStart.y); draw(); return; }
  const mx=(e.clientX-ox)/scale, my=(e.clientY-oy)/scale;
  let found=null;
  allNodes.forEach(n=>{ const dx=mx-n.x,dy=my-n.y; if(Math.sqrt(dx*dx+dy*dy)<n.r+6) found=n; });
  if(found && found.info){ tip.style.display='block'; tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY-10)+'px';
    tip.innerHTML=`<strong>${found.label.replace(/\n/g,' ')}</strong>${found.info.replace(/\n/g,'<br>')}`;
    canvas.style.cursor='pointer';
  } else { tip.style.display='none'; canvas.style.cursor='grab'; }
});
canvas.addEventListener('mouseup', ()=>dragging=false);
canvas.addEventListener('mouseleave', ()=>{ dragging=false; tip.style.display='none'; });
canvas.addEventListener('wheel', e=>{ e.preventDefault(); const f=e.deltaY<0?1.1:0.91; zoomAt(f,e.clientX,e.clientY); },{passive:false});

// Touch
let lastTouchDist=null;
canvas.addEventListener('touchstart',e=>{ if(e.touches.length===1){ dragging=true; dragStart={x:e.touches[0].clientX,y:e.touches[0].clientY}; dragOrigin={x:ox,y:oy}; }});
canvas.addEventListener('touchmove',e=>{ e.preventDefault();
  if(e.touches.length===1&&dragging){ ox=dragOrigin.x+(e.touches[0].clientX-dragStart.x); oy=dragOrigin.y+(e.touches[0].clientY-dragStart.y); draw(); }
  if(e.touches.length===2){ const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    if(lastTouchDist){ const cx=(e.touches[0].clientX+e.touches[1].clientX)/2,cy=(e.touches[0].clientY+e.touches[1].clientY)/2; zoomAt(d/lastTouchDist,cx,cy); }
    lastTouchDist=d; }
},{passive:false});
canvas.addEventListener('touchend',()=>{ dragging=false; lastTouchDist=null; });

function zoomAt(f,cx,cy){ const prev=scale; scale=Math.max(.3,Math.min(2.5,scale*f)); ox=cx-(cx-ox)*(scale/prev); oy=cy-(cy-oy)*(scale/prev); draw(); }
function zoom(f){ zoomAt(f,W/2,H/2); }
function resetView(){ scale=1; ox=W/2; oy=H/2+20; draw(); }

// Draw
function draw() {
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(ox,oy);
  ctx.scale(scale,scale);

  // grid
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,.025)';
  ctx.lineWidth=1;
  for(let x=-1000;x<1000;x+=60){ ctx.beginPath();ctx.moveTo(x,-1000);ctx.lineTo(x,1000);ctx.stroke(); }
  for(let y=-1000;y<1000;y+=60){ ctx.beginPath();ctx.moveTo(-1000,y);ctx.lineTo(1000,y);ctx.stroke(); }
  ctx.restore();

  // edges
  allEdges.forEach(e=>{
    const a=getNode(e.from),b=getNode(e.to);
    if(!a||!b)return;
    const grd=ctx.createLinearGradient(a.x,a.y,b.x,b.y);
    grd.addColorStop(0,a.stroke+'88');
    grd.addColorStop(1,b.stroke+'44');
    ctx.beginPath();
    const cx=(a.x+b.x)/2, cy=(a.y+b.y)/2-30;
    ctx.moveTo(a.x,a.y);
    ctx.quadraticCurveTo(cx,cy,b.x,b.y);
    ctx.strokeStyle=grd;
    ctx.lineWidth=e.from==='c'?2.5:1.5;
    ctx.setLineDash(e.from==='c'?[]:[4,4]);
    ctx.stroke();
    ctx.setLineDash([]);
  });

  // nodes
  allNodes.forEach(n=>{
    ctx.save();
    ctx.shadowColor=n.stroke;
    ctx.shadowBlur=n.id==='c'?30:16;
    ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
    ctx.fillStyle=n.color;
    ctx.fill();
    ctx.restore();

    ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
    ctx.strokeStyle=n.stroke;
    ctx.lineWidth=n.id==='c'?3:2;
    ctx.stroke();

    ctx.fillStyle=n.textColor;
    ctx.font=`700 ${n.fontSize||11}px Nunito,sans-serif`;
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    const lines=n.label.split('\n');
    const lh=14;
    const startY=n.y-(lines.length-1)*lh/2;
    lines.forEach((l,i)=>ctx.fillText(l,n.x,startY+i*lh));
  });

  ctx.restore();
}

resize();
</script>
</body>
</html>
