<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards — Circles</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Mono:wght@400;500&family=Lato:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#040810;--card:#0a1422;--card2:#0f1c30;--border:#1a2d45;--text:#cce4ff;--muted:#4a6890;
  --amber:#f59e0b;--teal:#2dd4bf;--blue:#38bdf8;--green:#22c55e;--red:#f43f5e;--indigo:#818cf8;--purple:#d946ef;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Lato',sans-serif;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(34,197,94,.06) 0%,transparent 60%);}

.site-nav{display:flex;align-items:center;justify-content:space-between;padding:.42rem 1.2rem;
  background:rgba(4,8,16,.9);backdrop-filter:blur(14px);border-bottom:1px solid rgba(26,45,69,.75);position:sticky;top:0;z-index:9999;}
.site-nav-logo{display:flex;align-items:center;text-decoration:none;}
.site-nav-img{height:28px;}
.site-nav-back{font-family:'DM Mono',monospace;font-size:.68rem;color:#7a9ab8;text-decoration:none;border:1px solid rgba(26,45,69,.9);border-radius:99px;padding:.2rem .65rem;}
.site-nav-back:hover{color:#dde6f5;}

header{text-align:center;padding:1.4rem 1rem .4rem;}
header h1{font-family:'Playfair Display',serif;font-size:clamp(1.3rem,4vw,2rem);font-weight:900;color:var(--green);}
header p{color:var(--muted);font-family:'DM Mono',monospace;font-size:.72rem;margin-top:.3rem;}

.filters{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;padding:.8rem 1rem;max-width:800px;margin:0 auto;}
.filt{font-family:'DM Mono',monospace;font-size:.68rem;padding:.3rem .7rem;border-radius:99px;border:1px solid var(--border);
  background:var(--card);color:var(--muted);cursor:pointer;transition:.15s;}
.filt:hover{color:var(--text);}
.filt.active{background:var(--green);color:#04121e;border-color:var(--green);font-weight:700;}

.progress{text-align:center;font-family:'DM Mono',monospace;font-size:.7rem;color:var(--muted);margin:.3rem 0;}

.stage{max-width:560px;margin:0 auto;padding:1rem 1.2rem 2rem;}
.card{perspective:1600px;height:340px;cursor:pointer;}
.card-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;}
.card.flipped .card-inner{transform:rotateY(180deg);}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;border:1px solid var(--border);
  background:var(--card);padding:1.6rem;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
.face-back{transform:rotateY(180deg);background:var(--card2);}
.cat-tag{position:absolute;top:1rem;left:1rem;font-family:'DM Mono',monospace;font-size:.62rem;padding:.2rem .55rem;border-radius:99px;}
.face .side{position:absolute;top:1rem;right:1rem;font-family:'DM Mono',monospace;font-size:.6rem;color:var(--muted);}
.q-text{font-family:'Playfair Display',serif;font-size:1.15rem;font-weight:700;line-height:1.45;}
.a-text{font-size:.95rem;line-height:1.6;color:var(--text);}
.hint{margin-top:1rem;font-family:'DM Mono',monospace;font-size:.66rem;color:var(--muted);font-style:italic;}
.flip-hint{position:absolute;bottom:1rem;font-family:'DM Mono',monospace;font-size:.6rem;color:var(--muted);}

.controls{display:flex;align-items:center;justify-content:center;gap:.6rem;margin-top:1.2rem;}
.btn{font-family:'DM Mono',monospace;font-size:.72rem;padding:.5rem .9rem;border-radius:8px;border:1px solid var(--border);
  background:var(--card);color:var(--text);cursor:pointer;transition:.15s;}
.btn:hover{border-color:var(--green);color:var(--green);}
.btn-known{border-color:rgba(34,197,94,.4);color:var(--green);}
.btn-review{border-color:rgba(245,158,11,.4);color:var(--amber);}
.mark-row{display:flex;justify-content:center;gap:.6rem;margin-top:.7rem;}
.counter{font-family:'DM Mono',monospace;font-size:.8rem;color:var(--muted);min-width:64px;text-align:center;}
.util-row{display:flex;justify-content:center;gap:.6rem;margin-top:1rem;}
</style>
</head>
<body>
<nav class="site-nav">
  <a href="../../index.html" class="site-nav-logo"><img src="../../logos/learnr-colored-dark.svg" alt="learnr" class="site-nav-img"></a>
  <a href="../../index.html" class="site-nav-back">&#8592; Back to Portal</a>
</nav>
<header>
  <h1>Circles</h1>
  <p>Class X · Mathematics Ch.10 · 36 Flashcards · 6 Categories</p>
</header>

<div class="filters" id="filters"></div>
<div class="progress" id="progress"></div>

<div class="stage">
  <div class="card" id="card" onclick="flip()">
    <div class="card-inner">
      <div class="face face-front">
        <span class="cat-tag" id="catFront"></span>
        <span class="side" id="sideFront"></span>
        <div class="q-text" id="qText"></div>
        <div class="hint" id="hintText"></div>
        <div class="flip-hint">click / space to flip →</div>
      </div>
      <div class="face face-back">
        <span class="cat-tag" id="catBack"></span>
        <span class="side">answer</span>
        <div class="a-text" id="aText"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" onclick="nav(-1)">← Prev</button>
    <span class="counter" id="counter"></span>
    <button class="btn" onclick="nav(1)">Next →</button>
  </div>
  <div class="mark-row">
    <button class="btn btn-known" onclick="markKnown()">✓ Known</button>
    <button class="btn btn-review" onclick="markReview()">↻ Review</button>
  </div>
  <div class="util-row">
    <button class="btn" onclick="shuffle()">🔀 Shuffle</button>
    <button class="btn" onclick="resetAll()">♻ Reset</button>
  </div>
</div>

<script>
const catColors={bas:'#22c55e',tan:'#2dd4bf',perp:'#f59e0b',two:'#d946ef',num:'#818cf8',app:'#f43f5e'};
const catNames={bas:'Basics',tan:'Tangent',perp:'Radius⊥Tan',two:'Two Tangents',num:'No. of Tangents',app:'Applications'};

const ALL_CARDS=[
// BASICS
{cat:'bas',q:'Define a circle.',a:'The set of all points in a plane that are at a fixed distance (the radius) from a fixed point (the centre).',hint:'fixed distance from a point'},
{cat:'bas',q:'In how many points can a line meet a circle?',a:'In 0 points (non-intersecting), 1 point (tangent) or 2 points (secant).',hint:'0, 1 or 2'},
{cat:'bas',q:'What is a secant of a circle?',a:'A line that intersects the circle at two distinct points. The part inside the circle is a chord.',hint:'cuts at two points'},
{cat:'bas',q:'What is a chord? What is the longest chord?',a:'A chord joins two points on the circle. The longest chord is the diameter (= 2 × radius), passing through the centre.',hint:'diameter is longest'},
{cat:'bas',q:'How is a tangent related to a secant?',a:'A tangent is the limiting position of a secant when its two points of intersection coincide into one.',hint:'points merge'},
{cat:'bas',q:'What does the perpendicular from the centre to a chord do?',a:'It bisects the chord (splits it into two equal halves).',hint:'bisects the chord'},
// TANGENT
{cat:'tan',q:'Define a tangent to a circle.',a:'A line that touches the circle at exactly one point, called the point of contact.',hint:'touches at one point'},
{cat:'tan',q:'How many tangents can be drawn at a point ON a circle?',a:'Exactly one tangent can be drawn at any given point on the circle.',hint:'one per point'},
{cat:'tan',q:'Does a tangent cut through a circle?',a:'No — it only touches the circle. The entire circle lies on one side of the tangent line.',hint:'touches, never cuts'},
{cat:'tan',q:'What is the point of contact?',a:'The single common point where the tangent meets the circle.',hint:'the touching point'},
{cat:'tan',q:'Are the two tangents at the ends of a diameter parallel?',a:'Yes — the tangents drawn at the two endpoints of a diameter are parallel to each other.',hint:'parallel tangents'},
{cat:'tan',q:'Can a tangent pass through the interior of a circle?',a:'No. A tangent lies entirely outside the circle except at the single point of contact.',hint:'stays outside'},
// RADIUS ⊥ TANGENT
{cat:'perp',q:'State Theorem 1 of the Circles chapter.',a:'The tangent at any point of a circle is perpendicular to the radius through the point of contact.',hint:'radius ⊥ tangent'},
{cat:'perp',q:'What is the angle between a radius and the tangent at the point of contact?',a:'Exactly 90° (a right angle).',hint:'90°'},
{cat:'perp',q:'Why is the radius perpendicular to the tangent?',a:'The radius is the shortest distance from the centre to the tangent line, and the shortest distance to a line is the perpendicular.',hint:'shortest distance'},
{cat:'perp',q:'State the converse of the tangent-radius theorem.',a:'A line drawn perpendicular to a radius at its outer endpoint is a tangent to the circle.',hint:'used to prove tangent'},
{cat:'perp',q:'How is Theorem 1 proved?',a:'By contradiction: if the radius were not perpendicular, another point of the tangent would be nearer the centre and lie inside the circle — impossible.',hint:'contradiction'},
{cat:'perp',q:'Why is the 90° angle so useful in problems?',a:'It creates a right triangle (radius, tangent, line to centre) letting you use Pythagoras and trigonometry.',hint:'makes a right triangle'},
// TWO TANGENTS
{cat:'two',q:'State Theorem 2 of the Circles chapter.',a:'The lengths of the two tangents drawn from an external point to a circle are equal (PA = PB).',hint:'equal tangent lengths'},
{cat:'two',q:'How do you prove the two tangents from an external point are equal?',a:'Show △OAP ≅ △OBP by RHS (OA=OB radii, OP common, right angles at A,B), then PA=PB by CPCT.',hint:'RHS congruence'},
{cat:'two',q:'What does the line from the external point to the centre bisect?',a:'It bisects the angle between the two tangents (∠APB) and the angle between the two radii (∠AOB).',hint:'bisects both angles'},
{cat:'two',q:'If two tangents PA and PB make PA = 7 cm, what is PB?',a:'PB = 7 cm — the two tangents from the same external point are always equal.',hint:'equal to PA'},
{cat:'two',q:'What is the relation between ∠OPA and ∠OPB?',a:'They are equal — OP bisects the angle between the tangents.',hint:'equal angles'},
{cat:'two',q:'What quadrilateral is OAPB (O centre, A,B contacts, P external)?',a:'A kite — OA=OB (radii) and PA=PB (tangents), with right angles at A and B.',hint:'a kite shape'},
// NUMBER OF TANGENTS
{cat:'num',q:'How many tangents can be drawn from a point INSIDE a circle?',a:'None (0). Every line through an interior point is a secant.',hint:'zero'},
{cat:'num',q:'How many tangents from a point ON the circle?',a:'Exactly one — the tangent at that point.',hint:'one'},
{cat:'num',q:'How many tangents from a point OUTSIDE the circle?',a:'Exactly two, and they are equal in length.',hint:'two, equal'},
{cat:'num',q:'Give the formula for the tangent length from an external point.',a:'ℓ = √(d² − r²), where d = distance from centre and r = radius.',hint:'√(d²−r²)'},
{cat:'num',q:'A point is 13 cm from the centre of a circle of radius 5 cm. Find the tangent length.',a:'ℓ = √(13² − 5²) = √(169−25) = √144 = 12 cm.',hint:'√(d²−r²)'},
{cat:'num',q:'What right triangle gives the tangent-length formula?',a:'Hypotenuse = d (centre to external point), one leg = r (radius), other leg = tangent length.',hint:'Pythagoras'},
// APPLICATIONS
{cat:'app',q:'For a quadrilateral circumscribing a circle, what is true about its sides?',a:'The sums of opposite sides are equal: AB + CD = BC + DA.',hint:'opposite sides sum equal'},
{cat:'app',q:'Why is AB + CD = BC + DA for a circumscribed quadrilateral?',a:'Because tangents from each vertex are equal; adding these equal tangent segments gives the relation.',hint:'equal tangents'},
{cat:'app',q:'What is the relation between the angle between two tangents and the angle between the radii?',a:'They are supplementary — they add up to 180°.',hint:'sum = 180°'},
{cat:'app',q:'Give a real-world example of a tangent.',a:'A bicycle chain / belt on a pulley, or a ball resting on the ground — the line of contact is tangent to the circle.',hint:'belts, balls on ground'},
{cat:'app',q:'A parallelogram circumscribes a circle. What special figure must it be?',a:'A rhombus — since opposite side sums are equal, all four sides become equal.',hint:'rhombus'},
{cat:'app',q:'Two concentric circles: a chord of the larger touches the smaller. What does the smaller do to the chord?',a:'It bisects the chord — the point of contact is the midpoint of that chord.',hint:'bisects the chord'},
];

let cards=[...ALL_CARDS];
let idx=0, filter='all';
const known=new Set(), review=new Set();

function buildFilters(){
  const f=document.getElementById('filters');
  const cats=['all',...Object.keys(catNames)];
  f.innerHTML=cats.map(c=>{
    const label=c==='all'?'All':catNames[c];
    return `<button class="filt${c===filter?' active':''}" onclick="setFilter('${c}')">${label}</button>`;
  }).join('');
}
function setFilter(c){
  filter=c;
  cards = c==='all' ? [...ALL_CARDS] : ALL_CARDS.filter(x=>x.cat===c);
  idx=0; buildFilters(); render();
}
function render(){
  if(!cards.length)return;
  const card=cards[idx];
  document.getElementById('card').classList.remove('flipped');
  const col=catColors[card.cat];
  document.getElementById('catFront').outerHTML=`<span class="cat-tag" id="catFront" style="background:${col}22;color:${col}">${catNames[card.cat]}</span>`;
  document.getElementById('catBack').outerHTML=`<span class="cat-tag" id="catBack" style="background:${col}22;color:${col}">${catNames[card.cat]}</span>`;
  document.getElementById('qText').textContent=card.q;
  document.getElementById('aText').textContent=card.a;
  document.getElementById('hintText').textContent='💡 '+card.hint;
  document.getElementById('sideFront').textContent='question';
  document.getElementById('counter').textContent=`${idx+1} / ${cards.length}`;
  updateProgress();
}
function updateProgress(){
  document.getElementById('progress').textContent=
    `Known: ${known.size}  ·  To review: ${review.size}  ·  Total: ${ALL_CARDS.length}`;
}
function flip(){document.getElementById('card').classList.toggle('flipped');}
function nav(d){idx=(idx+d+cards.length)%cards.length;render();}
function markKnown(){const c=cards[idx];known.add(c.q);review.delete(c.q);updateProgress();nav(1);}
function markReview(){const c=cards[idx];review.add(c.q);known.delete(c.q);updateProgress();nav(1);}
function shuffle(){for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]];}idx=0;render();}
function resetAll(){known.clear();review.clear();setFilter('all');}
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();flip();}
  else if(e.code==='ArrowRight')nav(1);
  else if(e.code==='ArrowLeft')nav(-1);
});
buildFilters();render();
</script>
</body>
</html>
