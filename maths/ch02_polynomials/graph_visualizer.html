<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polynomial Graph Visualizer — learnr</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Mono:wght@400;500&family=Lato:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#040810; --card:#0a1422; --card2:#0f1c30;
    --border:#1a2d45; --text:#cce4ff; --muted:#4a6890;
    --amber:#f59e0b; --teal:#2dd4bf; --blue:#38bdf8;
    --green:#22c55e; --red:#f43f5e; --indigo:#818cf8; --purple:#d946ef;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    background:var(--bg); color:var(--text); font-family:'Lato',sans-serif;
    display:flex; flex-direction:column; overflow:hidden; height:100vh;
  }

  /* ── Site Nav ── */
  .site-nav {
    display:flex; align-items:center; justify-content:space-between;
    padding:.42rem 1.2rem; flex-shrink:0;
    background:rgba(7,16,31,.95); backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(26,45,69,.75);
    z-index:9999;
  }
  .site-nav-logo { display:flex; align-items:center; text-decoration:none; }
  .site-nav-img  { height:28px; width:auto; display:block; border-radius:4px; }
  .site-nav-title { font-family:'Playfair Display',serif; font-size:.9rem; font-weight:700;
    color:var(--amber); margin-left:1rem; }
  .site-nav-back {
    font-family:'DM Mono',monospace; font-size:.68rem;
    color:#7a9ab8; text-decoration:none; transition:all .2s;
    border:1px solid rgba(26,45,69,.9); border-radius:99px;
    padding:.2rem .65rem; white-space:nowrap;
  }
  .site-nav-back:hover { color:#dde6f5; border-color:#2a4060; background:rgba(255,255,255,.04); }

  /* ── Main layout ── */
  .main { display:flex; flex:1; overflow:hidden; }

  /* ── Control Panel ── */
  .panel {
    width:300px; flex-shrink:0; overflow-y:auto;
    background:var(--card); border-right:1px solid var(--border);
    display:flex; flex-direction:column; gap:0;
  }
  @media(max-width:680px){
    .main { flex-direction:column; }
    .panel { width:100%; height:auto; max-height:42vh; border-right:none; border-bottom:1px solid var(--border); }
  }

  .panel-section { border-bottom:1px solid var(--border); padding:.85rem 1rem; }
  .panel-section:last-child { border-bottom:none; }
  .sec-title {
    font-family:'Playfair Display',serif; font-weight:900; font-size:.82rem;
    margin-bottom:.65rem; display:flex; align-items:center; gap:.4rem;
  }

  /* Degree tabs */
  .deg-tabs { display:flex; gap:.3rem; margin-bottom:.75rem; flex-wrap:wrap; }
  .deg-btn {
    font-family:'DM Mono',monospace; font-size:.68rem;
    padding:.3rem .7rem; border-radius:4px; border:1px solid var(--border);
    background:var(--card2); color:var(--muted); cursor:pointer; transition:all .18s;
  }
  .deg-btn:hover { color:var(--text); border-color:#2a4a6a; }
  .deg-btn.active { color:#040810; border-color:transparent; font-weight:700; }
  .d1.active { background:var(--green); }
  .d2.active { background:var(--amber); }
  .d3.active { background:var(--purple); }
  .d4.active { background:var(--blue); }

  /* Coefficient inputs */
  .coeff-grid { display:flex; flex-direction:column; gap:.45rem; }
  .coeff-row { display:flex; align-items:center; gap:.5rem; }
  .coeff-label {
    font-family:'DM Mono',monospace; font-size:.7rem; color:var(--muted);
    min-width:80px; text-align:right; flex-shrink:0;
  }
  .coeff-label span { color:var(--amber); font-weight:600; }
  .coeff-input {
    flex:1; background:var(--card2); border:1px solid var(--border); border-radius:6px;
    color:var(--text); font-family:'DM Mono',monospace; font-size:.82rem;
    padding:.32rem .6rem; outline:none; transition:border-color .18s;
    min-width:0;
  }
  .coeff-input:focus { border-color:var(--amber); }
  .coeff-input.inactive { opacity:.28; pointer-events:none; }

  /* Equation display */
  .eq-display {
    font-family:'DM Mono',monospace; font-size:.76rem;
    background:var(--card2); border:1px solid var(--border); border-radius:8px;
    padding:.55rem .75rem; margin-top:.6rem; color:var(--teal);
    word-break:break-all; line-height:1.5;
    min-height:2.2rem;
  }

  /* Range controls */
  .range-row { display:flex; align-items:center; gap:.5rem; margin-bottom:.4rem; }
  .range-label { font-family:'DM Mono',monospace; font-size:.68rem; color:var(--muted); min-width:50px; }
  .range-input {
    flex:1; background:var(--card2); border:1px solid var(--border); border-radius:6px;
    color:var(--text); font-family:'DM Mono',monospace; font-size:.78rem;
    padding:.28rem .5rem; outline:none; transition:border-color .18s; min-width:0;
  }
  .range-input:focus { border-color:var(--blue); }

  /* Action buttons */
  .action-row { display:flex; gap:.4rem; flex-wrap:wrap; margin-top:.3rem; }
  .act-btn {
    font-family:'Playfair Display',serif; font-weight:700; font-size:.72rem;
    padding:.35rem .85rem; border-radius:4px; border:1px solid var(--border);
    background:var(--card2); color:var(--muted); cursor:pointer; transition:all .18s; flex:1;
  }
  .act-btn:hover { border-color:var(--amber); color:var(--amber); }
  .act-btn.primary { background:rgba(245,158,11,.12); border-color:var(--amber); color:var(--amber); }
  .act-btn.primary:hover { background:rgba(245,158,11,.22); }

  /* Info panel */
  .info-box {
    background:var(--card2); border-radius:8px; padding:.6rem .8rem;
    font-size:.74rem; line-height:1.65;
  }
  .info-row { display:flex; justify-content:space-between; gap:.5rem; padding:.15rem 0;
    border-top:1px solid var(--border); }
  .info-row:first-child { border-top:none; }
  .info-key { color:var(--muted); font-family:'DM Mono',monospace; font-size:.68rem; }
  .info-val { color:var(--teal); font-family:'DM Mono',monospace; font-size:.68rem; text-align:right; word-break:break-all; }
  .zeroes-list { color:var(--amber); font-family:'DM Mono',monospace; font-size:.68rem; }

  /* Presets */
  .preset-grid { display:flex; flex-wrap:wrap; gap:.3rem; }
  .preset-btn {
    font-family:'DM Mono',monospace; font-size:.64rem;
    padding:.25rem .6rem; border-radius:4px; border:1px solid var(--border);
    background:var(--card2); color:var(--muted); cursor:pointer; transition:all .18s;
  }
  .preset-btn:hover { color:var(--text); border-color:#2a4a6a; }

  /* Canvas area */
  .canvas-wrap {
    flex:1; position:relative; overflow:hidden; cursor:grab; background:var(--bg);
  }
  .canvas-wrap:active { cursor:grabbing; }
  canvas { display:block; width:100%; height:100%; }

  /* Overlay info */
  .canvas-overlay {
    position:absolute; top:.7rem; right:.7rem;
    display:flex; flex-direction:column; gap:.3rem; pointer-events:none;
  }
  .overlay-pill {
    font-family:'DM Mono',monospace; font-size:.62rem;
    background:rgba(4,8,16,.8); border:1px solid rgba(26,45,69,.8);
    border-radius:6px; padding:.2rem .5rem; color:var(--muted);
    pointer-events:auto;
  }
  .overlay-btn {
    font-family:'DM Mono',monospace; font-size:.62rem;
    background:rgba(10,20,34,.9); border:1px solid var(--border);
    border-radius:6px; padding:.22rem .55rem; color:var(--muted);
    cursor:pointer; transition:all .16s; pointer-events:auto;
  }
  .overlay-btn:hover { color:var(--amber); border-color:var(--amber); }
  #coord-display {
    font-family:'DM Mono',monospace; font-size:.65rem;
    position:absolute; bottom:.7rem; left:.8rem;
    background:rgba(4,8,16,.8); border:1px solid rgba(26,45,69,.6);
    border-radius:6px; padding:.2rem .55rem; color:var(--muted); pointer-events:none;
  }
</style>
</head>
<body>

<nav class="site-nav">
  <div style="display:flex;align-items:center">
    <a href="../../index.html" class="site-nav-logo">
      <img src="../../logos/learnr-colored-dark.svg" alt="learnr" class="site-nav-img">
    </a>
    <span class="site-nav-title">Polynomial Graph Visualizer</span>
  </div>
  <a href="../../index.html" class="site-nav-back">&#8592; Back to Portal</a>
</nav>

<div class="main">

  <!-- ── Control Panel ── -->
  <div class="panel">

    <!-- Degree selector -->
    <div class="panel-section">
      <div class="sec-title" style="color:var(--amber)">📐 Degree</div>
      <div class="deg-tabs">
        <button class="deg-btn d1" onclick="setDegree(1,this)">Linear</button>
        <button class="deg-btn d2 active" onclick="setDegree(2,this)">Quadratic</button>
        <button class="deg-btn d3" onclick="setDegree(3,this)">Cubic</button>
        <button class="deg-btn d4" onclick="setDegree(4,this)">Quartic</button>
      </div>

      <!-- Coefficient inputs -->
      <div class="coeff-grid" id="coeff-grid">
        <div class="coeff-row" id="row-a">
          <div class="coeff-label" id="lbl-a"><span>a</span> =</div>
          <input class="coeff-input" id="inp-a" type="number" value="1" step="0.5" oninput="draw()">
        </div>
        <div class="coeff-row" id="row-b">
          <div class="coeff-label" id="lbl-b"><span>b</span> =</div>
          <input class="coeff-input" id="inp-b" type="number" value="0" step="0.5" oninput="draw()">
        </div>
        <div class="coeff-row" id="row-c">
          <div class="coeff-label" id="lbl-c"><span>c</span> =</div>
          <input class="coeff-input" id="inp-c" type="number" value="-4" step="0.5" oninput="draw()">
        </div>
        <div class="coeff-row" id="row-d">
          <div class="coeff-label" id="lbl-d"><span>d</span> =</div>
          <input class="coeff-input inactive" id="inp-d" type="number" value="0" step="0.5" oninput="draw()">
        </div>
        <div class="coeff-row" id="row-e">
          <div class="coeff-label" id="lbl-e"><span>e</span> =</div>
          <input class="coeff-input inactive" id="inp-e" type="number" value="0" step="0.5" oninput="draw()">
        </div>
      </div>

      <div class="eq-display" id="eq-display">y = x² − 4</div>
    </div>

    <!-- Presets -->
    <div class="panel-section">
      <div class="sec-title" style="color:var(--indigo)">⚡ Presets</div>
      <div class="preset-grid" id="preset-grid"></div>
    </div>

    <!-- View range -->
    <div class="panel-section">
      <div class="sec-title" style="color:var(--blue)">🔭 View Range</div>
      <div class="range-row">
        <div class="range-label">x from</div>
        <input class="range-input" id="xmin" type="number" value="-10" oninput="draw()">
        <div class="range-label" style="min-width:20px;text-align:center">to</div>
        <input class="range-input" id="xmax" type="number" value="10" oninput="draw()">
      </div>
      <div class="range-row">
        <div class="range-label">y from</div>
        <input class="range-input" id="ymin" type="number" value="-15" oninput="draw()">
        <div class="range-label" style="min-width:20px;text-align:center">to</div>
        <input class="range-input" id="ymax" type="number" value="15" oninput="draw()">
      </div>
      <div class="action-row">
        <button class="act-btn" onclick="resetView()">↺ Reset View</button>
        <button class="act-btn" onclick="autoFit()">⊡ Auto Fit</button>
      </div>
    </div>

    <!-- Calculated info -->
    <div class="panel-section">
      <div class="sec-title" style="color:var(--teal)">📊 Analysis</div>
      <div class="info-box" id="info-box">
        <div class="info-row"><span class="info-key">Degree</span><span class="info-val" id="inf-deg">2</span></div>
        <div class="info-row"><span class="info-key">y-intercept</span><span class="info-val" id="inf-yint">−4</span></div>
        <div class="info-row"><span class="info-key">Zeroes (x-axis)</span><span class="zeroes-list" id="inf-zeroes">−2, 2</span></div>
        <div class="info-row"><span class="info-key">Vertex / Turning pt</span><span class="info-val" id="inf-vertex">(0, −4)</span></div>
        <div class="info-row"><span class="info-key">Opens / Direction</span><span class="info-val" id="inf-dir">Upward ∪</span></div>
        <div class="info-row"><span class="info-key">Discriminant (D)</span><span class="info-val" id="inf-disc">16</span></div>
      </div>
    </div>

  </div>

  <!-- ── Canvas ── -->
  <div class="canvas-wrap" id="canvas-wrap">
    <canvas id="graph"></canvas>
    <div class="canvas-overlay">
      <button class="overlay-btn" onclick="zoom(1.25)">＋ Zoom In</button>
      <button class="overlay-btn" onclick="zoom(0.8)">− Zoom Out</button>
      <button class="overlay-btn" onclick="resetView()">⌂ Reset</button>
      <div class="overlay-pill" id="scale-pill">Scale: 1 unit = ?px</div>
    </div>
    <div id="coord-display">x: 0.00 &nbsp;|&nbsp; y: 0.00</div>
  </div>

</div>

<script>
// ──────────────────────────────────────────────
// State
// ──────────────────────────────────────────────
let degree = 2;
let viewXmin = -10, viewXmax = 10, viewYmin = -15, viewYmax = 15;
let isDragging = false, dragStart = {x:0, y:0}, viewAtDrag = {};
let touchStartDist = 0, touchStartView = {};

// ──────────────────────────────────────────────
// Coefficient helpers
// ──────────────────────────────────────────────
function getCoeffs() {
  const a = parseFloat(document.getElementById('inp-a').value) || 0;
  const b = parseFloat(document.getElementById('inp-b').value) || 0;
  const c = parseFloat(document.getElementById('inp-c').value) || 0;
  const d = parseFloat(document.getElementById('inp-d').value) || 0;
  const e = parseFloat(document.getElementById('inp-e').value) || 0;
  return {a,b,c,d,e};
}

function evalPoly(x) {
  const {a,b,c,d,e} = getCoeffs();
  switch(degree) {
    case 1: return a*x + b;
    case 2: return a*x*x + b*x + c;
    case 3: return a*x*x*x + b*x*x + c*x + d;
    case 4: return a*x*x*x*x + b*x*x*x + c*x*x + d*x + e;
  }
  return 0;
}

// ──────────────────────────────────────────────
// Degree switching — update UI
// ──────────────────────────────────────────────
function setDegree(n, btn) {
  degree = n;
  document.querySelectorAll('.deg-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  updateCoeffUI();
  updatePresets();
  draw();
}

function updateCoeffUI() {
  const {a,b,c,d,e} = getCoeffs();
  const labels = {
    1: {a:'ax',      b:'b',   c:null, d:null, e:null},
    2: {a:'ax²',     b:'bx',  c:'c',  d:null, e:null},
    3: {a:'ax³',     b:'bx²', c:'cx', d:'d',  e:null},
    4: {a:'ax⁴',     b:'bx³', c:'cx²',d:'dx', e:'e'}
  };
  const L = labels[degree];
  ['a','b','c','d','e'].forEach(k => {
    const lbl = document.getElementById('lbl-'+k);
    const inp = document.getElementById('inp-'+k);
    const row = document.getElementById('row-'+k);
    lbl.innerHTML = `<span>${L[k] ? L[k].replace(/[^a-z]/gi,'') : k}</span> =`;
    if(L[k]) {
      inp.classList.remove('inactive');
      row.style.display = 'flex';
    } else {
      inp.classList.add('inactive');
      row.style.display = degree >= 3 ? (k==='e' && degree<4 ? 'none' : 'flex') : 'none';
    }
  });
  // Simplify: just show/hide rows based on degree
  document.getElementById('row-a').style.display = 'flex';
  document.getElementById('row-b').style.display = 'flex';
  document.getElementById('row-c').style.display = degree >= 2 ? 'flex' : 'none';
  document.getElementById('row-d').style.display = degree >= 3 ? 'flex' : 'none';
  document.getElementById('row-e').style.display = degree >= 4 ? 'flex' : 'none';

  document.getElementById('inp-c').classList.toggle('inactive', degree < 2);
  document.getElementById('inp-d').classList.toggle('inactive', degree < 3);
  document.getElementById('inp-e').classList.toggle('inactive', degree < 4);

  const lblMap = {
    1: {a:'a·x', b:'b'},
    2: {a:'a·x²', b:'b·x', c:'c'},
    3: {a:'a·x³', b:'b·x²', c:'c·x', d:'d'},
    4: {a:'a·x⁴', b:'b·x³', c:'c·x²', d:'d·x', e:'e'}
  };
  ['a','b','c','d','e'].forEach(k => {
    const el = document.getElementById('lbl-'+k);
    if(lblMap[degree][k]) el.innerHTML = `<span>${k}</span>&nbsp;<small style="color:var(--muted);font-size:.6rem">(${lblMap[degree][k]})</small> =`;
  });
}

// ──────────────────────────────────────────────
// Equation string display
// ──────────────────────────────────────────────
function formatNum(n, isFirst) {
  if(n === 0) return null;
  const sign = n > 0 ? (isFirst ? '' : ' + ') : (isFirst ? '−' : ' − ');
  const abs = Math.abs(n);
  const str = Number.isInteger(abs) ? String(abs) : abs.toFixed(2).replace(/\.?0+$/, '');
  return sign + (abs === 1 ? '' : str);
}

function buildEquation() {
  const {a,b,c,d,e} = getCoeffs();
  const terms = [];

  function addTerm(coeff, xPart, idx) {
    if(coeff === 0) return;
    const isFirst = terms.length === 0;
    const absC = Math.abs(coeff);
    const sign = coeff > 0 ? (isFirst ? '' : ' + ') : (isFirst ? '−' : ' − ');
    const num = absC === 1 && xPart ? '' : (Number.isInteger(absC) ? String(absC) : absC.toFixed(2).replace(/\.?0+$/, ''));
    terms.push(sign + num + xPart);
  }

  switch(degree) {
    case 1: addTerm(a,'x',0); addTerm(b,'',1); break;
    case 2: addTerm(a,'x²',0); addTerm(b,'x',1); addTerm(c,'',2); break;
    case 3: addTerm(a,'x³',0); addTerm(b,'x²',1); addTerm(c,'x',2); addTerm(d,'',3); break;
    case 4: addTerm(a,'x⁴',0); addTerm(b,'x³',1); addTerm(c,'x²',2); addTerm(d,'x',3); addTerm(e,'',4); break;
  }
  return terms.length ? 'y = ' + terms.join('') : 'y = 0';
}

// ──────────────────────────────────────────────
// Zero finding (binary search + bisection)
// ──────────────────────────────────────────────
function findZeroes() {
  const zeroes = [];
  const steps = 2000;
  const range = viewXmax - viewXmin;
  const step = (viewXmax - viewXmin) / steps;
  let prev = evalPoly(viewXmin);
  for(let i=1; i<=steps; i++) {
    const x = viewXmin + i*step;
    const curr = evalPoly(x);
    if(prev * curr < 0) {
      // bisection
      let lo = x - step, hi = x, f;
      for(let j=0;j<50;j++) {
        const mid = (lo+hi)/2;
        f = evalPoly(mid);
        if(Math.abs(f)<1e-9) { lo=hi=mid; break; }
        if(evalPoly(lo)*f < 0) hi=mid; else lo=mid;
      }
      const z = (lo+hi)/2;
      if(zeroes.length === 0 || Math.abs(z - zeroes[zeroes.length-1]) > 1e-4)
        zeroes.push(parseFloat(z.toFixed(4)));
    } else if(Math.abs(curr) < 1e-7) {
      const z = parseFloat(x.toFixed(4));
      if(zeroes.length===0 || Math.abs(z - zeroes[zeroes.length-1]) > 1e-4)
        zeroes.push(z);
    }
    prev = curr;
  }
  return zeroes;
}

// ──────────────────────────────────────────────
// Analysis panel update
// ──────────────────────────────────────────────
function updateAnalysis(zeroes) {
  const {a,b,c,d,e} = getCoeffs();
  document.getElementById('inf-deg').textContent = degree;

  // y-intercept
  const yInt = evalPoly(0);
  document.getElementById('inf-yint').textContent = yInt.toFixed(3).replace(/\.?0+$/,'');

  // Zeroes
  document.getElementById('inf-zeroes').textContent = zeroes.length
    ? zeroes.map(z => z.toFixed(3).replace(/\.?0+$/,'')).join(', ')
    : 'None in view';

  // Vertex / turning point (quadratic only)
  const vEl = document.getElementById('inf-vertex');
  const dEl = document.getElementById('inf-dir');
  const discEl = document.getElementById('inf-disc');

  if(degree === 2 && a !== 0) {
    const vx = -b/(2*a);
    const vy = evalPoly(vx);
    vEl.textContent = `(${vx.toFixed(2)}, ${vy.toFixed(2)})`;
    dEl.textContent = a > 0 ? 'Upward ∪' : 'Downward ∩';
    const D = b*b - 4*a*c;
    discEl.textContent = D.toFixed(3).replace(/\.?0+$/, '') + (D>0?' (2 roots)':D===0?' (1 root)':' (no real roots)');
  } else if(degree === 1) {
    const zx = a !== 0 ? (-b/a).toFixed(3) : '—';
    vEl.textContent = `x = ${zx}`;
    dEl.textContent = a > 0 ? 'Rising ↗' : (a < 0 ? 'Falling ↘' : 'Horizontal');
    discEl.textContent = '—';
  } else if(degree === 3) {
    vEl.textContent = 'See graph';
    dEl.textContent = a > 0 ? '↙ to ↗' : '↗ to ↙';
    discEl.textContent = '—';
  } else if(degree === 4) {
    vEl.textContent = 'See graph';
    dEl.textContent = a > 0 ? 'Both ends ↑' : 'Both ends ↓';
    discEl.textContent = '—';
  } else {
    vEl.textContent = '—';
    dEl.textContent = '—';
    discEl.textContent = '—';
  }
}

// ──────────────────────────────────────────────
// Canvas drawing
// ──────────────────────────────────────────────
function draw() {
  // Update equation display
  document.getElementById('eq-display').textContent = buildEquation();

  const canvas = document.getElementById('graph');
  const wrap = document.getElementById('canvas-wrap');
  const dpr = window.devicePixelRatio || 1;
  const W = wrap.clientWidth, H = wrap.clientHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;

  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  // Sync inputs
  const xmin = parseFloat(document.getElementById('xmin').value) || -10;
  const xmax = parseFloat(document.getElementById('xmax').value) || 10;
  const ymin = parseFloat(document.getElementById('ymin').value) || -15;
  const ymax = parseFloat(document.getElementById('ymax').value) || 15;
  viewXmin = xmin; viewXmax = xmax; viewYmin = ymin; viewYmax = ymax;

  const xRange = xmax - xmin, yRange = ymax - ymin;
  const toCanvasX = x => (x - xmin) / xRange * W;
  const toCanvasY = y => H - (y - ymin) / yRange * H;
  const fromCanvasX = cx => xmin + cx/W * xRange;
  const fromCanvasY = cy => ymin + (H-cy)/H * yRange;

  // Background
  ctx.fillStyle = '#040810';
  ctx.fillRect(0,0,W,H);

  // Grid lines
  const gridStepX = niceStep(xRange);
  const gridStepY = niceStep(yRange);

  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(26,45,69,0.6)';
  ctx.beginPath();
  for(let gx = Math.ceil(xmin/gridStepX)*gridStepX; gx <= xmax; gx += gridStepX) {
    const cx = toCanvasX(gx);
    ctx.moveTo(cx, 0); ctx.lineTo(cx, H);
  }
  for(let gy = Math.ceil(ymin/gridStepY)*gridStepY; gy <= ymax; gy += gridStepY) {
    const cy = toCanvasY(gy);
    ctx.moveTo(0, cy); ctx.lineTo(W, cy);
  }
  ctx.stroke();

  // Axis labels (grid numbers)
  ctx.font = `${11}px 'DM Mono', monospace`;
  ctx.fillStyle = '#2a4060';
  ctx.textAlign = 'center';
  for(let gx = Math.ceil(xmin/gridStepX)*gridStepX; gx <= xmax; gx += gridStepX) {
    if(Math.abs(gx) < gridStepX*0.1) continue;
    const cx = toCanvasX(gx);
    const cy = Math.max(6, Math.min(H-4, toCanvasY(0)+14));
    ctx.fillText(formatLabel(gx), cx, cy);
  }
  ctx.textAlign = 'right';
  for(let gy = Math.ceil(ymin/gridStepY)*gridStepY; gy <= ymax; gy += gridStepY) {
    if(Math.abs(gy) < gridStepY*0.1) continue;
    const cy = toCanvasY(gy);
    const cx = Math.max(30, Math.min(W-4, toCanvasX(0)-6));
    ctx.fillText(formatLabel(gy), cx, cy+4);
  }

  // Axes (x=0, y=0)
  ctx.strokeStyle = 'rgba(74,104,144,0.8)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  const cx0 = toCanvasX(0), cy0 = toCanvasY(0);
  if(cx0 >= 0 && cx0 <= W) { ctx.moveTo(cx0,0); ctx.lineTo(cx0,H); }
  if(cy0 >= 0 && cy0 <= H) { ctx.moveTo(0,cy0); ctx.lineTo(W,cy0); }
  ctx.stroke();

  // Axis arrow heads
  ctx.fillStyle = 'rgba(74,104,144,0.8)';
  if(cx0>=0 && cx0<=W) { arrow(ctx, cx0, 8, 0, -1); }
  if(cy0>=0 && cy0<=H) { arrow(ctx, W-8, cy0, 1, 0); }

  // Origin label
  if(cx0>15 && cx0<W-15 && cy0>15 && cy0<H-15) {
    ctx.font = `10px 'DM Mono', monospace`;
    ctx.fillStyle = 'rgba(74,104,144,0.6)';
    ctx.textAlign='right';
    ctx.fillText('O', cx0-5, cy0+12);
  }

  // ── Curve ──
  const steps = W * 2;
  const curveColor = degree===1 ? '#22c55e' : degree===2 ? '#f59e0b' : degree===3 ? '#d946ef' : '#38bdf8';
  ctx.lineWidth = 2.5;
  ctx.strokeStyle = curveColor;
  ctx.shadowColor = curveColor;
  ctx.shadowBlur = 8;
  ctx.lineJoin = 'round';

  ctx.beginPath();
  let penDown = false;
  const prevY = []; // track for discontinuity detection
  for(let i=0; i<=steps; i++) {
    const x = xmin + i/steps * xRange;
    const y = evalPoly(x);
    const cx = toCanvasX(x);
    const cy = toCanvasY(y);
    const inRange = cy > -200 && cy < H + 200;
    if(inRange) {
      if(!penDown) { ctx.moveTo(cx, cy); penDown=true; }
      else { ctx.lineTo(cx, cy); }
    } else {
      penDown = false;
    }
  }
  ctx.stroke();
  ctx.shadowBlur = 0;

  // ── Zero markers ──
  const zeroes = findZeroes();
  zeroes.forEach(z => {
    const cx = toCanvasX(z);
    const cy = toCanvasY(0);
    if(cx < 0 || cx > W) return;
    ctx.beginPath();
    ctx.arc(cx, cy, 5, 0, Math.PI*2);
    ctx.fillStyle = curveColor;
    ctx.fill();
    ctx.strokeStyle = '#040810';
    ctx.lineWidth = 2;
    ctx.stroke();
    // Label
    ctx.font = `bold 10px 'DM Mono', monospace`;
    ctx.fillStyle = curveColor;
    ctx.textAlign = 'center';
    const lz = formatLabel(z);
    ctx.fillText(lz, cx, cy - 10);
  });

  // ── Y-intercept marker ──
  const yIntVal = evalPoly(0);
  const cyInt = toCanvasY(yIntVal);
  if(cx0 >= 0 && cx0 <= W && cyInt >= 0 && cyInt <= H) {
    ctx.beginPath();
    ctx.arc(cx0, cyInt, 4, 0, Math.PI*2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.strokeStyle = curveColor;
    ctx.lineWidth = 2;
    ctx.stroke();
    if(Math.abs(yIntVal) > 0.001) {
      ctx.font = `10px 'DM Mono', monospace`;
      ctx.fillStyle = '#aac4e0';
      ctx.textAlign = 'left';
      ctx.fillText(formatLabel(yIntVal), cx0+7, cyInt-4);
    }
  }

  // Scale pill
  const unitsPerPx = xRange / W;
  document.getElementById('scale-pill').textContent = `Scale: 1u = ${(1/unitsPerPx).toFixed(1)}px`;

  // Update analysis
  updateAnalysis(zeroes);
}

function arrow(ctx, x, y, dx, dy) {
  const size = 6;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x - size*dy - size*dx*0.5, y + size*dx - size*dy*0.5);
  ctx.lineTo(x + size*dy - size*dx*0.5, y - size*dx - size*dy*0.5);
  ctx.closePath();
  ctx.fill();
}

function niceStep(range) {
  const rough = range / 8;
  const mag = Math.pow(10, Math.floor(Math.log10(rough)));
  const nice = [1,2,5,10].map(n=>n*mag);
  return nice.find(n=>range/n >= 4 && range/n <= 12) || nice[2];
}

function formatLabel(n) {
  if(Math.abs(n) >= 1000) return n.toExponential(1);
  if(Number.isInteger(n)) return String(n);
  return parseFloat(n.toFixed(2)).toString();
}

// ──────────────────────────────────────────────
// View controls
// ──────────────────────────────────────────────
function resetView() {
  document.getElementById('xmin').value = -10;
  document.getElementById('xmax').value = 10;
  document.getElementById('ymin').value = -15;
  document.getElementById('ymax').value = 15;
  draw();
}

function autoFit() {
  const steps = 500;
  const xs = Array.from({length:steps}, (_,i) => viewXmin + i/steps*(viewXmax-viewXmin));
  const ys = xs.map(x => evalPoly(x)).filter(y => isFinite(y) && !isNaN(y));
  if(!ys.length) return;
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const padY = Math.max((maxY-minY)*0.15, 2);
  document.getElementById('ymin').value = (minY - padY).toFixed(1);
  document.getElementById('ymax').value = (maxY + padY).toFixed(1);
  draw();
}

function zoom(factor) {
  const xc = (viewXmin+viewXmax)/2, yc = (viewYmin+viewYmax)/2;
  const hw = (viewXmax-viewXmin)/2 * factor;
  const hh = (viewYmax-viewYmin)/2 * factor;
  document.getElementById('xmin').value = (xc-hw).toFixed(2);
  document.getElementById('xmax').value = (xc+hw).toFixed(2);
  document.getElementById('ymin').value = (yc-hh).toFixed(2);
  document.getElementById('ymax').value = (yc+hh).toFixed(2);
  draw();
}

// ──────────────────────────────────────────────
// Mouse / touch drag & zoom
// ──────────────────────────────────────────────
const wrap = document.getElementById('canvas-wrap');

wrap.addEventListener('mousedown', e => {
  isDragging = true;
  dragStart = {x:e.clientX, y:e.clientY};
  viewAtDrag = {xmin:viewXmin, xmax:viewXmax, ymin:viewYmin, ymax:viewYmax};
});
window.addEventListener('mousemove', e => {
  // Coordinate display
  const rect = document.getElementById('graph').getBoundingClientRect();
  const px = (e.clientX - rect.left) / rect.width;
  const py = (e.clientY - rect.top) / rect.height;
  const wx = viewXmin + px*(viewXmax-viewXmin);
  const wy = viewYmax - py*(viewYmax-viewYmin);
  document.getElementById('coord-display').textContent = `x: ${wx.toFixed(2)}  |  y: ${wy.toFixed(2)}`;

  if(!isDragging) return;
  const dx = e.clientX - dragStart.x;
  const dy = e.clientY - dragStart.y;
  const W = wrap.clientWidth, H = wrap.clientHeight;
  const dxW = -dx/W * (viewAtDrag.xmax - viewAtDrag.xmin);
  const dyH =  dy/H * (viewAtDrag.ymax - viewAtDrag.ymin);
  document.getElementById('xmin').value = (viewAtDrag.xmin + dxW).toFixed(2);
  document.getElementById('xmax').value = (viewAtDrag.xmax + dxW).toFixed(2);
  document.getElementById('ymin').value = (viewAtDrag.ymin + dyH).toFixed(2);
  document.getElementById('ymax').value = (viewAtDrag.ymax + dyH).toFixed(2);
  draw();
});
window.addEventListener('mouseup', () => { isDragging = false; });

wrap.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY > 0 ? 1.12 : 0.89;
  const rect = wrap.getBoundingClientRect();
  const px = (e.clientX - rect.left) / rect.width;
  const py = (e.clientY - rect.top)  / rect.height;
  const wx = viewXmin + px*(viewXmax-viewXmin);
  const wy = viewYmax - py*(viewYmax-viewYmin);
  const newXrange = (viewXmax-viewXmin)*factor;
  const newYrange = (viewYmax-viewYmin)*factor;
  document.getElementById('xmin').value = (wx - px*newXrange).toFixed(2);
  document.getElementById('xmax').value = (wx + (1-px)*newXrange).toFixed(2);
  document.getElementById('ymin').value = (wy - (1-py)*newYrange).toFixed(2);
  document.getElementById('ymax').value = (wy + py*newYrange).toFixed(2);
  draw();
}, {passive:false});

// Touch
wrap.addEventListener('touchstart', e => {
  if(e.touches.length === 1) {
    isDragging = true;
    dragStart = {x:e.touches[0].clientX, y:e.touches[0].clientY};
    viewAtDrag = {xmin:viewXmin, xmax:viewXmax, ymin:viewYmin, ymax:viewYmax};
  } else if(e.touches.length === 2) {
    isDragging = false;
    touchStartDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY);
    touchStartView = {xmin:viewXmin, xmax:viewXmax, ymin:viewYmin, ymax:viewYmax};
  }
}, {passive:true});

wrap.addEventListener('touchmove', e => {
  e.preventDefault();
  if(e.touches.length === 1 && isDragging) {
    const dx = e.touches[0].clientX - dragStart.x;
    const dy = e.touches[0].clientY - dragStart.y;
    const W = wrap.clientWidth, H = wrap.clientHeight;
    const dxW = -dx/W * (viewAtDrag.xmax - viewAtDrag.xmin);
    const dyH =  dy/H * (viewAtDrag.ymax - viewAtDrag.ymin);
    document.getElementById('xmin').value = (viewAtDrag.xmin + dxW).toFixed(2);
    document.getElementById('xmax').value = (viewAtDrag.xmax + dxW).toFixed(2);
    document.getElementById('ymin').value = (viewAtDrag.ymin + dyH).toFixed(2);
    document.getElementById('ymax').value = (viewAtDrag.ymax + dyH).toFixed(2);
    draw();
  } else if(e.touches.length === 2) {
    const dist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY);
    const factor = touchStartDist / dist;
    const xc = (touchStartView.xmin+touchStartView.xmax)/2;
    const yc = (touchStartView.ymin+touchStartView.ymax)/2;
    const hw = (touchStartView.xmax-touchStartView.xmin)/2 * factor;
    const hh = (touchStartView.ymax-touchStartView.ymin)/2 * factor;
    document.getElementById('xmin').value = (xc-hw).toFixed(2);
    document.getElementById('xmax').value = (xc+hw).toFixed(2);
    document.getElementById('ymin').value = (yc-hh).toFixed(2);
    document.getElementById('ymax').value = (yc+hh).toFixed(2);
    draw();
  }
}, {passive:false});
wrap.addEventListener('touchend', () => { isDragging = false; });

// ──────────────────────────────────────────────
// Presets
// ──────────────────────────────────────────────
const PRESETS = {
  1: [
    {name:'y = x',          coeffs:[1,0,0,0,0]},
    {name:'y = 2x − 3',     coeffs:[2,-3,0,0,0]},
    {name:'y = −x + 4',     coeffs:[-1,4,0,0,0]},
    {name:'y = 0.5x + 1',   coeffs:[0.5,1,0,0,0]},
  ],
  2: [
    {name:'x² − 4',         coeffs:[1,0,-4,0,0]},
    {name:'x² − 3x + 2',    coeffs:[1,-3,2,0,0]},
    {name:'x² + 2x + 1',    coeffs:[1,2,1,0,0]},
    {name:'−x² + 4',        coeffs:[-1,0,4,0,0]},
    {name:'2x² − 5x + 3',   coeffs:[2,-5,3,0,0]},
    {name:'x² + 1 (no zer)',coeffs:[1,0,1,0,0]},
  ],
  3: [
    {name:'x³ − x',         coeffs:[1,0,-1,0,0]},
    {name:'x³ − 6x²+11x−6', coeffs:[1,-6,11,-6,0]},
    {name:'x³ + 3x² − x−3', coeffs:[1,3,-1,-3,0]},
    {name:'−x³ + 3x',       coeffs:[-1,0,3,0,0]},
    {name:'x³ − 4x',        coeffs:[1,0,-4,0,0]},
  ],
  4: [
    {name:'x⁴ − 5x² + 4',   coeffs:[1,0,-5,0,4]},
    {name:'x⁴ − 1',         coeffs:[1,0,0,0,-1]},
    {name:'x⁴ − 4x²',       coeffs:[1,0,-4,0,0]},
    {name:'−x⁴ + 4x²',      coeffs:[-1,0,4,0,0]},
    {name:'x⁴ − 3x³ + 2x²', coeffs:[1,-3,2,0,0]},
  ]
};

function updatePresets() {
  const grid = document.getElementById('preset-grid');
  grid.innerHTML = '';
  (PRESETS[degree]||[]).forEach(p => {
    const btn = document.createElement('button');
    btn.className = 'preset-btn';
    btn.textContent = p.name;
    btn.onclick = () => applyPreset(p.coeffs);
    grid.appendChild(btn);
  });
}

function applyPreset(coeffs) {
  const ids = ['inp-a','inp-b','inp-c','inp-d','inp-e'];
  ids.forEach((id,i) => {
    const el = document.getElementById(id);
    if(el) el.value = coeffs[i] !== undefined ? coeffs[i] : 0;
  });
  draw();
}

// ──────────────────────────────────────────────
// Resize observer
// ──────────────────────────────────────────────
const ro = new ResizeObserver(() => draw());
ro.observe(document.getElementById('canvas-wrap'));

// ──────────────────────────────────────────────
// Init
// ──────────────────────────────────────────────
updateCoeffUI();
updatePresets();
draw();
</script>
