<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards — Polynomials</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Mono:wght@400;500&family=Lato:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#040810; --card:#0a1422; --card2:#0f1c30;
    --border:#1a2d45; --text:#cce4ff; --muted:#4a6890;
    --amber:#f59e0b; --teal:#2dd4bf; --blue:#38bdf8;
    --green:#22c55e; --red:#f43f5e; --indigo:#818cf8; --purple:#d946ef;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'Lato',sans-serif; min-height:100vh;
    display:flex; flex-direction:column; align-items:center; }
  body::before { content:''; position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(ellipse 70% 50% at 50% 0%, rgba(245,158,11,.05) 0%, transparent 60%); }

  header { text-align:center; padding:1.8rem 1rem .8rem; }
  header h1 { font-family:'Playfair Display',serif; font-size:clamp(1.3rem,4vw,2rem); font-weight:900;
    color:var(--amber); }
  header p { color:var(--muted); font-family:'DM Mono',monospace; font-size:.72rem; margin-top:.3rem; }

  .prog-row { display:flex; align-items:center; gap:1rem; padding:.5rem 1rem .8rem; width:100%; max-width:560px; }
  .prog-bar { flex:1; height:5px; background:var(--border); border-radius:99px; overflow:hidden; }
  .prog-fill { height:100%; border-radius:99px;
    background:linear-gradient(90deg,var(--indigo),var(--amber));
    transition:width .4s ease; }
  .prog-text { font-family:'DM Mono',monospace; font-size:.72rem; color:var(--muted); white-space:nowrap; }

  .filters { display:flex; gap:.4rem; flex-wrap:wrap; justify-content:center; padding:.2rem 1rem .8rem; }
  .f-btn { font-family:'Playfair Display',serif; font-weight:700; font-size:.72rem;
    padding:.3rem .9rem; border-radius:3px; border:1px solid var(--border);
    background:var(--card); color:var(--muted); cursor:pointer; transition:all .2s; }
  .f-btn:hover { color:var(--text); }
  .f-btn.on { color:#040810; border-color:transparent; }
  .f-all.on  { background:var(--muted); color:var(--text) !important; }
  .f-typ.on  { background:var(--indigo); }
  .f-zer.on  { background:var(--teal); }
  .f-qdr.on  { background:var(--amber); }
  .f-cub.on  { background:var(--purple); color:#fff !important; }
  .f-div.on  { background:var(--blue); }

  .stage { width:100%; max-width:560px; padding:0 1rem; perspective:1200px; }
  .fc-wrap { width:100%; aspect-ratio:3/2; position:relative; cursor:pointer;
    transform-style:preserve-3d; transition:transform .55s cubic-bezier(.4,0,.2,1); }
  .fc-wrap.flipped { transform:rotateY(180deg); }
  .fc-face { position:absolute; inset:0; border-radius:16px;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:1.4rem; text-align:center; }
  .fc-front { background:var(--card); border:1px solid var(--border);
    box-shadow:0 8px 32px rgba(0,0,0,.6); }
  .fc-back  { transform:rotateY(180deg); background:var(--card);
    border:1px solid var(--border); box-shadow:0 8px 32px rgba(0,0,0,.6); }
  .fc-tag { font-family:'DM Mono',monospace; font-size:.65rem; font-weight:500;
    padding:.18rem .65rem; border-radius:2px; margin-bottom:.7rem; }
  .fc-q { font-family:'Playfair Display',serif; font-size:clamp(.88rem,2.4vw,1.1rem);
    font-weight:700; line-height:1.45; }
  .fc-hint { font-size:.68rem; color:var(--muted); margin-top:.5rem; font-family:'DM Mono',monospace; }
  .fc-flip-hint { position:absolute; bottom:.75rem; font-size:.65rem;
    font-family:'DM Mono',monospace; color:#1a2d45; animation:pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:1} }
  .fc-ans-lbl { font-family:'DM Mono',monospace; font-size:.65rem; color:var(--green); margin-bottom:.5rem; }
  .fc-ans { font-size:clamp(.78rem,2vw,.95rem); line-height:1.65; color:var(--text); }
  .fc-ans strong { color:var(--amber); }
  .fc-ans em { color:var(--teal); font-style:normal; }
  .fc-mono { font-family:'DM Mono',monospace; font-size:.84rem; color:var(--teal); }
  .known-badge { position:absolute; top:.7rem; right:.7rem;
    font-size:.62rem; font-family:'DM Mono',monospace; padding:.12rem .45rem; border-radius:2px; }
  .known   { background:rgba(34,197,94,.15); color:#4ade80; }
  .unknown { background:rgba(239,68,68,.1);  color:#f87171; }
  .nav-row { display:flex; gap:.7rem; align-items:center; padding:1rem; }
  .nav-btn { font-family:'Playfair Display',serif; font-weight:700; font-size:.85rem;
    padding:.5rem 1.3rem; border-radius:4px; border:1px solid var(--border);
    background:var(--card); color:var(--muted); cursor:pointer; transition:all .2s; }
  .nav-btn:hover:not(:disabled) { border-color:#2a4a6a; color:var(--text); }
  .nav-btn:disabled { opacity:.3; cursor:default; }
  .card-ctr { font-family:'DM Mono',monospace; font-size:.8rem; color:var(--muted);
    min-width:70px; text-align:center; }
  .bottom-row { display:flex; gap:.5rem; flex-wrap:wrap; justify-content:center; padding:.3rem 1rem 2rem; }
  .bot-btn { font-family:'Playfair Display',serif; font-weight:700; font-size:.75rem;
    padding:.38rem 1rem; border-radius:3px; border:1px solid var(--border);
    background:var(--card); color:var(--muted); cursor:pointer; transition:all .2s; }
  .bot-btn:hover { border-color:var(--amber); color:var(--amber); }

  /* ---- learnr site-nav ---- */
  .site-nav {
    display:flex; align-items:center; justify-content:space-between;
    padding:.42rem 1.2rem; width:100%; align-self:stretch; flex-shrink:0;
    background:rgba(7,16,31,.9); backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(26,45,69,.75);
    position:sticky; top:0; z-index:9999;
  }
  .site-nav-logo { display:flex; align-items:center; text-decoration:none; }
  .site-nav-img  { height:28px; width:auto; display:block; border-radius:4px; }
  .site-nav-back {
    font-family:'DM Mono',monospace; font-size:.68rem;
    color:#7a9ab8; text-decoration:none; transition:all .2s;
    border:1px solid rgba(26,45,69,.9); border-radius:99px;
    padding:.2rem .65rem; white-space:nowrap;
  }
  .site-nav-back:hover { color:#dde6f5; border-color:#2a4060; background:rgba(255,255,255,.04); }
</style>
</head>
<body>
<nav class="site-nav"><a href="../../index.html" class="site-nav-logo"><img src="../../logos/learnr-colored-dark.svg" alt="learnr" class="site-nav-img"></a><a href="../../index.html" class="site-nav-back">&#8592; Back to Portal</a></nav>
<header>
  <h1>Flashcard Deck</h1>
  <p>Polynomials · Mathematics Ch.2 · 40 Cards · Tap to flip</p>
</header>
<div class="prog-row">
  <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
  <div class="prog-text" id="prog-text">0 / 40</div>
</div>
<div class="filters">
  <button class="f-btn f-all on"  onclick="setFilter('all',this)">All (40)</button>
  <button class="f-btn f-typ"     onclick="setFilter('typ',this)">📐 Types</button>
  <button class="f-btn f-zer"     onclick="setFilter('zer',this)">📈 Zeroes &amp; Graphs</button>
  <button class="f-btn f-qdr"     onclick="setFilter('qdr',this)">🔷 Quadratic α,β</button>
  <button class="f-btn f-cub"     onclick="setFilter('cub',this)">🔮 Cubic α,β,γ</button>
  <button class="f-btn f-div"     onclick="setFilter('div',this)">➗ Division</button>
</div>
<div class="stage">
  <div class="fc-wrap" id="fc" onclick="flipCard()">
    <div class="fc-face fc-front" id="fc-front"></div>
    <div class="fc-face fc-back"  id="fc-back"></div>
  </div>
</div>
<div class="nav-row">
  <button class="nav-btn" id="prev-btn" onclick="prevCard()" disabled>← Prev</button>
  <div class="card-ctr" id="card-ctr">1 / 40</div>
  <button class="nav-btn" id="next-btn" onclick="nextCard()">Next →</button>
</div>
<div class="bottom-row">
  <button class="bot-btn" onclick="markKnown()">✓ Know it</button>
  <button class="bot-btn" onclick="markUnknown()">✗ Still learning</button>
  <button class="bot-btn" onclick="shuffleDeck()">🔀 Shuffle</button>
  <button class="bot-btn" onclick="resetDeck()">↺ Reset</button>
</div>

<script>
const ALL_CARDS = [
  // ── TYPES OF POLYNOMIALS (typ) ──
  { cat:'typ', tag:'📐 Types', tagBg:'rgba(129,140,248,.15)', tagCol:'#818cf8',
    q:'What is the degree of a polynomial? Give an example.',
    a:'The degree is the <strong>highest power of the variable</strong> in the polynomial.<br>Example: 5x³ − 2x² + x − 7 has degree <em>3</em>.<br>The leading coefficient is 5.' },
  { cat:'typ', tag:'📐 Types', tagBg:'rgba(129,140,248,.15)', tagCol:'#818cf8',
    q:'What is a linear polynomial? How many zeroes does it have?',
    a:'A polynomial of degree <strong>1</strong>: ax + b (a ≠ 0).<br>It has <em>exactly 1 zero</em>: x = −b/a.<br>Example: 3x − 6 has zero x = 2.' },
  { cat:'typ', tag:'📐 Types', tagBg:'rgba(129,140,248,.15)', tagCol:'#818cf8',
    q:'What is a quadratic polynomial? How many zeroes can it have?',
    a:'A polynomial of degree <strong>2</strong>: ax² + bx + c (a ≠ 0).<br>It can have <em>0, 1, or 2</em> real zeroes.<br>Example: x² − 5x + 6 has zeroes 2 and 3.' },
  { cat:'typ', tag:'📐 Types', tagBg:'rgba(129,140,248,.15)', tagCol:'#818cf8',
    q:'What is a cubic polynomial? How many zeroes can it have?',
    a:'A polynomial of degree <strong>3</strong>: ax³ + bx² + cx + d (a ≠ 0).<br>It can have <em>1, 2, or 3</em> real zeroes.<br>A cubic always has at least one real zero.' },
  { cat:'typ', tag:'📐 Types', tagBg:'rgba(129,140,248,.15)', tagCol:'#818cf8',
    q:'What is a constant polynomial? What is the zero polynomial?',
    a:'<strong>Constant polynomial:</strong> p(x) = k (k ≠ 0). Degree 0. Has <em>no zeroes</em>.<br><strong>Zero polynomial:</strong> p(x) = 0. Every real number is a zero. Its degree is <em>undefined</em>.' },
  { cat:'typ', tag:'📐 Types', tagBg:'rgba(129,140,248,.15)', tagCol:'#818cf8',
    q:'How do you find the value of a polynomial at x = k?',
    a:'Substitute x = k into p(x) and evaluate.<br>Example: p(x) = x² − 3x + 2<br>p(3) = 9 − 9 + 2 = <strong>2</strong><br>If p(k) = 0, then k is a <em>zero</em> of p(x).' },
  { cat:'typ', tag:'📐 Types', tagBg:'rgba(129,140,248,.15)', tagCol:'#818cf8',
    q:'Is x² + 1 a polynomial? Does it have any real zeroes?',
    a:'Yes, x² + 1 is a polynomial of degree 2.<br>It has <strong>no real zeroes</strong> because x² + 1 ≥ 1 > 0 for all real x.<br>Discriminant: 0 − 4(1)(1) = −4 < 0.' },
  { cat:'typ', tag:'📐 Types', tagBg:'rgba(129,140,248,.15)', tagCol:'#818cf8',
    q:'What is the degree of (x+1)(x−2)(2x+3)?',
    a:'Each factor contributes one power of x:<br>(x+1) × (x−2) × (2x+3)<br>Highest power: x × x × 2x = <strong>2x³</strong><br>∴ Degree = <em>3</em> (cubic polynomial).' },

  // ── ZEROES & GRAPHS (zer) ──
  { cat:'zer', tag:'📈 Zeroes & Graphs', tagBg:'rgba(45,212,191,.15)', tagCol:'#2dd4bf',
    q:'What is a zero (root) of a polynomial?',
    a:'k is a zero of p(x) if <strong>p(k) = 0</strong>.<br>Geometrically: k is the <em>x-coordinate where the graph crosses or touches the x-axis</em>.<br>A polynomial of degree n has at most n real zeroes.' },
  { cat:'zer', tag:'📈 Zeroes & Graphs', tagBg:'rgba(45,212,191,.15)', tagCol:'#2dd4bf',
    q:'What does the graph of y = ax² + bx + c look like? How does the sign of "a" affect it?',
    a:'Graph is a <strong>parabola</strong>.<br>If a > 0: opens <em>upward</em> ∪ (minimum point).<br>If a < 0: opens <em>downward</em> ∩ (maximum point).<br>The vertex is the turning point.' },
  { cat:'zer', tag:'📈 Zeroes & Graphs', tagBg:'rgba(45,212,191,.15)', tagCol:'#2dd4bf',
    q:'A parabola intersects the x-axis at two points. What does this tell us about the quadratic?',
    a:'The quadratic has <strong>two distinct real zeroes</strong>.<br>The x-coordinates of the two intersection points are the zeroes.<br>This means discriminant D = b² − 4ac > 0.' },
  { cat:'zer', tag:'📈 Zeroes & Graphs', tagBg:'rgba(45,212,191,.15)', tagCol:'#2dd4bf',
    q:'A parabola just touches the x-axis at one point without crossing. What does this mean?',
    a:'The quadratic has a <strong>repeated (double) zero</strong> — one zero of multiplicity 2.<br>Discriminant D = b² − 4ac = <em>0</em>.<br>The graph is tangent to the x-axis at x = −b/2a.' },
  { cat:'zer', tag:'📈 Zeroes & Graphs', tagBg:'rgba(45,212,191,.15)', tagCol:'#2dd4bf',
    q:'A parabola does not touch the x-axis at all. What does this tell us?',
    a:'The quadratic has <strong>no real zeroes</strong>.<br>Discriminant D = b² − 4ac < <em>0</em>.<br>If a > 0: parabola stays entirely above x-axis (min > 0).<br>If a < 0: stays entirely below x-axis.' },
  { cat:'zer', tag:'📈 Zeroes & Graphs', tagBg:'rgba(45,212,191,.15)', tagCol:'#2dd4bf',
    q:'How does the graph of a cubic polynomial behave? How many x-intercepts can it have?',
    a:'The graph is an <strong>S-shaped curve</strong> (smooth, continuous).<br>It can have <em>1, 2, or 3 x-intercepts</em> (real zeroes).<br>Unlike a quadratic, a cubic <em>always</em> has at least one real zero.' },
  { cat:'zer', tag:'📈 Zeroes & Graphs', tagBg:'rgba(45,212,191,.15)', tagCol:'#2dd4bf',
    q:'What is the difference between a graph "crossing" vs "touching" the x-axis?',
    a:'<strong>Crossing:</strong> graph passes through x-axis → zero has <em>odd multiplicity</em> (simple root).<br><strong>Touching:</strong> graph is tangent to x-axis but returns → zero has <em>even multiplicity</em> (double/repeated root).' },
  { cat:'zer', tag:'📈 Zeroes & Graphs', tagBg:'rgba(45,212,191,.15)', tagCol:'#2dd4bf',
    q:'How do you verify that k is a zero of p(x)?',
    a:'Substitute x = k and check that p(k) = 0.<br>Example: Is x = 2 a zero of p(x) = x² − 5x + 6?<br>p(2) = 4 − 10 + 6 = <strong>0</strong> ✓<br>Yes, 2 is a zero.' },
  { cat:'zer', tag:'📈 Zeroes & Graphs', tagBg:'rgba(45,212,191,.15)', tagCol:'#2dd4bf',
    q:'Describe the discriminant and its three cases for a quadratic.',
    a:'Discriminant: <strong>D = b² − 4ac</strong><br>D > 0: two distinct real zeroes (parabola crosses x-axis twice)<br>D = 0: one repeated real zero (parabola tangent to x-axis)<br>D < 0: no real zeroes (parabola misses x-axis)' },

  // ── QUADRATIC α,β RELATIONS (qdr) ──
  { cat:'qdr', tag:'🔷 Quadratic α,β', tagBg:'rgba(245,158,11,.15)', tagCol:'#f59e0b',
    q:'State the relationship between zeroes and coefficients for a quadratic polynomial ax² + bx + c.',
    a:'If α, β are the zeroes:<br><strong>α + β = −b/a</strong> (sum = minus b over a)<br><strong>αβ = c/a</strong> (product = c over a)<br>These are called Vieta\'s Formulas.' },
  { cat:'qdr', tag:'🔷 Quadratic α,β', tagBg:'rgba(245,158,11,.15)', tagCol:'#f59e0b',
    q:'Find sum and product of zeroes of 2x² − 7x + 3.',
    a:'a = 2, b = −7, c = 3<br><strong>Sum</strong> = −b/a = 7/2<br><strong>Product</strong> = c/a = 3/2<br>Verify: zeroes are 3 and 1/2.<br>3 + 1/2 = 7/2 ✓ &nbsp; 3 × 1/2 = 3/2 ✓' },
  { cat:'qdr', tag:'🔷 Quadratic α,β', tagBg:'rgba(245,158,11,.15)', tagCol:'#f59e0b',
    q:'How do you form a quadratic polynomial given its zeroes α and β?',
    a:'p(x) = x² − (α+β)x + αβ<br>= x² − <em>Sum</em>·x + <em>Product</em><br>Example: Zeroes 2 and −5:<br>Sum=−3, Product=−10<br>p(x) = <strong>x² + 3x − 10</strong>' },
  { cat:'qdr', tag:'🔷 Quadratic α,β', tagBg:'rgba(245,158,11,.15)', tagCol:'#f59e0b',
    q:'Express α² + β² in terms of the sum and product of zeroes.',
    a:'α² + β² = (α+β)² − 2αβ<br>= <em>S² − 2P</em><br>where S = α+β (sum) and P = αβ (product).<br>Example: S=5, P=6 → α²+β² = 25−12 = <strong>13</strong>' },
  { cat:'qdr', tag:'🔷 Quadratic α,β', tagBg:'rgba(245,158,11,.15)', tagCol:'#f59e0b',
    q:'Express (α − β)² in terms of S and P.',
    a:'(α − β)² = (α+β)² − 4αβ<br>= <em>S² − 4P</em><br>So |α − β| = √(S² − 4P) = √D/|a|<br>where D = b² − 4ac is the discriminant.' },
  { cat:'qdr', tag:'🔷 Quadratic α,β', tagBg:'rgba(245,158,11,.15)', tagCol:'#f59e0b',
    q:'What does 1/α + 1/β equal in terms of S and P?',
    a:'1/α + 1/β = (α+β)/(αβ) = <em>S/P</em><br>Example: α+β = 4, αβ = 3<br>1/α + 1/β = 4/3<br>⚠ Only defined when P = αβ ≠ 0.' },
  { cat:'qdr', tag:'🔷 Quadratic α,β', tagBg:'rgba(245,158,11,.15)', tagCol:'#f59e0b',
    q:'If one zero of kx² + 3x + k is equal to the reciprocal of the other, find k.',
    a:'Let zeroes be α and 1/α.<br>Product = α × 1/α = <strong>1</strong><br>From Vieta: Product = c/a = k/k = 1 ✓<br>This holds for any k ≠ 0.<br>(But also check sum = 3/k is valid for any k ≠ 0.)' },
  { cat:'qdr', tag:'🔷 Quadratic α,β', tagBg:'rgba(245,158,11,.15)', tagCol:'#f59e0b',
    q:'α and β are zeroes of x² − px + q. What are the zeroes of x² − px + q in terms of α, β?',
    a:'By Vieta\'s Formulas:<br>α + β = <em>p</em> (equal to coefficient of x, sign flipped)<br>αβ = <em>q</em><br>The polynomial is already fully described by its sum and product.' },
  { cat:'qdr', tag:'🔷 Quadratic α,β', tagBg:'rgba(245,158,11,.15)', tagCol:'#f59e0b',
    q:'α and β are zeroes of x² − 6x + a, and 3α + 2β = 20. Find a.',
    a:'α+β = 6 → β = 6−α<br>3α + 2(6−α) = 20<br>3α + 12 − 2α = 20 → <strong>α = 8</strong><br>β = 6−8 = −2<br>a = αβ = 8×(−2) = <strong>−16</strong>' },

  // ── CUBIC α,β,γ RELATIONS (cub) ──
  { cat:'cub', tag:'🔮 Cubic α,β,γ', tagBg:'rgba(217,70,239,.15)', tagCol:'#d946ef',
    q:'State the three Vieta\'s formulas for a cubic polynomial ax³ + bx² + cx + d.',
    a:'If α, β, γ are the zeroes:<br>α+β+γ = <strong>−b/a</strong><br>αβ+βγ+γα = <strong>c/a</strong><br>αβγ = <strong>−d/a</strong><br>Sign pattern: −, +, −' },
  { cat:'cub', tag:'🔮 Cubic α,β,γ', tagBg:'rgba(217,70,239,.15)', tagCol:'#d946ef',
    q:'Find α+β+γ, αβ+βγ+γα, αβγ for p(x) = x³ − 6x² + 11x − 6.',
    a:'a=1, b=−6, c=11, d=−6<br>α+β+γ = 6<br>αβ+βγ+γα = 11<br>αβγ = 6<br>Zeroes are 1, 2, 3 — verify: 1+2+3=6, 1×2+2×3+3×1=11, 1×2×3=6 ✓' },
  { cat:'cub', tag:'🔮 Cubic α,β,γ', tagBg:'rgba(217,70,239,.15)', tagCol:'#d946ef',
    q:'For a cubic ax³+bx²+cx+d, the sign of −d/a gives the product αβγ. Is this positive or negative for x³−6x²+11x−6?',
    a:'d = −6, a = 1<br>αβγ = −d/a = −(−6)/1 = <strong>6</strong> (positive)<br>Zeroes 1, 2, 3: 1×2×3=6 ✓<br>Remember: sign pattern is −b/a, +c/a, <em>−d/a</em>.' },
  { cat:'cub', tag:'🔮 Cubic α,β,γ', tagBg:'rgba(217,70,239,.15)', tagCol:'#d946ef',
    q:'Given one zero α of a cubic, how do you find the other two?',
    a:'<strong>Method 1 (Vieta):</strong> Use α+β+γ and αβγ to get β+γ and βγ, then solve t²−(β+γ)t+βγ=0.<br><strong>Method 2 (Division):</strong> Divide p(x) by (x−α) to get a quadratic, then solve it.' },
  { cat:'cub', tag:'🔮 Cubic α,β,γ', tagBg:'rgba(217,70,239,.15)', tagCol:'#d946ef',
    q:'Zeroes of p(x)=x³+3x²−5x−15 are √5, −√5, and one more. Find the third zero.',
    a:'Sum of zeroes = −3 (since b=3, a=1 → sum = −3)<br>√5 + (−√5) + γ = −3<br>0 + γ = −3<br>∴ Third zero = <strong>−3</strong><br>Verify: product = √5×(−√5)×(−3) = 5×3 = 15 = −d/a = 15 ✓' },
  { cat:'cub', tag:'🔮 Cubic α,β,γ', tagBg:'rgba(217,70,239,.15)', tagCol:'#d946ef',
    q:'The zeroes of a cubic are in Arithmetic Progression a−d, a, a+d. What is their sum?',
    a:'Sum = (a−d)+a+(a+d) = <strong>3a</strong><br>So from Vieta: 3a = −b/A (where A is leading coeff)<br>This makes it easy to find a first!<br>Then use sum-of-pairs to find d.' },
  { cat:'cub', tag:'🔮 Cubic α,β,γ', tagBg:'rgba(217,70,239,.15)', tagCol:'#d946ef',
    q:'Express α²+β²+γ² in terms of Vieta sums.',

    a:'Sum = 6, Sum of pairs = 11, Product = 6<br>Polynomial: x³ − (Sum)x² + (SumPairs)x − (Product)<br>= x³ − 6x² + 11x − 6<br>Verify: (x−1)(x−2)(x−3) = x³−6x²+11x−6 ✓' },

let deck = [...ALL_CARDS];
let current = 0;
let known = new Set();

function renderCard() {
  const c = deck[current];
  const isKnown = known.has(c);
  const fc = document.getElementById('fc');
  fc.classList.remove('flipped');
  const front = document.getElementById('fc-front');
  const back  = document.getElementById('fc-back');
  front.innerHTML = `
    <div class="fc-tag" style="background:${c.tagBg};color:${c.tagCol}">${c.tag}</div>
    <div class="fc-q">${c.q}</div>
    <div class="fc-hint">tap to reveal answer</div>
    <div class="fc-flip-hint">↻ flip</div>
    ${known.has(c) ? '<div class="known-badge known">✓ Know it</div>' : (known.size>0||true) ? '' : ''}
  `;
  const kBadge = known.has(c) ? '<div class="known-badge known">✓ Know it</div>' : '';
  back.innerHTML = `
    <div class="fc-tag" style="background:${c.tagBg};color:${c.tagCol}">${c.tag}</div>
    <div class="fc-ans-lbl">✅ Answer</div>
    <div class="fc-ans">${c.a}</div>
    ${kBadge}
  `;
  document.getElementById('card-ctr').textContent = `${current+1} / ${deck.length}`;
  document.getElementById('prev-btn').disabled = current === 0;
  document.getElementById('next-btn').disabled = current === deck.length-1;
  const pct = deck.length > 0 ? ((current+1)/deck.length*100) : 0;
  document.getElementById('prog-fill').style.width = pct+'%';
  document.getElementById('prog-text').textContent = `${current+1} / ${deck.length}`;
}

function flipCard() { document.getElementById('fc').classList.toggle('flipped'); }
function nextCard() { if(current < deck.length-1){ current++; renderCard(); } }
function prevCard() { if(current > 0){ current--; renderCard(); } }

function markKnown() {
  known.add(deck[current]);
  renderCard();
  if(current < deck.length-1) setTimeout(nextCard, 400);
}
function markUnknown() {
  known.delete(deck[current]);
  renderCard();
  if(current < deck.length-1) setTimeout(nextCard, 400);
}

function shuffleDeck() {
  for(let i=deck.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [deck[i],deck[j]]=[deck[j],deck[i]]; }
  current=0; known.clear(); renderCard();
}

function resetDeck() { deck=[...ALL_CARDS]; current=0; known.clear(); renderCard(); updateFilterUI('all'); }

function setFilter(cat, btn) {
  deck = cat==='all' ? [...ALL_CARDS] : ALL_CARDS.filter(c=>c.cat===cat);
  current=0; known.clear();
  updateFilterUI(cat);
  renderCard();
}

function updateFilterUI(cat) {
  document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('on'));
  const map = {all:'.f-all',typ:'.f-typ',zer:'.f-zer',qdr:'.f-qdr',cub:'.f-cub',div:'.f-div'};
  document.querySelector(map[cat])?.classList.add('on');
}

document.addEventListener('keydown', e => {
  if(e.key==='ArrowRight') nextCard();
  else if(e.key==='ArrowLeft') prevCard();
  else if(e.key===' ') { e.preventDefault(); flipCard(); }
});

renderCard();
</script>
