<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mind Map — Probability</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #040810; font-family: 'Nunito', sans-serif; overflow: hidden; width: 100vw; height: 100vh; }
canvas { position: absolute; inset: 0; }

#ui {
  position: absolute; top: 0; left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: center;
  padding: .8rem 1.2rem; z-index: 10; pointer-events: none;
}
#ui h1 {
  font-family: 'Syne', sans-serif; font-size: 1.1rem; font-weight: 800;
  background: linear-gradient(135deg,#d946ef,#818cf8,#38bdf8);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
#ui p { font-family: 'DM Mono', monospace; font-size: .68rem; color: #475569; margin-top: .1rem; }

.ctrl-bar {
  position: absolute; bottom: 1rem; left: 50%; transform: translateX(-50%);
  display: flex; gap: .5rem; z-index: 10;
}
.ctrl-btn {
  font-family: 'Syne', sans-serif; font-weight: 700; font-size: .75rem;
  padding: .4rem 1rem; border-radius: 99px;
  border: 1.5px solid #334155; background: rgba(30,41,59,.9);
  color: #94a3b8; cursor: pointer; transition: all .2s; pointer-events: all;
}
.ctrl-btn:hover { border-color: #64748b; color: #e2e8f0; }

#tooltip {
  position: absolute; z-index: 20; pointer-events: none;
  background: #1e293b; border: 1px solid #334155;
  border-radius: 12px; padding: .7rem 1rem;
  max-width: 260px; font-size: .82rem; color: #e2e8f0;
  line-height: 1.6; display: none;
  box-shadow: 0 8px 24px rgba(0,0,0,.6);
}
#tooltip strong { font-family: 'Syne', sans-serif; display: block; margin-bottom: .3rem; }

.site-nav {
  display:flex; align-items:center; justify-content:space-between;
  padding:.42rem 1.2rem; width:100%; align-self:stretch; flex-shrink:0;
  background:rgba(4,8,16,.9); backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(26,45,69,.75);
  position:sticky; top:0; z-index:9999;
}
.site-nav-logo { display:flex; align-items:center; text-decoration:none; }
.site-nav-img  { height:28px; width:auto; display:block; border-radius:4px; }
.site-nav-back {
  font-family:'DM Mono',monospace; font-size:.68rem;
  color:#7a9ab8; text-decoration:none; transition:all .2s;
  border:1px solid rgba(26,45,69,.9); border-radius:99px;
  padding:.2rem .65rem; white-space:nowrap;
}
.site-nav-back:hover { color:#dde6f5; border-color:#2a4060; background:rgba(255,255,255,.04); }
</style>
</head>
<body>
<nav class="site-nav"><a href="../../index.html" class="site-nav-logo"><img src="../../logos/learnr-colored-dark.svg" alt="learnr" class="site-nav-img"></a><a href="../../index.html" class="site-nav-back">&#8592; Back to Portal</a></nav>
<div id="ui">
  <div>
    <h1>Probability</h1>
    <p>Class X · CBSE · Mind Map — hover nodes to explore</p>
  </div>
</div>

<div class="ctrl-bar">
  <button class="ctrl-btn" onclick="zoom(1.2)">＋ Zoom</button>
  <button class="ctrl-btn" onclick="zoom(0.83)">－ Zoom</button>
  <button class="ctrl-btn" onclick="resetView()">⌖ Reset</button>
</div>

<div id="tooltip"></div>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const tip = document.getElementById('tooltip');

let W, H, scale = 1, ox = 0, oy = 0;
let dragging = false, dragStart = {x:0,y:0}, dragOrigin = {x:0,y:0};

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  ox = W/2; oy = H/2 + 20;
  draw();
}
window.addEventListener('resize', resize);

const CENTER = {
  id:'c', label:'Probability', x:0, y:0, r:62,
  color:'#12041c', stroke:'#d946ef', textColor:'#f0abfc', fontSize:15
};

const BRANCHES = [
  {
    id:'basics', label:'Basic\nIdeas', x:0, y:-290, r:44,
    color:'#12041c', stroke:'#d946ef', textColor:'#f0abfc',
    info:'Probability measures how likely an event is.\nIt always lies between 0 and 1.\nExperiment, outcome, event and trial are the key words.',
    children:[
      { id:'b1', label:'Experiment\n& Outcome', x:-180, y:-410, r:34, color:'#12041c', stroke:'#e879f9', textColor:'#f5d0fe',
        info:'An experiment is an action with uncertain results (tossing a coin).\nEach possible result is an outcome.' },
      { id:'b2', label:'Event', x:0, y:-440, r:34, color:'#12041c', stroke:'#e879f9', textColor:'#f5d0fe',
        info:'An event is a collection of one or more favourable outcomes, e.g. "getting an even number" on a die = {2,4,6}.' },
      { id:'b3', label:'Random\nExperiment', x:180, y:-410, r:34, color:'#12041c', stroke:'#e879f9', textColor:'#f5d0fe',
        info:'A random experiment has more than one possible outcome and its result cannot be predicted with certainty.' },
    ]
  },
  {
    id:'theo', label:'Theoretical\nProbability', x:-300, y:-185, r:44,
    color:'#001a08', stroke:'#22c55e', textColor:'#86efac',
    info:'P(E) = (favourable outcomes) ÷ (total outcomes).\nAssumes all outcomes are equally likely.',
    children:[
      { id:'t1', label:'P(E) =\nfav / total', x:-510, y:-300, r:36, color:'#001a08', stroke:'#4ade80', textColor:'#bbf7d0',
        info:'P(E) = number of favourable outcomes ÷ number of all possible outcomes.\nAlso called classical probability.' },
      { id:'t2', label:'Equally\nLikely', x:-540, y:-170, r:34, color:'#001a08', stroke:'#4ade80', textColor:'#bbf7d0',
        info:'Outcomes are equally likely if each has the same chance, e.g. a fair coin or an unbiased die.' },
      { id:'t3', label:'Range\n0 ≤ P ≤ 1', x:-510, y:-40, r:34, color:'#001a08', stroke:'#4ade80', textColor:'#bbf7d0',
        info:'Probability is always between 0 and 1.\nP = 0 → impossible event; P = 1 → sure (certain) event.' },
      { id:'t4', label:'Sum = 1', x:-330, y:-360, r:34, color:'#001a08', stroke:'#4ade80', textColor:'#bbf7d0',
        info:'The sum of the probabilities of all elementary outcomes of an experiment is always 1.' },
    ]
  },
  {
    id:'sample', label:'Sample\nSpace', x:-300, y:185, r:44,
    color:'#00121a', stroke:'#38bdf8', textColor:'#bae6fd',
    info:'The sample space is the set of ALL possible outcomes.\nCounting it correctly is the key to every problem.',
    children:[
      { id:'sp1', label:'List All\nOutcomes', x:-510, y:80, r:36, color:'#00121a', stroke:'#7dd3fc', textColor:'#e0f2fe',
        info:'Write out every possible result. For one die: {1,2,3,4,5,6}. Total outcomes = 6.' },
      { id:'sp2', label:'Two Coins\n= 4', x:-540, y:210, r:34, color:'#00121a', stroke:'#7dd3fc', textColor:'#e0f2fe',
        info:'Two coins: {HH, HT, TH, TT} → 4 outcomes.\nThree coins → 8 outcomes (2ⁿ rule).' },
      { id:'sp3', label:'Two Dice\n= 36', x:-500, y:340, r:34, color:'#00121a', stroke:'#7dd3fc', textColor:'#e0f2fe',
        info:'Two dice give 6 × 6 = 36 ordered pairs.\nSums range from 2 to 12 (not equally likely!).' },
      { id:'sp4', label:'Counting\nRule', x:-310, y:390, r:34, color:'#00121a', stroke:'#7dd3fc', textColor:'#e0f2fe',
        info:'If one stage has m outcomes and another n, together they have m × n outcomes.' },
    ]
  },
  {
    id:'comp', label:'Complementary\nEvents', x:300, y:-185, r:44,
    color:'#1a0010', stroke:'#f43f5e', textColor:'#fda4af',
    info:'The event "not E" is the complement of E.\nP(E) + P(not E) = 1.',
    children:[
      { id:'cp1', label:'P(not E)\n= 1 − P(E)', x:510, y:-300, r:36, color:'#1a0010', stroke:'#fb7185', textColor:'#fecdd3',
        info:'The complement Ē (or "not E") consists of all outcomes NOT in E.\nP(Ē) = 1 − P(E).' },
      { id:'cp2', label:'Sure\nEvent', x:540, y:-170, r:34, color:'#1a0010', stroke:'#fb7185', textColor:'#fecdd3',
        info:'A sure (certain) event always happens. Its probability is 1, e.g. getting a number ≤ 6 on a die.' },
      { id:'cp3', label:'Impossible\nEvent', x:510, y:-40, r:34, color:'#1a0010', stroke:'#fb7185', textColor:'#fecdd3',
        info:'An impossible event never happens. Its probability is 0, e.g. getting 7 on a single die.' },
    ]
  },
  {
    id:'objects', label:'Coins, Dice\n& Cards', x:300, y:185, r:44,
    color:'#0a0020', stroke:'#818cf8', textColor:'#c7d2fe',
    info:'Standard experiments in exams: tossing coins, rolling dice and drawing playing cards.',
    children:[
      { id:'o1', label:'Coins\n(H / T)', x:510, y:80, r:36, color:'#0a0020', stroke:'#a5b4fc', textColor:'#e0e7ff',
        info:'A coin has 2 faces: Head and Tail.\nn coins → 2ⁿ equally likely outcomes.' },
      { id:'o2', label:'Dice\n(1–6)', x:540, y:220, r:34, color:'#0a0020', stroke:'#a5b4fc', textColor:'#e0e7ff',
        info:'A die has 6 faces. One die → 6 outcomes.\nEven = {2,4,6}, prime = {2,3,5}.' },
      { id:'o3', label:'52 Playing\nCards', x:500, y:360, r:34, color:'#0a0020', stroke:'#a5b4fc', textColor:'#e0e7ff',
        info:'52 cards = 4 suits × 13. Red = 26, Black = 26.\n12 face cards (J, Q, K), 4 aces.' },
      { id:'o4', label:'Balls in\na Bag', x:310, y:390, r:34, color:'#0a0020', stroke:'#a5b4fc', textColor:'#e0e7ff',
        info:'Coloured balls / marbles: total = sum of all balls; favourable = balls of the chosen colour.' },
    ]
  },
  {
    id:'apps', label:'Applications\n& Traps', x:0, y:290, r:44,
    color:'#001a12', stroke:'#2dd4bf', textColor:'#99f6e4',
    info:'Real-world uses of probability — and the common mistakes to avoid in exams.',
    children:[
      { id:'a1', label:'Real-Life\nChance', x:-170, y:420, r:34, color:'#001a12', stroke:'#5eead4', textColor:'#ccfbf1',
        info:'Weather forecasts, games, insurance and quality testing all use probability to measure chance.' },
      { id:'a2', label:'Equally-\nLikely Trap', x:0, y:460, r:34, color:'#001a12', stroke:'#5eead4', textColor:'#ccfbf1',
        info:'Sums of two dice are NOT equally likely — 7 is far more likely than 2. Always count ordered pairs.' },
      { id:'a3', label:'Without\nReplacement', x:170, y:420, r:34, color:'#001a12', stroke:'#5eead4', textColor:'#ccfbf1',
        info:'If a card/ball is removed and not put back, the total for the next draw decreases by 1.' },
    ]
  }
];

// Build flat list
const allNodes = [CENTER];
const allEdges = [];
BRANCHES.forEach(b => {
  allNodes.push(b);
  allEdges.push({from:'c', to:b.id});
  (b.children||[]).forEach(ch => {
    allNodes.push(ch);
    allEdges.push({from:b.id, to:ch.id});
  });
});

function getNode(id) { return allNodes.find(n=>n.id===id); }

// Pan & zoom
canvas.addEventListener('mousedown', e => { dragging=true; dragStart={x:e.clientX,y:e.clientY}; dragOrigin={x:ox,y:oy}; });
canvas.addEventListener('mousemove', e => {
  if (dragging) { ox = dragOrigin.x+(e.clientX-dragStart.x); oy = dragOrigin.y+(e.clientY-dragStart.y); draw(); return; }
  const mx=(e.clientX-ox)/scale, my=(e.clientY-oy)/scale;
  let found=null;
  allNodes.forEach(n=>{ const dx=mx-n.x,dy=my-n.y; if(Math.sqrt(dx*dx+dy*dy)<n.r+6) found=n; });
  if(found && found.info){ tip.style.display='block'; tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY-10)+'px';
    tip.innerHTML=`<strong>${found.label.replace(/\n/g,' ')}</strong>${found.info.replace(/\n/g,'<br>')}`;
    canvas.style.cursor='pointer';
  } else { tip.style.display='none'; canvas.style.cursor='grab'; }
});
canvas.addEventListener('mouseup', ()=>dragging=false);
canvas.addEventListener('mouseleave', ()=>{ dragging=false; tip.style.display='none'; });
canvas.addEventListener('wheel', e=>{ e.preventDefault(); const f=e.deltaY<0?1.1:0.91; zoomAt(f,e.clientX,e.clientY); },{passive:false});

// Touch
let lastTouchDist=null;
canvas.addEventListener('touchstart',e=>{ if(e.touches.length===1){ dragging=true; dragStart={x:e.touches[0].clientX,y:e.touches[0].clientY}; dragOrigin={x:ox,y:oy}; }});
canvas.addEventListener('touchmove',e=>{ e.preventDefault();
  if(e.touches.length===1&&dragging){ ox=dragOrigin.x+(e.touches[0].clientX-dragStart.x); oy=dragOrigin.y+(e.touches[0].clientY-dragStart.y); draw(); }
  if(e.touches.length===2){ const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    if(lastTouchDist){ const cx=(e.touches[0].clientX+e.touches[1].clientX)/2,cy=(e.touches[0].clientY+e.touches[1].clientY)/2; zoomAt(d/lastTouchDist,cx,cy); }
    lastTouchDist=d; }
},{passive:false});
canvas.addEventListener('touchend',()=>{ dragging=false; lastTouchDist=null; });

function zoomAt(f,cx,cy){ const prev=scale; scale=Math.max(.3,Math.min(2.5,scale*f)); ox=cx-(cx-ox)*(scale/prev); oy=cy-(cy-oy)*(scale/prev); draw(); }
function zoom(f){ zoomAt(f,W/2,H/2); }
function resetView(){ scale=1; ox=W/2; oy=H/2+20; draw(); }

// Draw
function draw() {
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(ox,oy);
  ctx.scale(scale,scale);

  // grid
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,.025)';
  ctx.lineWidth=1;
  for(let x=-1000;x<1000;x+=60){ ctx.beginPath();ctx.moveTo(x,-1000);ctx.lineTo(x,1000);ctx.stroke(); }
  for(let y=-1000;y<1000;y+=60){ ctx.beginPath();ctx.moveTo(-1000,y);ctx.lineTo(1000,y);ctx.stroke(); }
  ctx.restore();

  // edges
  allEdges.forEach(e=>{
    const a=getNode(e.from),b=getNode(e.to);
    if(!a||!b)return;
    const grd=ctx.createLinearGradient(a.x,a.y,b.x,b.y);
    grd.addColorStop(0,a.stroke+'88');
    grd.addColorStop(1,b.stroke+'44');
    ctx.beginPath();
    const cx=(a.x+b.x)/2, cy=(a.y+b.y)/2-30;
    ctx.moveTo(a.x,a.y);
    ctx.quadraticCurveTo(cx,cy,b.x,b.y);
    ctx.strokeStyle=grd;
    ctx.lineWidth=e.from==='c'?2.5:1.5;
    ctx.setLineDash(e.from==='c'?[]:[4,4]);
    ctx.stroke();
    ctx.setLineDash([]);
  });

  // nodes
  allNodes.forEach(n=>{
    ctx.save();
    ctx.shadowColor=n.stroke;
    ctx.shadowBlur=n.id==='c'?30:16;
    ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
    ctx.fillStyle=n.color;
    ctx.fill();
    ctx.restore();

    ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
    ctx.strokeStyle=n.stroke;
    ctx.lineWidth=n.id==='c'?3:2;
    ctx.stroke();

    ctx.fillStyle=n.textColor;
    ctx.font=`700 ${n.fontSize||11}px Nunito,sans-serif`;
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    const lines=n.label.split('\n');
    const lh=14;
    const startY=n.y-(lines.length-1)*lh/2;
    lines.forEach((l,i)=>ctx.fillText(l,n.x,startY+i*lh));
  });

  ctx.restore();
}

resize();
</script>
</body>
</html>
