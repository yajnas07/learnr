<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards — Probability</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Mono:wght@400;500&family=Lato:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#040810;--card:#0a1422;--card2:#0f1c30;--border:#1a2d45;--text:#cce4ff;--muted:#4a6890;
  --amber:#f59e0b;--teal:#2dd4bf;--blue:#38bdf8;--green:#22c55e;--red:#f43f5e;--indigo:#818cf8;--purple:#d946ef;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Lato',sans-serif;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(217,70,239,.06) 0%,transparent 60%);}

.site-nav{display:flex;align-items:center;justify-content:space-between;padding:.42rem 1.2rem;
  background:rgba(4,8,16,.9);backdrop-filter:blur(14px);border-bottom:1px solid rgba(26,45,69,.75);position:sticky;top:0;z-index:9999;}
.site-nav-logo{display:flex;align-items:center;text-decoration:none;}
.site-nav-img{height:28px;}
.site-nav-back{font-family:'DM Mono',monospace;font-size:.68rem;color:#7a9ab8;text-decoration:none;border:1px solid rgba(26,45,69,.9);border-radius:99px;padding:.2rem .65rem;}
.site-nav-back:hover{color:#dde6f5;}

header{text-align:center;padding:1.4rem 1rem .4rem;}
header h1{font-family:'Playfair Display',serif;font-size:clamp(1.3rem,4vw,2rem);font-weight:900;color:var(--purple);}
header p{color:var(--muted);font-family:'DM Mono',monospace;font-size:.72rem;margin-top:.3rem;}

.filters{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;padding:.8rem 1rem;max-width:800px;margin:0 auto;}
.filt{font-family:'DM Mono',monospace;font-size:.68rem;padding:.3rem .7rem;border-radius:99px;border:1px solid var(--border);
  background:var(--card);color:var(--muted);cursor:pointer;transition:.15s;}
.filt:hover{color:var(--text);}
.filt.active{background:var(--purple);color:#04121e;border-color:var(--purple);font-weight:700;}

.progress{text-align:center;font-family:'DM Mono',monospace;font-size:.7rem;color:var(--muted);margin:.3rem 0;}

.stage{max-width:560px;margin:0 auto;padding:1rem 1.2rem 2rem;}
.card{perspective:1600px;height:340px;cursor:pointer;}
.card-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;}
.card.flipped .card-inner{transform:rotateY(180deg);}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;border:1px solid var(--border);
  background:var(--card);padding:1.6rem;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
.face-back{transform:rotateY(180deg);background:var(--card2);}
.cat-tag{position:absolute;top:1rem;left:1rem;font-family:'DM Mono',monospace;font-size:.62rem;padding:.2rem .55rem;border-radius:99px;}
.face .side{position:absolute;top:1rem;right:1rem;font-family:'DM Mono',monospace;font-size:.6rem;color:var(--muted);}
.q-text{font-family:'Playfair Display',serif;font-size:1.15rem;font-weight:700;line-height:1.45;}
.a-text{font-size:.95rem;line-height:1.6;color:var(--text);}
.hint{margin-top:1rem;font-family:'DM Mono',monospace;font-size:.66rem;color:var(--muted);font-style:italic;}
.flip-hint{position:absolute;bottom:1rem;font-family:'DM Mono',monospace;font-size:.6rem;color:var(--muted);}

.controls{display:flex;align-items:center;justify-content:center;gap:.6rem;margin-top:1.2rem;}
.btn{font-family:'DM Mono',monospace;font-size:.72rem;padding:.5rem .9rem;border-radius:8px;border:1px solid var(--border);
  background:var(--card);color:var(--text);cursor:pointer;transition:.15s;}
.btn:hover{border-color:var(--purple);color:var(--purple);}
.btn-known{border-color:rgba(34,197,94,.4);color:var(--green);}
.btn-review{border-color:rgba(245,158,11,.4);color:var(--amber);}
.mark-row{display:flex;justify-content:center;gap:.6rem;margin-top:.7rem;}
.counter{font-family:'DM Mono',monospace;font-size:.8rem;color:var(--muted);min-width:64px;text-align:center;}
.util-row{display:flex;justify-content:center;gap:.6rem;margin-top:1rem;}
</style>
</head>
<body>
<nav class="site-nav">
  <a href="../../index.html" class="site-nav-logo"><img src="../../logos/learnr-colored-dark.svg" alt="learnr" class="site-nav-img"></a>
  <a href="../../index.html" class="site-nav-back">&#8592; Back to Portal</a>
</nav>
<header>
  <h1>Probability</h1>
  <p>Class X · Mathematics Ch.14 · 36 Flashcards · 6 Categories</p>
</header>

<div class="filters" id="filters"></div>
<div class="progress" id="progress"></div>

<div class="stage">
  <div class="card" id="card" onclick="flip()">
    <div class="card-inner">
      <div class="face face-front">
        <span class="cat-tag" id="catFront"></span>
        <span class="side" id="sideFront"></span>
        <div class="q-text" id="qText"></div>
        <div class="hint" id="hintText"></div>
        <div class="flip-hint">click / space to flip →</div>
      </div>
      <div class="face face-back">
        <span class="cat-tag" id="catBack"></span>
        <span class="side">answer</span>
        <div class="a-text" id="aText"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" onclick="nav(-1)">← Prev</button>
    <span class="counter" id="counter"></span>
    <button class="btn" onclick="nav(1)">Next →</button>
  </div>
  <div class="mark-row">
    <button class="btn btn-known" onclick="markKnown()">✓ Known</button>
    <button class="btn btn-review" onclick="markReview()">↻ Review</button>
  </div>
  <div class="util-row">
    <button class="btn" onclick="shuffle()">🔀 Shuffle</button>
    <button class="btn" onclick="resetAll()">♻ Reset</button>
  </div>
</div>

<script>
const catColors={bas:'#d946ef',theo:'#22c55e',samp:'#38bdf8',comp:'#f43f5e',obj:'#818cf8',app:'#2dd4bf'};
const catNames={bas:'Basics',theo:'Theoretical',samp:'Sample Space',comp:'Complement',obj:'Coins/Dice/Cards',app:'Applications'};

const ALL_CARDS=[
// BASICS
{cat:'bas',q:'What does probability measure?',a:'Probability is a numerical measure of how likely an event is to happen. It lies between 0 and 1.',hint:'measure of chance'},
{cat:'bas',q:'What is a random experiment?',a:'An experiment with more than one possible outcome whose result cannot be predicted in advance.',hint:'uncertain result'},
{cat:'bas',q:'What is an outcome?',a:'A single possible result of an experiment, e.g. getting a "3" when a die is rolled.',hint:'one result'},
{cat:'bas',q:'What is an event?',a:'A collection of one or more favourable outcomes, e.g. "an even number" = {2,4,6}.',hint:'set of outcomes'},
{cat:'bas',q:'What is an elementary event?',a:'An event with exactly one outcome. The sum of all elementary event probabilities is 1.',hint:'single outcome'},
{cat:'bas',q:'What is a trial?',a:'A single performance of a random experiment, such as one toss of a coin.',hint:'one performance'},
// THEORETICAL
{cat:'theo',q:'State the formula for theoretical probability.',a:'P(E) = (number of favourable outcomes) ÷ (total number of outcomes).',hint:'fav / total'},
{cat:'theo',q:'What condition must outcomes satisfy in classical probability?',a:'All outcomes must be equally likely (e.g. a fair coin or an unbiased die).',hint:'equally likely'},
{cat:'theo',q:'What is the range of any probability?',a:'0 ≤ P(E) ≤ 1. It can never be negative or greater than 1.',hint:'0 to 1'},
{cat:'theo',q:'What is the sum of probabilities of all elementary events?',a:'It always equals 1.',hint:'ΣP = 1'},
{cat:'theo',q:'A die is rolled. What is P(getting an even number)?',a:'Favourable = {2,4,6} = 3, total = 6. P = 3/6 = 1/2.',hint:'3/6'},
{cat:'theo',q:'What does "equally likely" mean?',a:'Each outcome has the same chance of occurring — no outcome is favoured over another.',hint:'same chance'},
// SAMPLE SPACE
{cat:'samp',q:'How many outcomes when 2 coins are tossed?',a:'4 outcomes: {HH, HT, TH, TT}.',hint:'2² = 4'},
{cat:'samp',q:'How many outcomes when 3 coins are tossed?',a:'8 outcomes (2³). In general n coins give 2ⁿ outcomes.',hint:'2ⁿ'},
{cat:'samp',q:'How many outcomes when 2 dice are rolled?',a:'6 × 6 = 36 ordered pairs.',hint:'6×6 = 36'},
{cat:'samp',q:'State the fundamental counting rule.',a:'If one stage has m outcomes and another n outcomes, together they have m × n outcomes.',hint:'m × n'},
{cat:'samp',q:'When 2 dice are rolled, is (2,5) the same as (5,2)?',a:'No — they are different ordered pairs. That is why there are 36 outcomes, not 21.',hint:'ordered pairs'},
{cat:'samp',q:'Are the sums of two dice equally likely?',a:'No. A sum of 7 has 6 ways; sums of 2 or 12 have only 1 way each.',hint:'7 most likely'},
// COMPLEMENT
{cat:'comp',q:'What is the complement of an event E?',a:'The event "not E" (written Ē) — all outcomes that are NOT in E.',hint:'not E'},
{cat:'comp',q:'State the complement rule.',a:'P(not E) = 1 − P(E). Equivalently P(E) + P(Ē) = 1.',hint:'1 − P(E)'},
{cat:'comp',q:'What is the probability of a sure (certain) event?',a:'1 — it is guaranteed to happen, e.g. getting a number ≤ 6 on a die.',hint:'P = 1'},
{cat:'comp',q:'What is the probability of an impossible event?',a:'0 — it can never happen, e.g. getting a 7 on a single die.',hint:'P = 0'},
{cat:'comp',q:'If P(E) = 0.3, what is P(not E)?',a:'P(not E) = 1 − 0.3 = 0.7.',hint:'0.7'},
{cat:'comp',q:'Why is the complement rule useful for "at least one" problems?',a:'It is often easier to compute 1 − P(none) than to add many separate cases.',hint:'1 − P(none)'},
// COINS/DICE/CARDS
{cat:'obj',q:'How many cards are in a standard deck and how are they split?',a:'52 cards = 4 suits × 13. Red = 26 (♥♦), Black = 26 (♠♣).',hint:'52 = 4×13'},
{cat:'obj',q:'How many face cards are in a deck?',a:'12 face cards — Jack, Queen and King in each of the 4 suits.',hint:'12'},
{cat:'obj',q:'How many aces are in a deck?',a:'4 aces, one per suit.',hint:'4'},
{cat:'obj',q:'A card is drawn. What is P(a king)?',a:'4 kings out of 52 → P = 4/52 = 1/13.',hint:'1/13'},
{cat:'obj',q:'A die is rolled. What is P(a prime number)?',a:'Primes on a die = {2,3,5} = 3 outcomes → P = 3/6 = 1/2.',hint:'{2,3,5}'},
{cat:'obj',q:'A bag has 3 red and 2 blue balls. P(red)?',a:'Total = 5, favourable = 3 → P = 3/5.',hint:'3/5'},
// APPLICATIONS
{cat:'app',q:'What does "without replacement" mean?',a:'A drawn card/ball is not returned, so the total decreases by 1 for the next draw.',hint:'total − 1'},
{cat:'app',q:'Give a real-life use of probability.',a:'Weather forecasts, insurance, games of chance, and quality/defect testing.',hint:'forecasts, games'},
{cat:'app',q:'Two coins are tossed. P(at least one head)?',a:'1 − P(no head) = 1 − 1/4 = 3/4.',hint:'1 − 1/4'},
{cat:'app',q:'A number is chosen from 1–20. P(a multiple of 5)?',a:'Multiples = {5,10,15,20} = 4 → P = 4/20 = 1/5.',hint:'1/5'},
{cat:'app',q:'Why must you simplify the final probability?',a:'A probability is usually left as a reduced fraction, e.g. 26/52 → 1/2.',hint:'reduce fraction'},
{cat:'app',q:'A card is drawn. P(a red face card)?',a:'Red face cards = 6 (J,Q,K of ♥ and ♦) → P = 6/52 = 3/26.',hint:'6/52'},
];

let cards=[...ALL_CARDS];
let idx=0, filter='all';
const known=new Set(), review=new Set();

function buildFilters(){
  const f=document.getElementById('filters');
  const cats=['all',...Object.keys(catNames)];
  f.innerHTML=cats.map(c=>{
    const label=c==='all'?'All':catNames[c];
    return `<button class="filt${c===filter?' active':''}" onclick="setFilter('${c}')">${label}</button>`;
  }).join('');
}
function setFilter(c){
  filter=c;
  cards = c==='all' ? [...ALL_CARDS] : ALL_CARDS.filter(x=>x.cat===c);
  idx=0; buildFilters(); render();
}
function render(){
  if(!cards.length)return;
  const card=cards[idx];
  document.getElementById('card').classList.remove('flipped');
  const col=catColors[card.cat];
  document.getElementById('catFront').outerHTML=`<span class="cat-tag" id="catFront" style="background:${col}22;color:${col}">${catNames[card.cat]}</span>`;
  document.getElementById('catBack').outerHTML=`<span class="cat-tag" id="catBack" style="background:${col}22;color:${col}">${catNames[card.cat]}</span>`;
  document.getElementById('qText').textContent=card.q;
  document.getElementById('aText').textContent=card.a;
  document.getElementById('hintText').textContent='💡 '+card.hint;
  document.getElementById('sideFront').textContent='question';
  document.getElementById('counter').textContent=`${idx+1} / ${cards.length}`;
  updateProgress();
}
function updateProgress(){
  document.getElementById('progress').textContent=
    `Known: ${known.size}  ·  To review: ${review.size}  ·  Total: ${ALL_CARDS.length}`;
}
function flip(){document.getElementById('card').classList.toggle('flipped');}
function nav(d){idx=(idx+d+cards.length)%cards.length;render();}
function markKnown(){const c=cards[idx];known.add(c.q);review.delete(c.q);updateProgress();nav(1);}
function markReview(){const c=cards[idx];review.add(c.q);known.delete(c.q);updateProgress();nav(1);}
function shuffle(){for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]];}idx=0;render();}
function resetAll(){known.clear();review.clear();setFilter('all');}
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();flip();}
  else if(e.code==='ArrowRight')nav(1);
  else if(e.code==='ArrowLeft')nav(-1);
});
buildFilters();render();
</script>
</body>
</html>
