<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mind Map — Statistics</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #040810; font-family: 'Nunito', sans-serif; overflow: hidden; width: 100vw; height: 100vh; }
canvas { position: absolute; inset: 0; }

#ui {
  position: absolute; top: 0; left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: center;
  padding: .8rem 1.2rem; z-index: 10; pointer-events: none;
}
#ui h1 {
  font-family: 'Syne', sans-serif; font-size: 1.1rem; font-weight: 800;
  background: linear-gradient(135deg,#38bdf8,#818cf8,#22c55e);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
#ui p { font-family: 'DM Mono', monospace; font-size: .68rem; color: #475569; margin-top: .1rem; }

.ctrl-bar {
  position: absolute; bottom: 1rem; left: 50%; transform: translateX(-50%);
  display: flex; gap: .5rem; z-index: 10;
}
.ctrl-btn {
  font-family: 'Syne', sans-serif; font-weight: 700; font-size: .75rem;
  padding: .4rem 1rem; border-radius: 99px;
  border: 1.5px solid #334155; background: rgba(30,41,59,.9);
  color: #94a3b8; cursor: pointer; transition: all .2s; pointer-events: all;
}
.ctrl-btn:hover { border-color: #64748b; color: #e2e8f0; }

#tooltip {
  position: absolute; z-index: 20; pointer-events: none;
  background: #1e293b; border: 1px solid #334155;
  border-radius: 12px; padding: .7rem 1rem;
  max-width: 260px; font-size: .82rem; color: #e2e8f0;
  line-height: 1.6; display: none;
  box-shadow: 0 8px 24px rgba(0,0,0,.6);
}
#tooltip strong { font-family: 'Syne', sans-serif; display: block; margin-bottom: .3rem; }

.site-nav {
  display:flex; align-items:center; justify-content:space-between;
  padding:.42rem 1.2rem; width:100%; align-self:stretch; flex-shrink:0;
  background:rgba(4,8,16,.9); backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(26,45,69,.75);
  position:sticky; top:0; z-index:9999;
}
.site-nav-logo { display:flex; align-items:center; text-decoration:none; }
.site-nav-img  { height:28px; width:auto; display:block; border-radius:4px; }
.site-nav-back {
  font-family:'DM Mono',monospace; font-size:.68rem;
  color:#7a9ab8; text-decoration:none; transition:all .2s;
  border:1px solid rgba(26,45,69,.9); border-radius:99px;
  padding:.2rem .65rem; white-space:nowrap;
}
.site-nav-back:hover { color:#dde6f5; border-color:#2a4060; background:rgba(255,255,255,.04); }
</style>
</head>
<body>
<nav class="site-nav"><a href="../../index.html" class="site-nav-logo"><img src="../../logos/learnr-colored-dark.svg" alt="learnr" class="site-nav-img"></a><a href="../../index.html" class="site-nav-back">&#8592; Back to Portal</a></nav>
<div id="ui">
  <div>
    <h1>Statistics</h1>
    <p>Class X · CBSE · Mind Map — hover nodes to explore</p>
  </div>
</div>

<div class="ctrl-bar">
  <button class="ctrl-btn" onclick="zoom(1.2)">＋ Zoom</button>
  <button class="ctrl-btn" onclick="zoom(0.83)">－ Zoom</button>
  <button class="ctrl-btn" onclick="resetView()">⌖ Reset</button>
</div>

<div id="tooltip"></div>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const tip = document.getElementById('tooltip');

let W, H, scale = 1, ox = 0, oy = 0;
let dragging = false, dragStart = {x:0,y:0}, dragOrigin = {x:0,y:0};

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  ox = W/2; oy = H/2 + 20;
  draw();
}
window.addEventListener('resize', resize);

const CENTER = {
  id:'c', label:'Statistics', x:0, y:0, r:62,
  color:'#00121a', stroke:'#38bdf8', textColor:'#bae6fd', fontSize:15
};

const BRANCHES = [
  {
    id:'data', label:'Data\nBasics', x:0, y:-290, r:44,
    color:'#00121a', stroke:'#38bdf8', textColor:'#bae6fd',
    info:'Data is organised into class intervals with frequencies.\nClass mark = (lower + upper limit) ÷ 2.\nCumulative frequency (cf) is a running total of frequencies.',
    children:[
      { id:'d1', label:'Class\nInterval', x:-180, y:-410, r:34, color:'#00121a', stroke:'#7dd3fc', textColor:'#e0f2fe',
        info:'A group of values, e.g. 10–20.\nClass size (h) = upper − lower limit.\nUse continuous (exclusive) classes for grouped data.' },
      { id:'d2', label:'Class\nMark', x:0, y:-440, r:34, color:'#00121a', stroke:'#7dd3fc', textColor:'#e0f2fe',
        info:'Class mark (xᵢ) = (lower limit + upper limit) ÷ 2.\nIt represents the whole class in mean calculations.' },
      { id:'d3', label:'Cumulative\nFrequency', x:180, y:-410, r:34, color:'#00121a', stroke:'#7dd3fc', textColor:'#e0f2fe',
        info:'cf = running total of frequencies up to a class.\n"Less than" cf adds upward; "more than" cf adds downward.\nUsed to find the median.' },
    ]
  },
  {
    id:'mean', label:'Mean\n(Average)', x:-300, y:-185, r:44,
    color:'#001a08', stroke:'#22c55e', textColor:'#86efac',
    info:'The mean of grouped data can be found by three methods:\nDirect, Assumed Mean and Step-Deviation.\nAll give the same answer.',
    children:[
      { id:'m1', label:'Direct\nMethod', x:-510, y:-300, r:36, color:'#001a08', stroke:'#4ade80', textColor:'#bbf7d0',
        info:'Mean x̄ = Σfᵢxᵢ ÷ Σfᵢ\nMultiply each class mark by its frequency, add, divide by total frequency.' },
      { id:'m2', label:'Assumed\nMean', x:-540, y:-170, r:34, color:'#001a08', stroke:'#4ade80', textColor:'#bbf7d0',
        info:'x̄ = a + (Σfᵢdᵢ ÷ Σfᵢ), where dᵢ = xᵢ − a.\n"a" is an assumed mean (a convenient class mark).' },
      { id:'m3', label:'Step-\nDeviation', x:-510, y:-40, r:34, color:'#001a08', stroke:'#4ade80', textColor:'#bbf7d0',
        info:'x̄ = a + h·(Σfᵢuᵢ ÷ Σfᵢ), where uᵢ = (xᵢ − a)/h.\nEasiest when class sizes are equal — numbers stay small.' },
      { id:'m4', label:'When to\nUse', x:-330, y:-360, r:34, color:'#001a08', stroke:'#4ade80', textColor:'#bbf7d0',
        info:'Direct: small numbers.\nAssumed mean: large class marks.\nStep-deviation: equal class widths — quickest for exams.' },
    ]
  },
  {
    id:'med', label:'Median', x:-300, y:185, r:44,
    color:'#0a0020', stroke:'#818cf8', textColor:'#c7d2fe',
    info:'The median is the middle value of grouped data.\nMedian = l + [(n/2 − cf)/f] × h.',
    children:[
      { id:'me1', label:'Median\nClass', x:-510, y:80, r:36, color:'#0a0020', stroke:'#a5b4fc', textColor:'#e0e7ff',
        info:'The class whose cumulative frequency first reaches or exceeds n/2.\nFind it from the cf column.' },
      { id:'me2', label:'Median\nFormula', x:-540, y:210, r:34, color:'#0a0020', stroke:'#a5b4fc', textColor:'#e0e7ff',
        info:'Median = l + [(n/2 − cf)/f] × h\nl = lower limit of median class, cf = cf of class before it, f = its frequency, h = class size.' },
      { id:'me3', label:'n/2\nPosition', x:-500, y:340, r:34, color:'#0a0020', stroke:'#a5b4fc', textColor:'#e0e7ff',
        info:'For grouped data we use n/2 (not (n+1)/2).\nn = Σfᵢ = total frequency.' },
      { id:'me4', label:'Middle\nMeasure', x:-310, y:390, r:34, color:'#0a0020', stroke:'#a5b4fc', textColor:'#e0e7ff',
        info:'The median is not affected by extreme values (outliers).\nIt divides the data into two equal halves.' },
    ]
  },
  {
    id:'mode', label:'Mode', x:300, y:-185, r:44,
    color:'#1a0010', stroke:'#f43f5e', textColor:'#fda4af',
    info:'The mode is the most frequent value.\nMode = l + [(f₁ − f₀)/(2f₁ − f₀ − f₂)] × h.',
    children:[
      { id:'mo1', label:'Modal\nClass', x:510, y:-300, r:36, color:'#1a0010', stroke:'#fb7185', textColor:'#fecdd3',
        info:'The class with the highest frequency.\nThe mode lies inside this class.' },
      { id:'mo2', label:'Mode\nFormula', x:540, y:-170, r:34, color:'#1a0010', stroke:'#fb7185', textColor:'#fecdd3',
        info:'Mode = l + [(f₁ − f₀)/(2f₁ − f₀ − f₂)] × h\nf₁ = modal frequency, f₀ = before, f₂ = after, h = class size.' },
      { id:'mo3', label:'Most\nFrequent', x:510, y:-40, r:34, color:'#1a0010', stroke:'#fb7185', textColor:'#fecdd3',
        info:'The mode is the value that occurs most often.\nData can have one, two, or no mode.' },
    ]
  },
  {
    id:'ogive', label:'Ogive &\nGraphs', x:300, y:185, r:44,
    color:'#12041c', stroke:'#d946ef', textColor:'#f0abfc',
    info:'An ogive is a cumulative frequency curve.\nIt gives the median graphically.',
    children:[
      { id:'og1', label:'Less Than\nOgive', x:510, y:80, r:36, color:'#12041c', stroke:'#e879f9', textColor:'#f5d0fe',
        info:'Plot (upper limit, cumulative frequency).\nA rising curve from left to right.' },
      { id:'og2', label:'More Than\nOgive', x:540, y:220, r:34, color:'#12041c', stroke:'#e879f9', textColor:'#f5d0fe',
        info:'Plot (lower limit, cumulative frequency from top).\nA falling curve from left to right.' },
      { id:'og3', label:'Median from\nGraph', x:500, y:360, r:34, color:'#12041c', stroke:'#e879f9', textColor:'#f5d0fe',
        info:'The x-coordinate where the two ogives intersect is the median.\nAlso: draw a line at y = n/2 to the "less than" curve.' },
      { id:'og4', label:'Histogram\nMode', x:310, y:390, r:34, color:'#12041c', stroke:'#e879f9', textColor:'#f5d0fe',
        info:'The mode can be located graphically inside the tallest bar of a histogram.' },
    ]
  },
  {
    id:'rel', label:'Empirical\nRelation', x:0, y:290, r:44,
    color:'#001a12', stroke:'#2dd4bf', textColor:'#99f6e4',
    info:'The three measures of central tendency are linked:\n3 Median = Mode + 2 Mean.',
    children:[
      { id:'r1', label:'3 Median =\nMode + 2 Mean', x:-170, y:420, r:36, color:'#001a12', stroke:'#5eead4', textColor:'#ccfbf1',
        info:'The empirical relationship:\nMode = 3 Median − 2 Mean.\nUse it to estimate one measure from the other two.' },
      { id:'r2', label:'Central\nTendency', x:0, y:460, r:34, color:'#001a12', stroke:'#5eead4', textColor:'#ccfbf1',
        info:'Mean, median and mode all describe the "centre" of data.\nEach gives a different kind of average.' },
      { id:'r3', label:'Estimate\nMissing', x:170, y:420, r:34, color:'#001a12', stroke:'#5eead4', textColor:'#ccfbf1',
        info:'If two of the three measures are known, the empirical relation estimates the third.' },
    ]
  }
];

// Build flat list
const allNodes = [CENTER];
const allEdges = [];
BRANCHES.forEach(b => {
  allNodes.push(b);
  allEdges.push({from:'c', to:b.id});
  (b.children||[]).forEach(ch => {
    allNodes.push(ch);
    allEdges.push({from:b.id, to:ch.id});
  });
});

function getNode(id) { return allNodes.find(n=>n.id===id); }

// Pan & zoom
canvas.addEventListener('mousedown', e => { dragging=true; dragStart={x:e.clientX,y:e.clientY}; dragOrigin={x:ox,y:oy}; });
canvas.addEventListener('mousemove', e => {
  if (dragging) { ox = dragOrigin.x+(e.clientX-dragStart.x); oy = dragOrigin.y+(e.clientY-dragStart.y); draw(); return; }
  const mx=(e.clientX-ox)/scale, my=(e.clientY-oy)/scale;
  let found=null;
  allNodes.forEach(n=>{ const dx=mx-n.x,dy=my-n.y; if(Math.sqrt(dx*dx+dy*dy)<n.r+6) found=n; });
  if(found && found.info){ tip.style.display='block'; tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY-10)+'px';
    tip.innerHTML=`<strong>${found.label.replace(/\n/g,' ')}</strong>${found.info.replace(/\n/g,'<br>')}`;
    canvas.style.cursor='pointer';
  } else { tip.style.display='none'; canvas.style.cursor='grab'; }
});
canvas.addEventListener('mouseup', ()=>dragging=false);
canvas.addEventListener('mouseleave', ()=>{ dragging=false; tip.style.display='none'; });
canvas.addEventListener('wheel', e=>{ e.preventDefault(); const f=e.deltaY<0?1.1:0.91; zoomAt(f,e.clientX,e.clientY); },{passive:false});

// Touch
let lastTouchDist=null;
canvas.addEventListener('touchstart',e=>{ if(e.touches.length===1){ dragging=true; dragStart={x:e.touches[0].clientX,y:e.touches[0].clientY}; dragOrigin={x:ox,y:oy}; }});
canvas.addEventListener('touchmove',e=>{ e.preventDefault();
  if(e.touches.length===1&&dragging){ ox=dragOrigin.x+(e.touches[0].clientX-dragStart.x); oy=dragOrigin.y+(e.touches[0].clientY-dragStart.y); draw(); }
  if(e.touches.length===2){ const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    if(lastTouchDist){ const cx=(e.touches[0].clientX+e.touches[1].clientX)/2,cy=(e.touches[0].clientY+e.touches[1].clientY)/2; zoomAt(d/lastTouchDist,cx,cy); }
    lastTouchDist=d; }
},{passive:false});
canvas.addEventListener('touchend',()=>{ dragging=false; lastTouchDist=null; });

function zoomAt(f,cx,cy){ const prev=scale; scale=Math.max(.3,Math.min(2.5,scale*f)); ox=cx-(cx-ox)*(scale/prev); oy=cy-(cy-oy)*(scale/prev); draw(); }
function zoom(f){ zoomAt(f,W/2,H/2); }
function resetView(){ scale=1; ox=W/2; oy=H/2+20; draw(); }

// Draw
function draw() {
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(ox,oy);
  ctx.scale(scale,scale);

  // grid
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,.025)';
  ctx.lineWidth=1;
  for(let x=-1000;x<1000;x+=60){ ctx.beginPath();ctx.moveTo(x,-1000);ctx.lineTo(x,1000);ctx.stroke(); }
  for(let y=-1000;y<1000;y+=60){ ctx.beginPath();ctx.moveTo(-1000,y);ctx.lineTo(1000,y);ctx.stroke(); }
  ctx.restore();

  // edges
  allEdges.forEach(e=>{
    const a=getNode(e.from),b=getNode(e.to);
    if(!a||!b)return;
    const grd=ctx.createLinearGradient(a.x,a.y,b.x,b.y);
    grd.addColorStop(0,a.stroke+'88');
    grd.addColorStop(1,b.stroke+'44');
    ctx.beginPath();
    const cx=(a.x+b.x)/2, cy=(a.y+b.y)/2-30;
    ctx.moveTo(a.x,a.y);
    ctx.quadraticCurveTo(cx,cy,b.x,b.y);
    ctx.strokeStyle=grd;
    ctx.lineWidth=e.from==='c'?2.5:1.5;
    ctx.setLineDash(e.from==='c'?[]:[4,4]);
    ctx.stroke();
    ctx.setLineDash([]);
  });

  // nodes
  allNodes.forEach(n=>{
    ctx.save();
    ctx.shadowColor=n.stroke;
    ctx.shadowBlur=n.id==='c'?30:16;
    ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
    ctx.fillStyle=n.color;
    ctx.fill();
    ctx.restore();

    ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
    ctx.strokeStyle=n.stroke;
    ctx.lineWidth=n.id==='c'?3:2;
    ctx.stroke();

    ctx.fillStyle=n.textColor;
    ctx.font=`700 ${n.fontSize||11}px Nunito,sans-serif`;
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    const lines=n.label.split('\n');
    const lh=14;
    const startY=n.y-(lines.length-1)*lh/2;
    lines.forEach((l,i)=>ctx.fillText(l,n.x,startY+i*lh));
  });

  ctx.restore();
}

resize();
</script>
</body>
</html>
