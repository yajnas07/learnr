<!DOCTYPE html>
<html lang="en">
<head>

<title>Question Bank — Surface Areas &amp; Volumes</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Mono:wght@400;500&family=Lato:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#040810; --card:#0a1422; --card2:#0f1c30;
    --border:#1a2d45; --text:#cce4ff; --muted:#4a6890;
    --amber:#f59e0b; --teal:#2dd4bf; --blue:#38bdf8;
    --green:#22c55e; --red:#f43f5e; --indigo:#818cf8; --purple:#d946ef;
    --correct:#22c55e; --wrong:#ef4444;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'Lato',sans-serif; min-height:100vh; }
  body::before { content:''; position:fixed; inset:0; pointer-events:none;
    background:radial-gradient(ellipse 60% 40% at 50% 0%, rgba(245,158,11,.04) 0%, transparent 60%); }

  header { text-align:center; padding:1.8rem 1rem 1rem; }
  header h1 { font-family:'Playfair Display',serif; font-size:clamp(1.4rem,4vw,2rem); font-weight:900; color:var(--amber); }
  header p { color:var(--muted); font-family:'DM Mono',monospace; font-size:.72rem; margin-top:.3rem; }

  .dash { display:flex; justify-content:center; gap:.9rem; flex-wrap:wrap; padding:.8rem 1rem 1.2rem; }
  .dcard { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:.6rem 1.2rem; text-align:center; min-width:84px; }
  .dval { font-family:'Playfair Display',serif; font-size:1.5rem; font-weight:900; }
  .dlbl { font-family:'DM Mono',monospace; font-size:.62rem; color:var(--muted); margin-top:.1rem; }

  nav { display:flex; justify-content:center; flex-wrap:wrap; gap:.45rem; padding:0 1rem 1.2rem; }
  nav button { font-family:'Playfair Display',serif; font-weight:700; font-size:.76rem;
    padding:.38rem 1rem; border-radius:3px; border:1px solid var(--border);
    background:var(--card); color:var(--muted); cursor:pointer; transition:all .2s; }
  nav button:hover { color:var(--text); }
  nav button.active { border-color:var(--amber); color:var(--amber); background:rgba(245,158,11,.08); }

  main { max-width:800px; margin:0 auto; padding:0 1rem 4rem; }

  .q-card { background:var(--card); border:1px solid var(--border); border-radius:14px;
    margin-bottom:1rem; overflow:hidden; transition:box-shadow .2s; animation:slideIn .3s ease both; }
  .q-card:hover { box-shadow:0 6px 20px rgba(0,0,0,.5); }
  @keyframes slideIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

  .q-header { display:flex; align-items:flex-start; gap:.7rem; padding:1rem 1.1rem .7rem; }
  .q-num { font-family:'DM Mono',monospace; font-size:.68rem; min-width:28px; height:28px;
    border-radius:6px; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:2px; }
  .q-text { font-family:'Playfair Display',serif; font-size:.92rem; font-weight:700; line-height:1.45; flex:1; }
  .q-meta { display:flex; gap:.35rem; flex-wrap:wrap; padding:0 1.1rem .7rem 4rem; }

  .badge { font-size:.62rem; font-family:'DM Mono',monospace; padding:.12rem .48rem; border-radius:2px; }
  .b-mcq    { background:rgba(56,189,248,.12);  color:var(--blue); }
  .b-short  { background:rgba(34,197,94,.12);   color:var(--green); }
  .b-long   { background:rgba(245,158,11,.12);  color:var(--amber); }
  .b-assert { background:rgba(129,140,248,.12); color:var(--indigo); }
  .b-1m { background:rgba(148,163,184,.08); color:#94a3b8; }
  .b-2m { background:rgba(245,158,11,.1);   color:#fde68a; }
  .b-3m { background:rgba(249,115,22,.1);   color:#fed7aa; }
  .b-5m { background:rgba(239,68,68,.12);   color:#fca5a5; }

  .strip-cub { border-left:4px solid var(--indigo); }
  .strip-cyl { border-left:4px solid var(--teal); }
  .strip-con { border-left:4px solid var(--amber); }
  .strip-sph { border-left:4px solid var(--purple); }
  .strip-cmb { border-left:4px solid var(--blue); }
  .strip-cvt { border-left:4px solid var(--green); }

  .mcq-body { padding:0 1.1rem .6rem; }
  .mcq-opts { display:grid; grid-template-columns:1fr 1fr; gap:.45rem; margin-bottom:.5rem; }
  @media(max-width:480px){ .mcq-opts { grid-template-columns:1fr; } }
  .opt-btn { display:flex; align-items:center; gap:.55rem; background:var(--card2);
    border:1.5px solid var(--border); border-radius:8px; padding:.55rem .75rem;
    cursor:pointer; transition:all .16s; text-align:left; color:var(--text);
    font-family:'Lato',sans-serif; font-size:.82rem; font-weight:600; }
  .opt-btn:hover:not(:disabled) { border-color:#2a4a6a; background:#0f2035; }
  .opt-lbl { font-family:'DM Mono',monospace; font-size:.68rem; color:var(--muted); min-width:18px; }
  .opt-btn.correct { border-color:var(--correct); background:rgba(34,197,94,.1); color:#4ade80; }
  .opt-btn.wrong   { border-color:var(--wrong);   background:rgba(239,68,68,.08); color:#fca5a5; }
  .feedback { font-size:.76rem; font-family:'DM Mono',monospace; padding:.35rem .7rem;
    border-radius:6px; margin:.25rem 0 .5rem; display:none; }
  .feedback.correct { background:rgba(34,197,94,.08);  color:#4ade80; display:block; }
  .feedback.wrong   { background:rgba(239,68,68,.08); color:#f87171; display:block; }

  .ans-reveal { overflow:hidden; max-height:0; transition:max-height .38s ease; }
  .ans-reveal.open { max-height:1200px; }
  .ans-body { padding:.75rem 1.1rem 1rem; border-top:1px solid var(--border); }
  .ans-lbl { font-family:'DM Mono',monospace; font-size:.68rem; color:var(--green); margin-bottom:.4rem; }
  .ans-text { font-size:.84rem; color:var(--text); line-height:1.75; }
  .ans-text strong { color:var(--amber); }
  .ans-text em { color:var(--teal); font-style:normal; }
  .ans-mono { font-family:'DM Mono',monospace; font-size:.8rem; color:var(--teal);
    background:rgba(45,212,191,.06); border:1px solid rgba(45,212,191,.12);
    border-radius:6px; padding:.5rem .75rem; margin:.4rem 0; line-height:1.8; }
  .tip { font-size:.74rem; color:var(--amber); background:rgba(245,158,11,.06);
    border-left:3px solid var(--amber); border-radius:0 6px 6px 0;
    padding:.38rem .65rem; margin-top:.5rem; }

  .show-btn { display:inline-flex; align-items:center; gap:.35rem; font-family:'Playfair Display',serif;
    font-weight:700; font-size:.74rem; padding:.38rem .9rem; border-radius:3px;
    border:1px solid var(--border); background:transparent; color:var(--muted);
    cursor:pointer; transition:all .18s; margin:.15rem 0 .7rem 1.1rem; }
  .show-btn:hover { color:var(--text); border-color:#2a4a6a; }
  .show-btn.active { color:var(--green); border-color:var(--green); background:rgba(34,197,94,.06); }

  .reset-bar { text-align:center; padding:1rem; }
  .reset-btn { font-family:'Playfair Display',serif; font-weight:700; font-size:.82rem;
    padding:.55rem 1.6rem; border-radius:3px; border:1px solid var(--border);
    background:var(--card); color:var(--muted); cursor:pointer; transition:all .2s; }
  .reset-btn:hover { border-color:var(--red); color:var(--red); }

  .site-nav {
    display:flex; align-items:center; justify-content:space-between;
    padding:.42rem 1.2rem; width:100%; align-self:stretch; flex-shrink:0;
    background:rgba(7,16,31,.9); backdrop-filter:blur(14px);
    border-bottom:1px solid rgba(26,45,69,.75);
    position:sticky; top:0; z-index:9999;
  }
  .site-nav-logo { display:flex; align-items:center; text-decoration:none; }
  .site-nav-img  { height:28px; width:auto; display:block; border-radius:4px; }
  .site-nav-back {
    font-family:'DM Mono',monospace; font-size:.68rem;
    color:#7a9ab8; text-decoration:none; transition:all .2s;
    border:1px solid rgba(26,45,69,.9); border-radius:99px;
    padding:.2rem .65rem; white-space:nowrap;
  }
  .site-nav-back:hover { color:#dde6f5; border-color:#2a4060; background:rgba(255,255,255,.04); }
</style>

<div class="dash">
  <div class="dcard"><div class="dval">30</div><div class="dlbl">Total</div></div>
  <div class="dcard"><div class="dval" id="d-att" style="color:var(--amber)">0</div><div class="dlbl">Attempted</div></div>
  <div class="dcard"><div class="dval" id="d-cor" style="color:var(--correct)">0</div><div class="dlbl">Correct</div></div>

</div>

  <button onclick="filter('mcq',this)">MCQ</button>
  <button onclick="filter('short',this)">Short Answer</button>
  <button onclick="filter('long',this)">Long Answer</button>

<script>
const Q = [
  // ── MCQ (10) ──
  {id:1,type:'mcq',topic:'cyl',marks:1,
   q:'The curved surface area of a right circular cylinder of radius 7 cm and height 10 cm is:',
   opts:['220 cm²','440 cm²','880 cm²','140 cm²'],
   ans:1,
   explain:'CSA = 2πrh = 2 × 22/7 × 7 × 10 = 440 cm².'},

  {id:2,type:'mcq',topic:'con',marks:1,
   q:'The slant height of a cone with radius 4 cm and height 3 cm is:',
   opts:['7 cm','5 cm','12 cm','25 cm'],
   ans:1,
   explain:'l = √(r² + h²) = √(16 + 9) = √25 = 5 cm. (3-4-5 Pythagorean triple!)'},

  {id:3,type:'mcq',topic:'sph',marks:1,
   q:'The total surface area of a hemisphere of radius r is:',
   opts:['2πr²','3πr²','4πr²','πr²'],
   ans:1,
   explain:'TSA of hemisphere = CSA + base = 2πr² + πr² = 3πr².'},

  {id:4,type:'mcq',topic:'sph',marks:1,
   q:'The volume of a sphere of diameter 6 cm is:',
   opts:['36π cm³','288π cm³','48π cm³','12π cm³'],
   ans:0,
   explain:'Diameter = 6, so r = 3. V = ⁴⁄₃πr³ = ⁴⁄₃π(27) = 36π cm³.'},

  {id:5,type:'mcq',topic:'con',marks:1,
   q:'The volume of a cone is 1570 cm³ and its base radius is 10 cm. Its height is (use π = 3.14):',
   opts:['10 cm','15 cm','20 cm','25 cm'],
   ans:1,
   explain:'V = ⅓πr²h → 1570 = ⅓ × 3.14 × 100 × h → h = 1570 × 3 / 314 = 15 cm.'},

  {id:6,type:'mcq',topic:'cub',marks:1,
   q:'The total surface area of a cube whose volume is 64 cm³ is:',
   opts:['16 cm²','64 cm²','96 cm²','128 cm²'],
   ans:2,
   explain:'V = a³ = 64 → a = 4 cm. TSA = 6a² = 6 × 16 = 96 cm².'},

  {id:7,type:'mcq',topic:'cvt',marks:1,
   q:'A metallic sphere of radius 3 cm is melted into small spheres of radius 0.3 cm. The number of small spheres is:',
   opts:['10','100','1000','10000'],
   ans:2,
   explain:'n = (R/r)³ = (3/0.3)³ = 10³ = 1000.'},

  {id:8,type:'mcq',topic:'con',marks:1,
   q:'If the radius and height of a cone are both doubled, its volume becomes:',
   opts:['2 times','4 times','8 times','16 times'],
   ans:2,
   explain:'V = ⅓πr²h. New V = ⅓π(2r)²(2h) = ⅓π × 4r² × 2h = 8 × ⅓πr²h = 8V.'},

  {id:9,type:'mcq',topic:'cmb',marks:1,
   q:'A cone is placed on a cylinder of same radius. The total number of faces on the combined solid is:',
   opts:['2','3','4','5'],
   ans:1,
   explain:'The combined solid has: 1 flat circular base (bottom of cylinder) + 1 curved surface (cylinder) + 1 curved surface (cone) = 3 faces. The circular face between them is hidden.'},

  {id:10,type:'mcq',topic:'cyl',marks:1,
   q:'A cylinder and a cone have the same radius and height. The ratio of their volumes is:',
   opts:['1:3','3:1','1:2','2:1'],
   ans:1,
   explain:'V(cyl)/V(cone) = πr²h / (⅓πr²h) = 3/1 = 3:1.'},

  // ── ASSERTION-REASON (4) ──
  {id:11,type:'assert',topic:'con',marks:1,
   q:'Assertion (A): The volume of a cone is ⅓ of the volume of a cylinder with the same base radius and height.\nReason (R): Three cones of the same dimensions exactly fill one cylinder.',
   opts:['Both A and R true; R is the correct explanation of A','Both A and R true; R is NOT the correct explanation','A is true but R is false','A is false but R is true'],
   ans:0,
   explain:'Both A and R are true. R is the experimental fact that directly explains why cone volume = ⅓ cylinder volume.'},

  {id:12,type:'assert',topic:'sph',marks:1,
   q:'Assertion (A): A sphere has no lateral surface area.\nReason (R): A sphere has only one continuous curved surface with no flat face or edge.',
   opts:['Both A and R true; R is the correct explanation of A','Both A and R true; R is NOT the correct explanation','A is true but R is false','A is false but R is true'],
   ans:0,
   explain:'Both true. Since a sphere has no "sides" vs "top/bottom" distinction, there is no separate LSA/CSA concept. R correctly explains A.'},

  {id:13,type:'assert',topic:'cvt',marks:1,
   q:'Assertion (A): When a solid is melted and recast, both volume and surface area remain the same.\nReason (R): Melting and recasting conserves the amount of material.',
   opts:['Both A and R true; R is the correct explanation of A','Both A and R true; R is NOT the correct explanation','A is true but R is false','A is false but R is true'],
   ans:3,
   explain:'A is FALSE — volume is conserved but surface area changes. R is true (material/volume is conserved). Since A is false, answer is (d).'},

  {id:14,type:'assert',topic:'cmb',marks:1,
   q:'Assertion (A): When a hemisphere is placed on top of a cylinder of same radius, TSA = CSA(cyl) + 2πr² + πr².\nReason (R): The flat circular face where they join becomes an internal hidden surface.',
   opts:['Both A and R true; R is the correct explanation of A','Both A and R true; R is NOT the correct explanation','A is true but R is false','A is false but R is true'],
   ans:0,
   explain:'A is true: TSA = 2πrh (CSA cyl) + 2πr² (CSA hemi) + πr² (bottom base) since the joining face is hidden. R correctly explains why we don\'t count that circle twice.'},

  // ── SHORT ANSWER (12) ──
  {id:15,type:'short',topic:'cub',marks:2,
   q:'A cuboidal water tank is 6 m long, 5 m wide and 4.5 m deep. Find the cost of painting its inner surface at ₹20 per m².',
   ans:'The tank is open at the top, so we paint:\nInner surface = 2(bh + hl) + lb\n= 2(5×4.5 + 4.5×6) + 6×5\n= 2(22.5 + 27) + 30\n= 2(49.5) + 30\n= 99 + 30 = 129 m²\n\nCost = 129 × 20 = ₹2580',
   tip:'Open tank → no top face. Inner surface = LSA + base = 2(bh+hl) + lb.'},

  {id:16,type:'short',topic:'cyl',marks:2,
   q:'Find the total surface area of a closed cylindrical petrol storage tank that is 4.2 m in diameter and 4.5 m high.',
   ans:'Diameter = 4.2 m → r = 2.1 m, h = 4.5 m\n\nTSA = 2πr(h + r)\n= 2 × 22/7 × 2.1 × (4.5 + 2.1)\n= 2 × 22/7 × 2.1 × 6.6\n= 2 × 22 × 0.3 × 6.6\n= 87.12 m²',
   tip:'Read carefully: "diameter" not radius! Always halve the diameter first.'},

  {id:17,type:'short',topic:'con',marks:3,
   q:'A conical tent is 10 m high and the radius of its base is 24 m. Find (i) slant height, (ii) cost of canvas at ₹70 per m².',
   ans:'r = 24 m, h = 10 m\n\n(i) l = √(r² + h²) = √(576 + 100) = √676 = 26 m\n\n(ii) Canvas area = CSA = πrl\n= 22/7 × 24 × 26\n= 22/7 × 624\n= 13728/7\n= 1961.14 m²\n\nCost = 1961.14 × 70 = ₹1,37,280 (approx)',
   tip:'Canvas covers only the CSA (no base — the tent sits on the ground).'},

  {id:18,type:'short',topic:'sph',marks:2,
   q:'Find the surface area of a sphere whose volume is 4851 cm³. (Use π = 22/7)',
   ans:'V = ⁴⁄₃πr³ = 4851\n⁴⁄₃ × 22/7 × r³ = 4851\n88r³/21 = 4851\nr³ = 4851 × 21/88 = 1157.625\nr³ = 1157.625 → r = 10.5 cm\n\nSA = 4πr² = 4 × 22/7 × (10.5)²\n= 4 × 22/7 × 110.25\n= 1386 cm²',
   tip:'Find r from volume first, then use it in SA formula. Shortcut: 10.5 = 21/2.'},

  {id:19,type:'short',topic:'sph',marks:3,
   q:'A hemispherical bowl of internal radius 9 cm is full of liquid. The liquid is filled into cylindrical bottles of diameter 6 cm and height 6 cm. How many bottles are needed?',
   ans:'V(hemisphere) = ⅔πr³ = ⅔π(9)³ = ⅔π(729) = 486π cm³\n\nV(bottle) = πr²h = π(3)²(6) = 54π cm³\n\nNumber of bottles = 486π / 54π = 9\n\n9 bottles are needed.',
   tip:'Volume is conserved when liquid is poured. Bottle diameter = 6 → radius = 3.'},

  {id:20,type:'short',topic:'cmb',marks:3,
   q:'A solid is in the shape of a cone mounted on a hemisphere. The radius of each is 1 cm and the height of the cone is 1 cm. Find the volume of the solid.',
   ans:'r = 1 cm, h(cone) = 1 cm\n\nV(cone) = ⅓πr²h = ⅓ × π × 1 × 1 = π/3 cm³\n\nV(hemisphere) = ⅔πr³ = ⅔ × π × 1 = 2π/3 cm³\n\nTotal V = π/3 + 2π/3 = 3π/3 = π cm³\n\nV = π ≈ 3.14 cm³',
   tip:'For combined solids, add the individual volumes. The shared circular face is internal but doesn\'t affect volume.'},

  {id:21,type:'short',topic:'cvt',marks:3,
   q:'A metallic sphere of radius 4.2 cm is melted and recast into the shape of a cylinder of radius 6 cm. Find the height of the cylinder.',
   ans:'V(sphere) = V(cylinder)\n⁴⁄₃πR³ = πr²h\n⁴⁄₃ × (4.2)³ = (6)² × h\n⁴⁄₃ × 74.088 = 36h\n98.784 = 36h\nh = 98.784/36\nh = 2.744 cm',
   tip:'Melting → volume conserved. Cancel π from both sides first to simplify.'},

  {id:22,type:'short',topic:'cvt',marks:3,
   q:'How many silver coins, 1.75 cm in diameter and 2 mm thick, must be melted to form a cuboid of dimensions 5.5 cm × 10 cm × 3.5 cm?',
   ans:'Coin: r = 0.875 cm, h = 0.2 cm (convert mm to cm)\nV(coin) = πr²h = 22/7 × (0.875)² × 0.2\n= 22/7 × 0.765625 × 0.2\n= 22/7 × 0.153125\n= 0.48125 cm³\n\nV(cuboid) = 5.5 × 10 × 3.5 = 192.5 cm³\n\nn = 192.5/0.48125 = 400\n\n400 coins are needed.',
   tip:'Convert all units to cm first! 2 mm = 0.2 cm. Coin is a small cylinder.'},

  {id:23,type:'short',topic:'con',marks:3,
   q:'A bucket is in the shape of a frustum of a cone with top radius 28 cm, bottom radius 21 cm, and height 45 cm. Find its capacity in litres.',
   ans:'r₁ = 21, r₂ = 28, h = 45\n\nV = ⅓πh(r₁² + r₂² + r₁r₂)\n= ⅓ × 22/7 × 45 × (441 + 784 + 588)\n= ⅓ × 22/7 × 45 × 1813\n= 22/7 × 15 × 1813\n= 22 × 15 × 259\n= 85470 cm³\n\nCapacity = 85470/1000 = 85.47 litres (approx)',
   tip:'Bucket = frustum. Use frustum volume formula. 1 litre = 1000 cm³.'},

  {id:24,type:'short',topic:'cub',marks:2,
   q:'Three cubes each of side 5 cm are joined end to end. Find the surface area of the resulting cuboid.',
   ans:'Resulting cuboid: l = 5+5+5 = 15 cm, b = 5 cm, h = 5 cm\n\nTSA = 2(lb + bh + hl)\n= 2(15×5 + 5×5 + 5×15)\n= 2(75 + 25 + 75)\n= 2 × 175 = 350 cm²',
   tip:'When cubes join end to end, internal faces vanish. But it\'s easier to just compute TSA of the resulting cuboid directly.'},

  {id:25,type:'short',topic:'cmb',marks:3,
   q:'A gulab jamun contains sugar syrup up to about 30% of its volume. Find approximately how much syrup would be found in 45 gulab jamuns, each shaped like a cylinder with hemispherical ends, with length 5 cm and diameter 2.8 cm.',
   ans:'r = 1.4 cm, cylindrical length = 5 − 2(1.4) = 2.2 cm\n\nV(one) = V(cylinder) + V(sphere)\n= πr²h + ⁴⁄₃πr³\n= 22/7 × (1.4)² × 2.2 + ⁴⁄₃ × 22/7 × (1.4)³\n= 22/7 × 1.96 × 2.2 + ⁴⁄₃ × 22/7 × 2.744\n= 13.552 + 11.498\n= 25.05 cm³\n\nSyrup in 45 = 45 × 25.05 × 0.30\n= 338.18 cm³ ≈ 338 cm³',
   tip:'Gulab jamun = cylinder + 2 hemispheres = cylinder + sphere. Cylindrical part height = total length − 2r.'},

  {id:26,type:'short',topic:'sph',marks:2,
   q:'The radius of a spherical balloon increases from 7 cm to 14 cm as air is pumped. Find the ratio of their surface areas.',
   ans:'SA₁ = 4π(7)² = 196π\nSA₂ = 4π(14)² = 784π\n\nRatio = SA₁/SA₂ = 196π/784π = 1/4\n\nRatio = 1 : 4',
   tip:'SA ∝ r². When radius doubles, SA becomes 4 times. Ratio = (r₁/r₂)² = (7/14)² = 1/4.'},

  // ── LONG ANSWER (4) ──
  {id:27,type:'long',topic:'cmb',marks:5,
   q:'A wooden article was made by scooping out a hemisphere from each end of a solid cylinder. If the height of the cylinder is 10 cm and its base radius is 3.5 cm, find the total surface area of the article.',

const state={};
let currentFilter='all';

const topicStrip={cub:'strip-cub',cyl:'strip-cyl',con:'strip-con',sph:'strip-sph',cmb:'strip-cmb',cvt:'strip-cvt'};
const topicBg={cub:'rgba(129,140,248,.1)',cyl:'rgba(45,212,191,.1)',con:'rgba(245,158,11,.1)',sph:'rgba(217,70,239,.1)',cmb:'rgba(56,189,248,.1)',cvt:'rgba(34,197,94,.1)'};
const topicCol={cub:'#818cf8',cyl:'#2dd4bf',con:'#f59e0b',sph:'#d946ef',cmb:'#38bdf8',cvt:'#22c55e'};
const typeBadge={mcq:'b-mcq MCQ',short:'b-short Short Answer',long:'b-long Long Answer',assert:'b-assert Assertion–Reason'};
const markBadge=m=>{const c={1:'b-1m',2:'b-2m',3:'b-3m',5:'b-5m'}[m]||'b-1m';return`<span class="badge ${c}">${m} mark${m>1?'s':''}</span>`};

function getVisible(){return currentFilter==='all'?Q:Q.filter(q=>q.type===currentFilter)}

function filter(type,btn){
  currentFilter=type;
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function renderMCQ(q){
  const s=state[q.id]||{};const done=s.chosen!==undefined;
  return`<div class="mcq-body">
    <div class="mcq-opts">
      ${q.opts.map((o,i)=>{
        let cls='';
        if(done){if(i===q.ans)cls='correct';else if(i===s.chosen&&i!==q.ans)cls='wrong';}
        return`<button class="opt-btn ${cls}" onclick="chooseMCQ(${q.id},${i})" ${done?'disabled':''}>
          <span class="opt-lbl">${String.fromCharCode(65+i)}</span>${o}</button>`;
      }).join('')}
    </div>
    ${done?`<div class="feedback ${s.chosen===q.ans?'correct':'wrong'}">
      ${s.chosen===q.ans?'✓ Correct!':'✗ Incorrect — correct answer: '+String.fromCharCode(65+q.ans)}</div>
      <div class="ans-body" style="border-top:1px solid var(--border);padding:.6rem 0 .3rem">
        <div class="ans-lbl">💡 Explanation</div>
        <div class="ans-text">${q.explain}</div>
      </div>`:''}
  </div>`;
}

function renderShortLong(q){
  const s=state[q.id]||{};const open=s.open;
  return`<button class="show-btn ${open?'active':''}" onclick="toggleAns(${q.id})">
    ${open?'▲ Hide Answer':'▼ Show Model Answer'}
  </button>
  <div class="ans-reveal ${open?'open':''}">
    <div class="ans-body">
      <div class="ans-lbl">✅ Model Answer</div>
      <div class="ans-mono">${(q.ans||'').replace(/\n/g,'<br>')}</div>
      ${q.tip?`<div class="tip">🎯 Exam tip: ${q.tip}</div>`:''}
    </div>
  </div>`;
}

function render(){
  const list=getVisible();const el=document.getElementById('qlist');
  el.innerHTML=list.map((q,i)=>{
    const tb=typeBadge[q.type].split(' ');
    return`<div class="q-card ${topicStrip[q.topic]||''}" id="qcard-${q.id}">
      <div class="q-header">
        <div class="q-num" style="background:${topicBg[q.topic]};color:${topicCol[q.topic]}">${i+1}</div>
        <div class="q-text">${q.q.replace(/\n/g,'<br>')}</div>
      </div>
      <div class="q-meta">
        <span class="badge ${tb[0]}">${tb.slice(1).join(' ')}</span>
        ${markBadge(q.marks)}
      </div>
      ${q.type==='mcq'||q.type==='assert'?renderMCQ(q):renderShortLong(q)}
    </div>`;
  }).join('');
}

function chooseMCQ(id,idx){
  const q=Q.find(x=>x.id===id);if(!q||state[id]?.chosen!==undefined)return;
  if(!state[id])state[id]={};
  state[id].chosen=idx;
  updateDash();
  const visible=getVisible(),i=visible.findIndex(x=>x.id===id);
  const tb=typeBadge[q.type].split(' ');
  const newHtml=`<div class="q-card ${topicStrip[q.topic]||''}" id="qcard-${id}">
    <div class="q-header">
      <div class="q-num" style="background:${topicBg[q.topic]};color:${topicCol[q.topic]}">${i+1}</div>
      <div class="q-text">${q.q.replace(/\n/g,'<br>')}</div>
    </div>
    <div class="q-meta"><span class="badge ${tb[0]}">${tb.slice(1).join(' ')}</span>${markBadge(q.marks)}</div>
    ${renderMCQ(q)}
  </div>`;
  const el=document.getElementById('qcard-'+id);
  const tmp=document.createElement('div');tmp.innerHTML=newHtml;
  el.replaceWith(tmp.firstElementChild);
}

function toggleAns(id){
  if(!state[id])state[id]={};
  state[id].open=!state[id].open;
  if(!state[id].viewed){state[id].viewed=true;updateDash();}
  const btn=document.querySelector(`#qcard-${id} .show-btn`);
  const rev=document.querySelector(`#qcard-${id} .ans-reveal`);
  if(btn&&rev){
    const open=state[id].open;
    btn.classList.toggle('active',open);
    btn.textContent=open?'▲ Hide Answer':'▼ Show Model Answer';
    rev.classList.toggle('open',open);
  }
}

function updateDash(){
  const att=Object.keys(state).length;
  const cor=Q.filter(q=>state[q.id]?.chosen===q.ans).length;
  const mcqTotal=Q.filter(q=>q.type==='mcq'||q.type==='assert').length;
  document.getElementById('d-att').textContent=att;
  document.getElementById('d-cor').textContent=cor;
  document.getElementById('d-sc').textContent=mcqTotal>0?Math.round((cor/mcqTotal)*100)+'%':'—';
}

function resetAll(){for(const k in state)delete state[k];updateDash();render();}
render();
</script>
