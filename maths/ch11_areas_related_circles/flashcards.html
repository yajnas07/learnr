<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards — Areas Related to Circles</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Mono:wght@400;500&family=Lato:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#040810;--card:#0a1422;--card2:#0f1c30;--border:#1a2d45;--text:#cce4ff;--muted:#4a6890;
  --amber:#f59e0b;--teal:#2dd4bf;--blue:#38bdf8;--green:#22c55e;--red:#f43f5e;--indigo:#818cf8;--purple:#d946ef;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Lato',sans-serif;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(245,158,11,.06) 0%,transparent 60%);}

.site-nav{display:flex;align-items:center;justify-content:space-between;padding:.42rem 1.2rem;
  background:rgba(4,8,16,.9);backdrop-filter:blur(14px);border-bottom:1px solid rgba(26,45,69,.75);position:sticky;top:0;z-index:9999;}
.site-nav-logo{display:flex;align-items:center;text-decoration:none;}
.site-nav-img{height:28px;}
.site-nav-back{font-family:'DM Mono',monospace;font-size:.68rem;color:#7a9ab8;text-decoration:none;border:1px solid rgba(26,45,69,.9);border-radius:99px;padding:.2rem .65rem;}
.site-nav-back:hover{color:#dde6f5;}

header{text-align:center;padding:1.4rem 1rem .4rem;}
header h1{font-family:'Playfair Display',serif;font-size:clamp(1.3rem,4vw,2rem);font-weight:900;color:var(--amber);}
header p{color:var(--muted);font-family:'DM Mono',monospace;font-size:.72rem;margin-top:.3rem;}

.filters{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;padding:.8rem 1rem;max-width:800px;margin:0 auto;}
.filt{font-family:'DM Mono',monospace;font-size:.68rem;padding:.3rem .7rem;border-radius:99px;border:1px solid var(--border);
  background:var(--card);color:var(--muted);cursor:pointer;transition:.15s;}
.filt:hover{color:var(--text);}
.filt.active{background:var(--amber);color:#04121e;border-color:var(--amber);font-weight:700;}

.progress{text-align:center;font-family:'DM Mono',monospace;font-size:.7rem;color:var(--muted);margin:.3rem 0;}

.stage{max-width:560px;margin:0 auto;padding:1rem 1.2rem 2rem;}
.card{perspective:1600px;height:340px;cursor:pointer;}
.card-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;}
.card.flipped .card-inner{transform:rotateY(180deg);}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;border:1px solid var(--border);
  background:var(--card);padding:1.6rem;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
.face-back{transform:rotateY(180deg);background:var(--card2);}
.cat-tag{position:absolute;top:1rem;left:1rem;font-family:'DM Mono',monospace;font-size:.62rem;padding:.2rem .55rem;border-radius:99px;}
.face .side{position:absolute;top:1rem;right:1rem;font-family:'DM Mono',monospace;font-size:.6rem;color:var(--muted);}
.q-text{font-family:'Playfair Display',serif;font-size:1.15rem;font-weight:700;line-height:1.45;}
.a-text{font-size:.95rem;line-height:1.6;color:var(--text);}
.hint{margin-top:1rem;font-family:'DM Mono',monospace;font-size:.66rem;color:var(--muted);font-style:italic;}
.flip-hint{position:absolute;bottom:1rem;font-family:'DM Mono',monospace;font-size:.6rem;color:var(--muted);}

.controls{display:flex;align-items:center;justify-content:center;gap:.6rem;margin-top:1.2rem;}
.btn{font-family:'DM Mono',monospace;font-size:.72rem;padding:.5rem .9rem;border-radius:8px;border:1px solid var(--border);
  background:var(--card);color:var(--text);cursor:pointer;transition:.15s;}
.btn:hover{border-color:var(--amber);color:var(--amber);}
.btn-known{border-color:rgba(34,197,94,.4);color:var(--green);}
.btn-review{border-color:rgba(245,158,11,.4);color:var(--amber);}
.mark-row{display:flex;justify-content:center;gap:.6rem;margin-top:.7rem;}
.counter{font-family:'DM Mono',monospace;font-size:.8rem;color:var(--muted);min-width:64px;text-align:center;}
.util-row{display:flex;justify-content:center;gap:.6rem;margin-top:1rem;}
</style>
</head>
<body>
<nav class="site-nav">
  <a href="../../index.html" class="site-nav-logo"><img src="../../logos/learnr-colored-dark.svg" alt="learnr" class="site-nav-img"></a>
  <a href="../../index.html" class="site-nav-back">&#8592; Back to Portal</a>
</nav>
<header>
  <h1>Areas Related to Circles</h1>
  <p>Class X · Mathematics Ch.11 · 36 Flashcards · 6 Categories</p>
</header>

<div class="filters" id="filters"></div>
<div class="progress" id="progress"></div>

<div class="stage">
  <div class="card" id="card" onclick="flip()">
    <div class="card-inner">
      <div class="face face-front">
        <span class="cat-tag" id="catFront"></span>
        <span class="side" id="sideFront"></span>
        <div class="q-text" id="qText"></div>
        <div class="hint" id="hintText"></div>
        <div class="flip-hint">click / space to flip →</div>
      </div>
      <div class="face face-back">
        <span class="cat-tag" id="catBack"></span>
        <span class="side">answer</span>
        <div class="a-text" id="aText"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" onclick="nav(-1)">← Prev</button>
    <span class="counter" id="counter"></span>
    <button class="btn" onclick="nav(1)">Next →</button>
  </div>
  <div class="mark-row">
    <button class="btn btn-known" onclick="markKnown()">✓ Known</button>
    <button class="btn btn-review" onclick="markReview()">↻ Review</button>
  </div>
  <div class="util-row">
    <button class="btn" onclick="shuffle()">🔀 Shuffle</button>
    <button class="btn" onclick="resetAll()">♻ Reset</button>
  </div>
</div>

<script>
const catColors={bas:'#f59e0b',circ:'#2dd4bf',area:'#d946ef',sec:'#22c55e',seg:'#818cf8',comb:'#f43f5e'};
const catNames={bas:'Basics',circ:'Circumference',area:'Area',sec:'Sector',seg:'Segment',comb:'Combinations'};

const ALL_CARDS=[
// BASICS
{cat:'bas',q:'What is the relation between diameter and radius?',a:'Diameter d = 2r (twice the radius). The diameter is the longest chord.',hint:'d = 2r'},
{cat:'bas',q:'What does π represent?',a:'π is the ratio of a circle\u2019s circumference to its diameter, ≈ 22/7 ≈ 3.14159. It is irrational.',hint:'C ÷ d'},
{cat:'bas',q:'When should you use π = 22/7 vs 3.14?',a:'Use 22/7 when the radius is a multiple of 7 (cancels nicely); otherwise use 3.14.',hint:'multiple of 7'},
{cat:'bas',q:'What are concentric circles?',a:'Circles with the same centre but different radii. The region between them is a ring (annulus).',hint:'same centre'},
{cat:'bas',q:'If diameter = 14 cm, what is the radius?',a:'r = d/2 = 7 cm. Always halve the diameter before using area/circumference formulas.',hint:'halve it'},
{cat:'bas',q:'What is a chord and the longest chord?',a:'A chord joins two points on the circle; the longest chord is the diameter passing through the centre.',hint:'diameter longest'},
// CIRCUMFERENCE
{cat:'circ',q:'State the circumference formula.',a:'C = 2πr = πd — the total length of the boundary of the circle.',hint:'2πr'},
{cat:'circ',q:'What is the length of an arc subtending angle θ at the centre?',a:'ℓ = (θ/360) × 2πr — a fraction of the full circumference.',hint:'(θ/360)·2πr'},
{cat:'circ',q:'Give the perimeter of a semicircle of radius r.',a:'P = πr + 2r = r(π + 2). It is half the circumference PLUS the diameter.',hint:'πr + 2r'},
{cat:'circ',q:'How do you find the number of rotations of a wheel over a distance?',a:'Number of rotations = total distance ÷ circumference = distance ÷ (2πr).',hint:'distance ÷ 2πr'},
{cat:'circ',q:'A wheel of radius 35 cm makes 1 rotation. How far does it travel?',a:'Distance = circumference = 2 × (22/7) × 35 = 220 cm.',hint:'one circumference'},
{cat:'circ',q:'Perimeter of a quadrant of radius r?',a:'P = (arc) + 2r = (πr/2) + 2r. Quadrant arc is a quarter of the circumference.',hint:'πr/2 + 2r'},
// AREA
{cat:'area',q:'State the area of a circle.',a:'A = πr². If the diameter is given, use r = d/2 first.',hint:'πr²'},
{cat:'area',q:'What is the area of a semicircle?',a:'½πr² — half the area of the full circle.',hint:'half of πr²'},
{cat:'area',q:'What is the area of a quadrant?',a:'¼πr² — one-fourth of the circle (a 90° sector).',hint:'quarter circle'},
{cat:'area',q:'Give the area of a circular ring (annulus).',a:'A = π(R² − r²) = π(R+r)(R−r), where R is the outer and r the inner radius.',hint:'π(R²−r²)'},
{cat:'area',q:'The area of a circle is 154 cm². Find r (π=22/7).',a:'πr² = 154 → r² = 154×7/22 = 49 → r = 7 cm.',hint:'reverse πr²'},
{cat:'area',q:'A common exam error when the diameter is given?',a:'Forgetting to halve it. You must use r = d/2 BEFORE squaring in πr².',hint:'halve first'},
// SECTOR
{cat:'sec',q:'State the area of a sector of angle θ.',a:'Area = (θ/360) × πr² — a fraction of the circle\u2019s area.',hint:'(θ/360)·πr²'},
{cat:'sec',q:'Give the alternative sector-area formula using arc length.',a:'Area = ½ × ℓ × r, where ℓ is the arc length.',hint:'½·ℓ·r'},
{cat:'sec',q:'What is the perimeter of a sector?',a:'Perimeter = arc length + 2r (the arc plus the two bounding radii).',hint:'arc + 2r'},
{cat:'sec',q:'What is a minor and a major sector?',a:'The smaller region is the minor sector; the larger is the major sector. Major = πr² − minor.',hint:'small vs large'},
{cat:'sec',q:'Area of a sector with θ = 90°, r = 14 (π=22/7)?',a:'(90/360)×(22/7)×14² = ¼×616 = 154 cm².',hint:'quarter circle'},
{cat:'sec',q:'A sector is what fraction of the circle when θ = 60°?',a:'60/360 = 1/6 of the circle.',hint:'θ/360'},
// SEGMENT
{cat:'seg',q:'What is a segment of a circle?',a:'The region enclosed between a chord and its corresponding arc.',hint:'chord + arc region'},
{cat:'seg',q:'How do you find the area of a minor segment?',a:'Area of minor segment = area of sector − area of triangle = (θ/360)πr² − ½r²sinθ.',hint:'sector − triangle'},
{cat:'seg',q:'What is the area of the triangle formed by two radii and a chord?',a:'½ r² sinθ, where θ is the angle between the radii at the centre.',hint:'½r²sinθ'},
{cat:'seg',q:'Triangle area in a sector when θ = 90°?',a:'½r² (since sin90° = 1). The two radii are perpendicular.',hint:'½r²'},
{cat:'seg',q:'Triangle area when θ = 60°?',a:'½r²·sin60° = ½r²·(√3/2) = (√3/4)r². The triangle is equilateral.',hint:'equilateral'},
{cat:'seg',q:'How do you find the major segment area?',a:'Major segment = πr² − minor segment area.',hint:'circle − minor'},
// COMBINATIONS
{cat:'comb',q:'What is the general strategy for a shaded-region problem?',a:'Break it into standard shapes, then ADD the parts that build it and SUBTRACT the parts cut out.',hint:'add & subtract'},
{cat:'comb',q:'A circle is inscribed in a square of side a. What is its radius?',a:'r = a/2 (the circle touches all four sides). Corner area = a² − π(a/2)².',hint:'r = a/2'},
{cat:'comb',q:'A square is inscribed in a circle of radius r. What is its diagonal?',a:'Diagonal = diameter = 2r. So side = 2r/√2 = r√2.',hint:'diagonal = 2r'},
{cat:'comb',q:'How do you find the area of a shaded ring inside a design?',a:'Subtract the inner circle area from the outer circle area: π(R² − r²).',hint:'annulus'},
{cat:'comb',q:'Three equal circles touch each other. How to find the enclosed area?',a:'Area = area of the equilateral triangle joining centres − 3 sectors of 60° inside it.',hint:'triangle − sectors'},
{cat:'comb',q:'For overlapping figures, what keeps answers correct?',a:'Careful bookkeeping of which areas add and which subtract, and consistent units (cm²).',hint:'track + / −'},
];

let cards=[...ALL_CARDS];
let idx=0, filter='all';
const known=new Set(), review=new Set();

function buildFilters(){
  const f=document.getElementById('filters');
  const cats=['all',...Object.keys(catNames)];
  f.innerHTML=cats.map(c=>{
    const label=c==='all'?'All':catNames[c];
    return `<button class="filt${c===filter?' active':''}" onclick="setFilter('${c}')">${label}</button>`;
  }).join('');
}
function setFilter(c){
  filter=c;
  cards = c==='all' ? [...ALL_CARDS] : ALL_CARDS.filter(x=>x.cat===c);
  idx=0; buildFilters(); render();
}
function render(){
  if(!cards.length)return;
  const card=cards[idx];
  document.getElementById('card').classList.remove('flipped');
  const col=catColors[card.cat];
  document.getElementById('catFront').outerHTML=`<span class="cat-tag" id="catFront" style="background:${col}22;color:${col}">${catNames[card.cat]}</span>`;
  document.getElementById('catBack').outerHTML=`<span class="cat-tag" id="catBack" style="background:${col}22;color:${col}">${catNames[card.cat]}</span>`;
  document.getElementById('qText').textContent=card.q;
  document.getElementById('aText').textContent=card.a;
  document.getElementById('hintText').textContent='💡 '+card.hint;
  document.getElementById('sideFront').textContent='question';
  document.getElementById('counter').textContent=`${idx+1} / ${cards.length}`;
  updateProgress();
}
function updateProgress(){
  document.getElementById('progress').textContent=
    `Known: ${known.size}  ·  To review: ${review.size}  ·  Total: ${ALL_CARDS.length}`;
}
function flip(){document.getElementById('card').classList.toggle('flipped');}
function nav(d){idx=(idx+d+cards.length)%cards.length;render();}
function markKnown(){const c=cards[idx];known.add(c.q);review.delete(c.q);updateProgress();nav(1);}
function markReview(){const c=cards[idx];review.add(c.q);known.delete(c.q);updateProgress();nav(1);}
function shuffle(){for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]];}idx=0;render();}
function resetAll(){known.clear();review.clear();setFilter('all');}
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();flip();}
  else if(e.code==='ArrowRight')nav(1);
  else if(e.code==='ArrowLeft')nav(-1);
});
buildFilters();render();
</script>
</body>
</html>
