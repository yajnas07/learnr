<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards — Some Applications of Trigonometry</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Mono:wght@400;500&family=Lato:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#040810;--card:#0a1422;--card2:#0f1c30;--border:#1a2d45;--text:#cce4ff;--muted:#4a6890;--amber:#f59e0b;--teal:#2dd4bf;--blue:#38bdf8;--green:#22c55e;--red:#f43f5e;--indigo:#818cf8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Lato',sans-serif;min-height:100vh}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 60% 40% at 50% 0%,rgba(245,158,11,.04) 0%,transparent 60%)}

header{text-align:center;padding:1.8rem 1rem 1rem}
header h1{font-family:'Playfair Display',serif;font-size:clamp(1.4rem,4vw,2rem);font-weight:900;color:var(--amber)}
header p{color:var(--muted);font-family:'DM Mono',monospace;font-size:.72rem;margin-top:.3rem}

.filters{display:flex;justify-content:center;flex-wrap:wrap;gap:.4rem;padding:.5rem 1rem 1.2rem}
.filters button{font-family:'Playfair Display',serif;font-weight:700;font-size:.74rem;padding:.35rem .9rem;border-radius:3px;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;transition:all .2s}
.filters button:hover{color:var(--text)}
.filters button.active{border-color:var(--amber);color:var(--amber);background:rgba(245,158,11,.08)}

.progress{display:flex;justify-content:center;align-items:center;gap:1.2rem;padding:0 1rem .8rem;font-family:'DM Mono',monospace;font-size:.72rem;color:var(--muted)}
.progress .count{color:var(--amber);font-weight:700}
.progress .known{color:var(--green)}
.prog-bar{width:140px;height:5px;background:var(--card);border-radius:9px;overflow:hidden}
.prog-fill{height:100%;background:var(--amber);border-radius:9px;transition:width .3s}

.deck{display:flex;justify-content:center;align-items:center;padding:1rem;min-height:380px;perspective:1200px}
.flip-card{width:100%;max-width:520px;height:320px;cursor:pointer;position:relative;transform-style:preserve-3d;transition:transform .5s}
.flip-card.flipped{transform:rotateY(180deg)}
.flip-card .front,.flip-card .back{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:2rem;text-align:center;border:1px solid var(--border)}
.flip-card .front{background:var(--card)}
.flip-card .back{background:var(--card2);transform:rotateY(180deg)}
.flip-card .front h2{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:900;line-height:1.55;color:var(--text)}
.flip-card .back p{font-size:.92rem;line-height:1.75;color:var(--text)}
.flip-card .back p strong{color:var(--amber)}
.flip-card .back p em{color:var(--teal);font-style:normal}
.cat-badge{font-family:'DM Mono',monospace;font-size:.62rem;padding:.15rem .55rem;border-radius:3px;margin-bottom:.8rem}
.hint{font-family:'DM Mono',monospace;font-size:.68rem;color:var(--muted);margin-top:1rem}

.controls{display:flex;justify-content:center;gap:.6rem;padding:.8rem 1rem;flex-wrap:wrap}
.ctrl{font-family:'Playfair Display',serif;font-weight:700;font-size:.76rem;padding:.4rem 1.1rem;border-radius:3px;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;transition:all .2s}
.ctrl:hover{color:var(--text);border-color:#2a4a6a}
.ctrl.know{border-color:var(--green);color:var(--green);background:rgba(34,197,94,.06)}
.ctrl.know:hover{background:rgba(34,197,94,.12)}

.keys{text-align:center;padding:.5rem;font-family:'DM Mono',monospace;font-size:.62rem;color:var(--muted)}

.site-nav{display:flex;align-items:center;justify-content:space-between;padding:.42rem 1.2rem;width:100%;background:rgba(7,16,31,.9);backdrop-filter:blur(14px);border-bottom:1px solid rgba(26,45,69,.75);position:sticky;top:0;z-index:9999}
.site-nav-logo{display:flex;align-items:center;text-decoration:none}
.site-nav-img{height:28px;width:auto;display:block;border-radius:4px}
.site-nav-back{font-family:'DM Mono',monospace;font-size:.68rem;color:#7a9ab8;text-decoration:none;transition:all .2s;border:1px solid rgba(26,45,69,.9);border-radius:99px;padding:.2rem .65rem;white-space:nowrap}
.site-nav-back:hover{color:#dde6f5;border-color:#2a4060;background:rgba(255,255,255,.04)}
</style>
</head>
<body>
<nav class="site-nav"><a href="../../index.html" class="site-nav-logo"><img src="../../logos/learnr-colored-dark.svg" alt="learnr" class="site-nav-img"></a><a href="../../index.html" class="site-nav-back">&#8592; Back to Portal</a></nav>

<header>
  <h1>Flashcards</h1>
  <p>Some Applications of Trigonometry · Ch.9 · 40 Cards</p>
</header>

<div class="filters" id="filters"></div>
<div class="progress"><span class="count" id="pos">1 / 40</span><div class="prog-bar"><div class="prog-fill" id="prog"></div></div><span class="known" id="knownCount">0 known</span></div>
<div class="deck" id="deck"></div>
<div class="controls">
  <button class="ctrl" onclick="prev()">← Prev</button>
  <button class="ctrl" onclick="flipCard()">⟳ Flip</button>
  <button class="ctrl know" onclick="markKnown()">✓ Know it</button>
  <button class="ctrl" onclick="next()">Next →</button>
  <button class="ctrl" onclick="shuffle()">⤮ Shuffle</button>
  <button class="ctrl" onclick="resetAll()">↺ Reset</button>
</div>
<div class="keys">Keyboard: ← → (navigate) · Space (flip) · K (know it) · S (shuffle)</div>

<script>
const CARDS=[
// ── los: Line of Sight (8) ──
{cat:'los',q:'What is the "line of sight"?',a:'The straight line drawn from the <strong>eye of the observer</strong> to the point being viewed on the object.'},
{cat:'los',q:'Define the angle of elevation.',a:'The angle between the <strong>horizontal</strong> and the line of sight when looking <strong>upward</strong> at an object above the horizontal level.'},
{cat:'los',q:'Define the angle of depression.',a:'The angle between the <strong>horizontal</strong> and the line of sight when looking <strong>downward</strong> at an object below the horizontal level.'},
{cat:'los',q:'How are the angle of elevation and the angle of depression related?',a:'They are <strong>equal</strong> (alternate interior angles). Angle of depression from A to B = Angle of elevation from B to A.'},
{cat:'los',q:'From where is the angle of elevation always measured?',a:'From the <strong>horizontal line at the observer\'s eye level</strong>, not from the ground or the vertical.'},
{cat:'los',q:'What instrument is used by surveyors to measure angles?',a:'A <strong>theodolite</strong> — it measures both horizontal and vertical angles with high precision.'},
{cat:'los',q:'In a height/distance problem, which line forms the hypotenuse?',a:'The <strong>line of sight</strong> from the observer\'s eye to the object forms the hypotenuse of the right triangle.'},
{cat:'los',q:'What is the horizontal line in a heights and distances diagram?',a:'A line <strong>parallel to the ground</strong> drawn at the observer\'s eye level. It is the reference from which angles are measured.'},

// ── hgt: Finding Heights (8) ──
{cat:'hgt',q:'Formula: Height of a tower given distance d and angle of elevation θ?',a:'<strong>h = d × tan θ</strong><br>Height = horizontal distance × tangent of the angle of elevation.'},
{cat:'hgt',q:'A tower\'s angle of elevation from 20 m away is 60°. Find the height.',a:'h = 20 × tan 60° = 20 × √3 = <strong>20√3 ≈ 34.64 m</strong>'},
{cat:'hgt',q:'If angle of elevation = 45°, what can you say about height and distance?',a:'<strong>Height = Distance</strong><br>Since tan 45° = 1, we get h = d × 1 = d.'},
{cat:'hgt',q:'When must you add the observer\'s height to the answer?',a:'When the problem asks for the <strong>total height of the object from the ground</strong> and the observer is measuring from eye level (not ground level).'},
{cat:'hgt',q:'A statue stands on a pedestal. Angles to the top of pedestal and statue are α and β. How to find statue height?',a:'Let pedestal = p, statue = s, distance = d.<br>tan α = p/d, tan β = (p+s)/d<br><strong>s = d(tan β − tan α)</strong>'},
{cat:'hgt',q:'A 6 m pole casts a 2√3 m shadow. What is the sun\'s elevation?',a:'tan θ = 6/(2√3) = 3/√3 = √3<br><strong>θ = 60°</strong>'},
{cat:'hgt',q:'If the angle of elevation of the sun decreases, what happens to the shadow?',a:'The shadow becomes <strong>longer</strong>. As θ ↓, tan θ ↓, so d = h/tan θ ↑.'},
{cat:'hgt',q:'Can the angle of elevation be 90°? What does it mean?',a:'Angle of elevation = 90° means the object is <strong>directly overhead</strong>. In practice, this is not used in height problems (tan 90° is undefined).'},

// ── dst: Finding Distances (8) ──
{cat:'dst',q:'Formula: Distance to a ship from a lighthouse of height h with angle of depression θ?',a:'<strong>d = h / tan θ = h × cot θ</strong><br>Distance = height ÷ tangent of angle of depression.'},
{cat:'dst',q:'From a 150 m lighthouse, angle of depression to ship = 30°. Find distance.',a:'d = 150/tan 30° = 150/(1/√3) = 150√3 ≈ <strong>259.8 m</strong>'},
{cat:'dst',q:'From a 60 m building, angle of depression = 45°. Find distance of car.',a:'d = 60/tan 45° = 60/1 = <strong>60 m</strong><br>(When angle = 45°, distance = height!)'},
{cat:'dst',q:'What is the relationship between height and distance when depression angle is 30°?',a:'<strong>Distance = √3 × height</strong><br>Since tan 30° = 1/√3, d = h/(1/√3) = h√3.'},
{cat:'dst',q:'What is the relationship between height and distance when depression angle is 60°?',a:'<strong>Distance = height/√3</strong><br>Since tan 60° = √3, d = h/√3 = h√3/3.'},
{cat:'dst',q:'A bird is at height 50 m. Angle of elevation from a point = 30°. How far is the point from the bird (line of sight)?',a:'sin 30° = 50/hyp<br>1/2 = 50/hyp<br><strong>Hypotenuse = 100 m</strong> (line of sight distance)'},
{cat:'dst',q:'How do you find the width of a river using trigonometry?',a:'Stand at the bank, note height of a marker on the other side. Measure angle of elevation. Width = <strong>height / tan θ</strong>.'},
{cat:'dst',q:'If two ships are on the same side and angles of depression are 30° and 60° from a 100 m cliff, what is the distance between them?',a:'d₁ = 100/tan 30° = 100√3<br>d₂ = 100/tan 60° = 100/√3<br>Gap = 100√3 − 100/√3 = <strong>200/√3 = 200√3/3 m</strong>'},

// ── two: Two-Triangle Problems (8) ──
{cat:'two',q:'Master formula: Height from two angles α, β at distance d apart (same side)?',a:'<strong>h = d·tan α·tan β / (tan β − tan α)</strong><br>where α < β (far angle < near angle).'},
{cat:'two',q:'Angles of elevation of a tower from two points 40 m apart are 30° and 60°. Find height.',a:'h = 40·tan30°·tan60° / (tan60°−tan30°)<br>= 40·(1/√3)(√3) / (√3−1/√3)<br>= 40/(2/√3) = <strong>20√3 m</strong>'},
{cat:'two',q:'In a two-angle problem, which angle is always larger?',a:'The angle from the <strong>nearer point</strong> is always larger (β > α). As you move closer, the elevation angle increases.'},
{cat:'two',q:'If both observation points are on opposite sides of the tower, how does the formula change?',a:'Instead of subtracting distances, we <strong>add</strong> them:<br>d = h/tan α + h/tan β<br>h = d / (cot α + cot β)'},
{cat:'two',q:'A tower subtends angles 30° and 60° from two points on opposite sides, 150 m apart. Find height.',a:'h(cot 30° + cot 60°) = 150<br>h(√3 + 1/√3) = 150<br>h(4/√3) = 150<br><strong>h = 150√3/4 ≈ 64.95 m</strong>'},
{cat:'two',q:'From the top of a 7 m building, angle of elevation of a tower top is 60° and depression of its foot is 45°. Find tower height.',a:'Distance to tower: d = 7/tan 45° = 7 m<br>Extra height: x = 7·tan 60° = 7√3<br>Tower = 7 + 7√3 = <strong>7(1+√3) m ≈ 19.12 m</strong>'},
{cat:'two',q:'Why do most CBSE 5-mark problems use two triangles sharing a common side?',a:'The common side (usually the height h) allows us to set up <strong>two equations</strong> and eliminate the unknown horizontal distance to solve for h.'},
{cat:'two',q:'What should you let = x in a two-triangle problem?',a:'Let the <strong>shorter horizontal distance</strong> (from the nearer point to the base) = x. The longer distance is then (x + d) where d is the separation between observation points.'},

// ── app: Real Applications & Exam Tips (8) ──
{cat:'app',q:'How was the height of Mt. Everest first calculated?',a:'Using <strong>trigonometric surveying</strong> from the Great Trigonometric Survey of India (1850s). Angles of elevation were measured from known baselines on the plains.'},
{cat:'app',q:'What is the first step in solving ANY heights & distances problem?',a:'<strong>Draw a clear, labeled diagram.</strong> Mark the right angle, angles of elevation/depression, and all known/unknown sides. (Often carries 1 mark in CBSE!)'},
{cat:'app',q:'Common exam mistake: confusing angle of elevation with...',a:'The angle <strong>at the base of the triangle</strong>. The angle of elevation is at the observer\'s position, measured from the horizontal — NOT from the ground at the tower\'s base.'},
{cat:'app',q:'When should you use sin θ instead of tan θ in these problems?',a:'When the problem asks for the <strong>line of sight distance (hypotenuse)</strong> rather than the horizontal distance. sin θ = height/hypotenuse.'},
{cat:'app',q:'Approximate value: √3 ≈ ?',a:'<strong>√3 ≈ 1.732</strong><br>Also: 1/√3 = √3/3 ≈ 0.577<br>These are frequently needed for final numerical answers.'},
{cat:'app',q:'How to verify your answer makes physical sense?',a:'Check: Is height positive? Is distance reasonable? If elevation angle > 45°, height > distance. If < 45°, height < distance. Does doubling the distance halve the angle (roughly)?'},
{cat:'app',q:'In CBSE, how many marks does a heights & distances question usually carry?',a:'Usually <strong>5 marks</strong> (long answer). Marking: 1 for diagram, 1 for correct setup, 2 for solving, 1 for final answer.'},
{cat:'app',q:'What does "rationalize the denominator" mean in the final answer?',a:'Remove the surd (√) from the denominator:<br>a/√3 → a√3/3<br>CBSE prefers: <strong>20√3</strong> over 20/√3 × (√3/√3) = 20√3/3. Check if simplified form is asked.'},
];

const CATS={los:{label:'Line of Sight',color:'var(--teal)',bg:'rgba(45,212,191,.12)'},hgt:{label:'Finding Heights',color:'var(--amber)',bg:'rgba(245,158,11,.12)'},dst:{label:'Finding Distances',color:'var(--blue)',bg:'rgba(56,189,248,.12)'},two:{label:'Two-Triangle',color:'var(--indigo)',bg:'rgba(129,140,248,.12)'},app:{label:'Applications & Tips',color:'var(--green)',bg:'rgba(34,197,94,.12)'}};

let filtered=[...CARDS], idx=0, known=new Set(), currentCat='all';

function buildFilters(){
  const f=document.getElementById('filters');
  let html=`<button class="active" onclick="setFilter('all',this)">All (${CARDS.length})</button>`;
  for(const[k,v]of Object.entries(CATS)){
    const n=CARDS.filter(c=>c.cat===k).length;
    html+=`<button onclick="setFilter('${k}',this)">${v.label} (${n})</button>`;
  }
  f.innerHTML=html;
}
function setFilter(cat,btn){
  currentCat=cat;
  document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  filtered=cat==='all'?[...CARDS]:CARDS.filter(c=>c.cat===cat);
  idx=0; render();
}
function render(){
  if(!filtered.length){document.getElementById('deck').innerHTML='<p style="color:var(--muted)">No cards in this category.</p>';return;}
  if(idx>=filtered.length)idx=0; if(idx<0)idx=filtered.length-1;
  const c=filtered[idx], cat=CATS[c.cat];
  document.getElementById('deck').innerHTML=`
    <div class="flip-card" id="fc" onclick="flipCard()">
      <div class="front">
        <span class="cat-badge" style="background:${cat.bg};color:${cat.color}">${cat.label}</span>
        <h2>${c.q}</h2>
        <span class="hint">tap to flip</span>
      </div>
      <div class="back">
        <span class="cat-badge" style="background:${cat.bg};color:${cat.color}">${cat.label}</span>
        <p>${c.a}</p>
      </div>
    </div>`;
  document.getElementById('pos').textContent=`${idx+1} / ${filtered.length}`;
  document.getElementById('prog').style.width=((idx+1)/filtered.length*100)+'%';
  document.getElementById('knownCount').textContent=known.size+' known';
}
function flipCard(){document.getElementById('fc')?.classList.toggle('flipped')}
function next(){idx++;render()} function prev(){idx--;render()}
function markKnown(){const c=filtered[idx];known.add(c.q);next();}
function shuffle(){filtered.sort(()=>Math.random()-.5);idx=0;render();}
function resetAll(){known.clear();filtered=currentCat==='all'?[...CARDS]:CARDS.filter(c=>c.cat===currentCat);idx=0;render();}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')next();
  else if(e.key==='ArrowLeft')prev();
  else if(e.key===' '){e.preventDefault();flipCard();}
  else if(e.key==='k'||e.key==='K')markKnown();
  else if(e.key==='s'||e.key==='S')shuffle();
});

buildFilters(); render();
</script>
</body>
</html>
