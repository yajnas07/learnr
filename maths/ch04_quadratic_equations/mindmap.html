<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mind Map — Quadratic Equations</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #040810; font-family: 'Nunito', sans-serif; overflow: hidden; width: 100vw; height: 100vh; }
canvas { position: absolute; inset: 0; }

#ui {
  position: absolute; top: 0; left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: center;
  padding: .8rem 1.2rem; z-index: 10; pointer-events: none;
}
#ui h1 {
  font-family: 'Syne', sans-serif; font-size: 1.1rem; font-weight: 800;
  background: linear-gradient(135deg,#38bdf8,#f59e0b,#22c55e);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
#ui p { font-family: 'DM Mono', monospace; font-size: .68rem; color: #475569; margin-top: .1rem; }

.ctrl-bar {
  position: absolute; bottom: 1rem; left: 50%; transform: translateX(-50%);
  display: flex; gap: .5rem; z-index: 10;
}
.ctrl-btn {
  font-family: 'Syne', sans-serif; font-weight: 700; font-size: .75rem;
  padding: .4rem 1rem; border-radius: 99px;
  border: 1.5px solid #334155; background: rgba(30,41,59,.9);
  color: #94a3b8; cursor: pointer; transition: all .2s; pointer-events: all;
}
.ctrl-btn:hover { border-color: #64748b; color: #e2e8f0; }

#tooltip {
  position: absolute; z-index: 20; pointer-events: none;
  background: #1e293b; border: 1px solid #334155;
  border-radius: 12px; padding: .7rem 1rem;
  max-width: 260px; font-size: .82rem; color: #e2e8f0;
  line-height: 1.6; display: none;
  box-shadow: 0 8px 24px rgba(0,0,0,.6);
}
#tooltip strong { font-family: 'Syne', sans-serif; display: block; margin-bottom: .3rem; }

.site-nav {
  display:flex; align-items:center; justify-content:space-between;
  padding:.42rem 1.2rem; width:100%; align-self:stretch; flex-shrink:0;
  background:rgba(4,8,16,.9); backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(26,45,69,.75);
  position:sticky; top:0; z-index:9999;
}
.site-nav-logo { display:flex; align-items:center; text-decoration:none; }
.site-nav-img  { height:28px; width:auto; display:block; border-radius:4px; }
.site-nav-back {
  font-family:'DM Mono',monospace; font-size:.68rem;
  color:#7a9ab8; text-decoration:none; transition:all .2s;
  border:1px solid rgba(26,45,69,.9); border-radius:99px;
  padding:.2rem .65rem; white-space:nowrap;
}
.site-nav-back:hover { color:#dde6f5; border-color:#2a4060; background:rgba(255,255,255,.04); }
</style>
</head>
<body>
<nav class="site-nav"><a href="../../index.html" class="site-nav-logo"><img src="../../logos/learnr-colored-dark.svg" alt="learnr" class="site-nav-img"></a><a href="../../index.html" class="site-nav-back">&#8592; Back to Portal</a></nav>
<div id="ui">
  <div>
    <h1>Quadratic Equations</h1>
    <p>Class X · CBSE · Mind Map — hover nodes to explore</p>
  </div>
</div>

<div class="ctrl-bar">
  <button class="ctrl-btn" onclick="zoom(1.2)">＋ Zoom</button>
  <button class="ctrl-btn" onclick="zoom(0.83)">－ Zoom</button>
  <button class="ctrl-btn" onclick="resetView()">⌖ Reset</button>
</div>

<div id="tooltip"></div>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const tip = document.getElementById('tooltip');

let W, H, scale = 1, ox = 0, oy = 0;
let dragging = false, dragStart = {x:0,y:0}, dragOrigin = {x:0,y:0};

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  ox = W/2; oy = H/2 + 20;
  draw();
}
window.addEventListener('resize', resize);

const CENTER = {
  id:'c', label:'Quadratic\nEquations', x:0, y:0, r:60,
  color:'#050e1c', stroke:'#38bdf8', textColor:'#7dd3fc', fontSize:14
};

const BRANCHES = [
  {
    id:'std', label:'Standard\nForm', x:0, y:-290, r:44,
    color:'#001525', stroke:'#38bdf8', textColor:'#7dd3fc',
    info:'General form: ax² + bx + c = 0\nwhere a, b, c are real numbers and a ≠ 0.\nDegree = 2. The highest power is x².\nA quadratic equation has AT MOST 2 real roots.',
    children:[
      { id:'st1', label:'ax²+bx+c=0\na≠0', x:-180, y:-410, r:34, color:'#001525', stroke:'#38bdf8', textColor:'#bae6fd',
        info:'a, b, c are real number coefficients.\na ≠ 0 (otherwise it becomes linear).\nExamples:\n• 2x²−5x+3=0\n• x²−4=0 (b=0)\n• x²+5x=0 (c=0)' },
      { id:'st2', label:'Roots =\nZeroes', x:0, y:-440, r:34, color:'#001525', stroke:'#38bdf8', textColor:'#bae6fd',
        info:'Roots of ax²+bx+c=0 are the same as zeroes of f(x)=ax²+bx+c.\nAt roots: f(x)=0, the parabola crosses the x-axis.\nAlso called: solutions, zeroes, x-intercepts.' },
      { id:'st3', label:'Max\n2 Roots', x:180, y:-410, r:34, color:'#001525', stroke:'#38bdf8', textColor:'#bae6fd',
        info:'A degree-n polynomial has at most n real roots.\nSo a quadratic has at most 2 real roots.\nCould have 0, 1, or 2 real roots depending on discriminant.' },
    ]
  },
  {
    id:'fact', label:'Factorisation', x:-300, y:-185, r:44,
    color:'#1a0f00', stroke:'#f59e0b', textColor:'#fde68a',
    info:'Express ax²+bx+c as a product of two linear factors.\nThen use zero product property: if p×q=0 then p=0 or q=0.\nMost efficient when roots are integers or simple fractions.',
    children:[
      { id:'f1', label:'Split Middle\nTerm', x:-510, y:-300, r:34, color:'#1a0f00', stroke:'#fbbf24', textColor:'#fef3c7',
        info:'Find two numbers whose:\n• Product = a × c\n• Sum = b\nThen split bx into those two parts.\nExample: 6x²+7x+2\nProduct=12, Sum=7 → 3 and 4\n6x²+3x+4x+2' },
      { id:'f2', label:'Group &\nFactor', x:-540, y:-170, r:34, color:'#1a0f00', stroke:'#fbbf24', textColor:'#fef3c7',
        info:'After splitting, group into two pairs:\n(6x²+3x)+(4x+2)\n= 3x(2x+1)+2(2x+1)\n= (3x+2)(2x+1)\nThe common bracket is the factor.' },
      { id:'f3', label:'Zero Product\nRule', x:-510, y:-55, r:34, color:'#1a0f00', stroke:'#fbbf24', textColor:'#fef3c7',
        info:'If (3x+2)(2x+1) = 0\nThen 3x+2=0 OR 2x+1=0\n→ x = −2/3 OR x = −1/2\nThis is the Zero Product Property.' },
      { id:'f4', label:'Works for\nRational Roots', x:-330, y:-360, r:34, color:'#1a0f00', stroke:'#fbbf24', textColor:'#fef3c7',
        info:'Factorisation works well only when roots are integers or simple fractions.\nFor irrational roots, use the Quadratic Formula.\nIf discriminant is a perfect square → rational roots.' },
    ]
  },
  {
    id:'csq', label:'Completing\nthe Square', x:-300, y:185, r:44,
    color:'#001a18', stroke:'#2dd4bf', textColor:'#99f6e4',
    info:'Method to convert ax²+bx+c=0 into (x+k)²=d form.\nUsed to derive the Quadratic Formula.\nAlways works — even for irrational roots.',
    children:[
      { id:'cs1', label:'Divide by a', x:-510, y:80, r:34, color:'#001a18', stroke:'#5eead4', textColor:'#ccfbf1',
        info:'Make coefficient of x² equal to 1.\nDivide entire equation by a:\nx² + (b/a)x + (c/a) = 0' },
      { id:'cs2', label:'Add (b/2a)²\nboth sides', x:-540, y:210, r:34, color:'#001a18', stroke:'#5eead4', textColor:'#ccfbf1',
        info:'Add the square of half the x-coefficient to both sides:\nx² + (b/a)x + (b/2a)² = (b/2a)² − c/a\nLHS becomes a perfect square trinomial.' },
      { id:'cs3', label:'(x+b/2a)²\n= D/4a²', x:-500, y:340, r:34, color:'#001a18', stroke:'#5eead4', textColor:'#ccfbf1',
        info:'(x + b/2a)² = (b²−4ac)/4a²\nTake square root of both sides:\nx + b/2a = ±√(b²−4ac) / 2a\nThis is where the formula comes from.' },
      { id:'cs4', label:'Derives\nFormula', x:-310, y:390, r:34, color:'#001a18', stroke:'#5eead4', textColor:'#ccfbf1',
        info:'Completing the square on ax²+bx+c=0 directly gives:\nx = (−b ± √(b²−4ac)) / 2a\nThis is the Quadratic Formula (Shreedharacharya).' },
    ]
  },
  {
    id:'qf', label:'Quadratic\nFormula', x:300, y:-185, r:44,
    color:'#001a08', stroke:'#22c55e', textColor:'#86efac',
    info:'x = (−b ± √(b²−4ac)) / 2a\nThe Shreedharacharya Formula.\nWorks for ALL quadratic equations.\nGives both roots (+ and −) simultaneously.',
    children:[
      { id:'q1', label:'x=(−b±√D)/2a', x:510, y:-300, r:34, color:'#001a08', stroke:'#4ade80', textColor:'#bbf7d0',
        info:'The complete formula:\n• α = (−b + √D) / 2a\n• β = (−b − √D) / 2a\nwhere D = b²−4ac (discriminant).\nNamed after Indian mathematician Shreedharacharya.' },
      { id:'q2', label:"Vieta's\nFormulas", x:540, y:-170, r:34, color:'#001a08', stroke:'#4ade80', textColor:'#bbf7d0',
        info:'For roots α and β of ax²+bx+c=0:\n• Sum of roots: α+β = −b/a\n• Product of roots: αβ = c/a\nUseful for verification without solving.' },
      { id:'q3', label:'Always\nWorks', x:510, y:-55, r:34, color:'#001a08', stroke:'#4ade80', textColor:'#bbf7d0',
        info:'Unlike factorisation, the formula works even when:\n• Roots are irrational (e.g., 2±√3)\n• Roots involve decimals\nIt is the universal method.' },
      { id:'q4', label:'Derived from\nComp. Square', x:330, y:-360, r:34, color:'#001a08', stroke:'#4ade80', textColor:'#bbf7d0',
        info:'The formula is derived by completing the square on the general form ax²+bx+c=0.\nIt\'s not a separate method — it IS completing the square, solved generally.' },
    ]
  },
  {
    id:'disc', label:'Discriminant\n& Nature', x:300, y:185, r:44,
    color:'#0a0020', stroke:'#818cf8', textColor:'#c7d2fe',
    info:'D = b² − 4ac\nThe expression under the square root in the formula.\nDetermines the NATURE (type) of roots without actually solving.',
    children:[
      { id:'d1', label:'D > 0\n2 Distinct\nReal Roots', x:510, y:80, r:36, color:'#0a0020', stroke:'#a5b4fc', textColor:'#e0e7ff',
        info:'Two distinct real roots exist.\nParabola cuts x-axis at TWO points.\nIf D is a perfect square → roots are RATIONAL.\nIf D is not a perfect square → roots are IRRATIONAL.' },
      { id:'d2', label:'D = 0\nEqual Roots', x:540, y:220, r:36, color:'#0a0020', stroke:'#a5b4fc', textColor:'#e0e7ff',
        info:'Two equal (repeated) real roots.\nBoth roots = −b/2a.\nParabola TOUCHES x-axis at exactly one point (vertex on x-axis).\nAlso called "coincident roots".' },
      { id:'d3', label:'D < 0\nNo Real\nRoots', x:500, y:360, r:36, color:'#0a0020', stroke:'#a5b4fc', textColor:'#e0e7ff',
        info:'No real roots exist.\nParabola does NOT touch the x-axis.\nRoots are imaginary (complex numbers).\nNot in scope of Class X CBSE (just know they don\'t exist).' },
      { id:'d4', label:'Perfect\nSquare D', x:310, y:390, r:34, color:'#0a0020', stroke:'#a5b4fc', textColor:'#e0e7ff',
        info:'If D > 0 AND D is a perfect square:\n→ Roots are rational numbers.\n→ Factorisation is possible.\nExample: D = 49 → √49=7 → rational roots.' },
    ]
  },
  {
    id:'app', label:'Applications', x:0, y:290, r:44,
    color:'#1a0010', stroke:'#f43f5e', textColor:'#fda4af',
    info:'Quadratic equations model real-life situations.\nForm an equation from the given conditions, solve it, then verify the answer in context.',
    children:[
      { id:'ap1', label:'Number\nProblems', x:-170, y:420, r:34, color:'#1a0010', stroke:'#fb7185', textColor:'#fecdd3',
        info:'Two numbers with known sum/difference and product.\nx(S−x)=P → forms a quadratic.\nExample: Two numbers with sum 8 and product 15.\nx(8−x)=15 → x²−8x+15=0 → x=3 or 5.' },
      { id:'ap2', label:'Geometry\n& Area', x:0, y:460, r:34, color:'#1a0010', stroke:'#fb7185', textColor:'#fecdd3',
        info:'Area problems with algebraic dimensions.\nLength × Breadth = Area → quadratic.\nPythagorean theorem: a²+b²=c².\nExample: Rectangular park with given area & perimeter.' },
      { id:'ap3', label:'Speed,\nDistance,\nTime', x:170, y:420, r:34, color:'#1a0010', stroke:'#fb7185', textColor:'#fecdd3',
        info:'D = S × T type problems.\nIncreased/decreased speed changes time.\n(D/s) − (D/(s+k)) = t → quadratic.\nExample: Train journey with speed change.' },
    ]
  }
];

// Build flat list
const allNodes = [CENTER];
const allEdges = [];
BRANCHES.forEach(b => {
  allNodes.push(b);
  allEdges.push({from:'c', to:b.id});
  (b.children||[]).forEach(ch => {
    allNodes.push(ch);
    allEdges.push({from:b.id, to:ch.id});
  });
});

function getNode(id) { return allNodes.find(n=>n.id===id); }

// Pan & zoom
canvas.addEventListener('mousedown', e => { dragging=true; dragStart={x:e.clientX,y:e.clientY}; dragOrigin={x:ox,y:oy}; });
canvas.addEventListener('mousemove', e => {
  if (dragging) { ox = dragOrigin.x+(e.clientX-dragStart.x); oy = dragOrigin.y+(e.clientY-dragStart.y); draw(); return; }
  const mx=(e.clientX-ox)/scale, my=(e.clientY-oy)/scale;
  let found=null;
  allNodes.forEach(n=>{ const dx=mx-n.x,dy=my-n.y; if(Math.sqrt(dx*dx+dy*dy)<n.r+6) found=n; });
  if(found && found.info){ tip.style.display='block'; tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY-10)+'px';
    tip.innerHTML=`<strong>${found.label.replace(/\n/g,' ')}</strong>${found.info.replace(/\n/g,'<br>')}`;
    canvas.style.cursor='pointer';
  } else { tip.style.display='none'; canvas.style.cursor='grab'; }
});
canvas.addEventListener('mouseup', ()=>dragging=false);
canvas.addEventListener('mouseleave', ()=>{ dragging=false; tip.style.display='none'; });
canvas.addEventListener('wheel', e=>{ e.preventDefault(); const f=e.deltaY<0?1.1:0.91; zoomAt(f,e.clientX,e.clientY); },{passive:false});

// Touch
let lastTouchDist=null;
canvas.addEventListener('touchstart',e=>{ if(e.touches.length===1){ dragging=true; dragStart={x:e.touches[0].clientX,y:e.touches[0].clientY}; dragOrigin={x:ox,y:oy}; }});
canvas.addEventListener('touchmove',e=>{ e.preventDefault();
  if(e.touches.length===1&&dragging){ ox=dragOrigin.x+(e.touches[0].clientX-dragStart.x); oy=dragOrigin.y+(e.touches[0].clientY-dragStart.y); draw(); }
  if(e.touches.length===2){ const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    if(lastTouchDist){ const cx=(e.touches[0].clientX+e.touches[1].clientX)/2,cy=(e.touches[0].clientY+e.touches[1].clientY)/2; zoomAt(d/lastTouchDist,cx,cy); }
    lastTouchDist=d; }
},{passive:false});
canvas.addEventListener('touchend',()=>{ dragging=false; lastTouchDist=null; });

function zoomAt(f,cx,cy){ const prev=scale; scale=Math.max(.3,Math.min(2.5,scale*f)); ox=cx-(cx-ox)*(scale/prev); oy=cy-(cy-oy)*(scale/prev); draw(); }
function zoom(f){ zoomAt(f,W/2,H/2); }
function resetView(){ scale=1; ox=W/2; oy=H/2+20; draw(); }

// Draw
function draw() {
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(ox,oy);
  ctx.scale(scale,scale);

  // grid
  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,.025)';
  ctx.lineWidth=1;
  for(let x=-1000;x<1000;x+=60){ ctx.beginPath();ctx.moveTo(x,-1000);ctx.lineTo(x,1000);ctx.stroke(); }
  for(let y=-1000;y<1000;y+=60){ ctx.beginPath();ctx.moveTo(-1000,y);ctx.lineTo(1000,y);ctx.stroke(); }
  ctx.restore();

  // edges
  allEdges.forEach(e=>{
    const a=getNode(e.from),b=getNode(e.to);
    if(!a||!b)return;
    const grd=ctx.createLinearGradient(a.x,a.y,b.x,b.y);
    grd.addColorStop(0,a.stroke+'88');
    grd.addColorStop(1,b.stroke+'44');
    ctx.beginPath();
    const cx=(a.x+b.x)/2, cy=(a.y+b.y)/2-30;
    ctx.moveTo(a.x,a.y);
    ctx.quadraticCurveTo(cx,cy,b.x,b.y);
    ctx.strokeStyle=grd;
    ctx.lineWidth=e.from==='c'?2.5:1.5;
    ctx.setLineDash(e.from==='c'?[]:[4,4]);
    ctx.stroke();
    ctx.setLineDash([]);
  });

  // nodes
  allNodes.forEach(n=>{
    ctx.save();
    ctx.shadowColor=n.stroke;
    ctx.shadowBlur=n.id==='c'?30:16;
    ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
    ctx.fillStyle=n.color;
    ctx.fill();
    ctx.restore();

    ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
    ctx.strokeStyle=n.stroke;
    ctx.lineWidth=n.id==='c'?3:2;
    ctx.stroke();

    ctx.fillStyle=n.textColor;
    ctx.font=`700 ${n.fontSize||11}px Nunito,sans-serif`;
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    const lines=n.label.split('\n');
    const lh=14;
    const startY=n.y-(lines.length-1)*lh/2;
    lines.forEach((l,i)=>ctx.fillText(l,n.x,startY+i*lh));
  });

  ctx.restore();
}

resize();
</script>
</body>
</html>
