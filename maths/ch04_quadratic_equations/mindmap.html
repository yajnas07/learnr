<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mind Map — Quadratic Equations</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Mono:wght@400;500&family=Lato:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#040810;--card:#0a1422;--card2:#0f1c30;
  --border:#1a2d45;--text:#cce4ff;--muted:#4a6890;
  --amber:#f59e0b;--teal:#2dd4bf;--blue:#38bdf8;
  --green:#22c55e;--red:#f43f5e;--indigo:#818cf8;--purple:#d946ef;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Lato',sans-serif;height:100vh;overflow:hidden;display:flex;flex-direction:column;}
.site-nav{display:flex;align-items:center;justify-content:space-between;padding:.42rem 1.2rem;
  background:rgba(4,8,16,.9);backdrop-filter:blur(14px);border-bottom:1px solid rgba(26,45,69,.75);z-index:9999;flex-shrink:0;}
.site-nav-logo{display:flex;align-items:center;text-decoration:none;}
.site-nav-img{height:28px;}
.site-nav-back{font-family:'DM Mono',monospace;font-size:.68rem;color:#7a9ab8;text-decoration:none;border:1px solid rgba(26,45,69,.9);border-radius:99px;padding:.2rem .65rem;}
.site-nav-back:hover{color:#dde6f5;}

.canvas-wrap{flex:1;position:relative;overflow:hidden;cursor:grab;}
.canvas-wrap:active{cursor:grabbing;}
canvas{position:absolute;top:0;left:0;}

.tooltip{position:fixed;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:.5rem .75rem;
  font-size:.78rem;line-height:1.4;pointer-events:none;opacity:0;transition:opacity .2s;max-width:260px;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.7);}
.tooltip.show{opacity:1;}
.tooltip strong{color:var(--amber);}
.tooltip em{color:var(--teal);font-style:normal;}

.controls{position:fixed;bottom:1rem;right:1rem;display:flex;gap:.3rem;z-index:100;}
.ctrl-btn{width:32px;height:32px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--muted);
  font-size:.9rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.ctrl-btn:hover{color:var(--text);border-color:#2a4a6a;}

.legend{position:fixed;bottom:1rem;left:1rem;display:flex;flex-direction:column;gap:.2rem;z-index:100;font-family:'DM Mono',monospace;font-size:.62rem;}
.legend span{display:flex;align-items:center;gap:.4rem;color:var(--muted);}
.legend span::before{content:'';width:10px;height:10px;border-radius:50%;display:inline-block;}
.l-blue::before{background:var(--blue);}.l-amber::before{background:var(--amber);}
.l-teal::before{background:var(--teal);}.l-green::before{background:var(--green);}
.l-indigo::before{background:var(--indigo);}.l-red::before{background:var(--red);}
</style>
</head>
<body>
<nav class="site-nav">
  <a href="../../index.html" class="site-nav-logo"><img src="../../logos/learnr-colored-dark.svg" alt="learnr" class="site-nav-img"></a>
  <a href="../../index.html" class="site-nav-back">&#8592; Back to Portal</a>
</nav>

<div class="canvas-wrap" id="wrap">
  <canvas id="mm"></canvas>
</div>
<div class="tooltip" id="tip"></div>

<div class="controls">
  <button class="ctrl-btn" onclick="zoom(1.2)">+</button>
  <button class="ctrl-btn" onclick="zoom(1/1.2)">−</button>
  <button class="ctrl-btn" onclick="resetView()">⟲</button>
</div>

<div class="legend">
  <span class="l-blue">Standard Form</span>
  <span class="l-amber">Factorisation</span>
  <span class="l-teal">Complete Square</span>
  <span class="l-green">Quadratic Formula</span>
  <span class="l-indigo">Discriminant</span>
  <span class="l-red">Applications</span>
</div>

<script>
const canvas = document.getElementById('mm');
const ctx = canvas.getContext('2d');
const wrap = document.getElementById('wrap');
const tip = document.getElementById('tip');

let W, H, scale=1, panX=0, panY=0, dragging=false, dragStart={x:0,y:0};
const dpr = window.devicePixelRatio||1;

function resize(){
  W = wrap.clientWidth; H = wrap.clientHeight;
  canvas.width = W*dpr; canvas.height = H*dpr;
  canvas.style.width = W+'px'; canvas.style.height = H+'px';
  draw();
}
window.addEventListener('resize', resize);

// ── MIND MAP DATA ──
const CENTER = {x:0, y:0, label:'Quadratic\nEquations', color:'#38bdf8', r:52};

const branches = [
  {angle:-90, color:'#38bdf8', label:'Standard Form', children:[
    {label:'ax²+bx+c=0\n(a≠0)', tip:'<strong>General form:</strong> a, b, c are real numbers, a must be non-zero. Degree = 2.'},
    {label:'Quadratic\npolynomial = 0', tip:'A quadratic equation is obtained by equating a degree-2 polynomial to zero.'},
    {label:'Roots = zeros\nof polynomial', tip:'The solutions of ax²+bx+c=0 are the <em>zeros</em> (x-intercepts) of f(x)=ax²+bx+c.'},
    {label:'Max 2 roots', tip:'A polynomial of degree n has <strong>at most n real roots</strong>. Quadratic → at most 2.'},
  ]},
  {angle:-30, color:'#f59e0b', label:'Factorisation', children:[
    {label:'Split middle\nterm', tip:'Find two numbers with <strong>product = ac</strong> and <strong>sum = b</strong>, then split bx into those two parts.'},
    {label:'Group &\nfactor', tip:'After splitting, group into two pairs and factor each. Common bracket factor emerges.'},
    {label:'Zero product\nrule', tip:'If <em>p × q = 0</em>, then p=0 or q=0. Apply to factored form to find roots.'},
    {label:'Works when\nroots are rational', tip:'Factorisation is efficient only when roots are <strong>integers or simple fractions</strong>.'},
  ]},
  {angle:30, color:'#2dd4bf', label:'Completing\nthe Square', children:[
    {label:'Divide by a', tip:'Make coefficient of x² equal to 1 by dividing entire equation by a.'},
    {label:'Add (b/2a)²\nboth sides', tip:'Add the square of half the coefficient of x to both sides to form a perfect square trinomial.'},
    {label:'(x + b/2a)² =\n(b²-4ac)/4a²', tip:'LHS becomes a perfect square. RHS is a constant. Take square root of both sides.'},
    {label:'Derives the\nQuadratic Formula', tip:'Applying this method to the general form ax²+bx+c=0 <strong>derives</strong> the quadratic formula.'},
  ]},
  {angle:90, color:'#22c55e', label:'Quadratic\nFormula', children:[
    {label:'x = (-b±√D)/2a', tip:'The <strong>Shreedharacharya formula</strong>. Works for ALL quadratic equations, always gives both roots.'},
    {label:'D = b²-4ac', tip:'<em>Discriminant</em> — the expression under the square root that determines the nature of roots.'},
    {label:'Always\nworks', tip:'Unlike factorisation, the formula works even when roots are <strong>irrational or complex</strong>.'},
    {label:'Sum = -b/a\nProduct = c/a', tip:'<strong>Vieta\'s formulas:</strong> Sum of roots = −b/a, Product of roots = c/a. Useful for verification.'},
  ]},
  {angle:150, color:'#818cf8', label:'Discriminant\n& Nature', children:[
    {label:'D > 0\n2 distinct reals', tip:'Parabola cuts x-axis at <strong>two points</strong>. If D is a perfect square → roots are rational.'},
    {label:'D = 0\nequal roots', tip:'Parabola <strong>touches</strong> x-axis at one point. Both roots = −b/2a (repeated root).'},
    {label:'D < 0\nno real roots', tip:'Parabola does <strong>not touch</strong> x-axis. Roots are imaginary (complex). No real solution.'},
    {label:'Perfect sq D\n→ rational roots', tip:'If D > 0 and D is a perfect square, roots are <strong>rational</strong> and factorisation is possible.'},
  ]},
  {angle:210, color:'#f43f5e', label:'Applications', children:[
    {label:'Number\nproblems', tip:'Product of two numbers given their sum/difference. x(S−x)=P → quadratic.'},
    {label:'Geometry &\nArea', tip:'Area = length × breadth with algebraic dimensions. Pythagoras theorem problems.'},
    {label:'Speed-Distance\n-Time', tip:'D/S=T type. Increased/decreased speed changes time → quadratic relation.'},
    {label:'Age, Work\n& Profit', tip:'Product of ages, combined work rates (1/x + 1/(x+k)), revenue optimization.'},
  ]},
];

// Generate node positions
const nodes = [];
const BRANCH_LEN = 160, CHILD_LEN = 105, CHILD_SPREAD = 38;

// Center node
nodes.push({x:0, y:0, r:CENTER.r, label:CENTER.label, color:CENTER.color, type:'center', tip:'<strong>Quadratic Equations</strong><br>Chapter 4 · Class X CBSE<br>ax²+bx+c=0, solving methods, nature of roots, applications'});

branches.forEach((br, bi)=>{
  const rad = br.angle * Math.PI/180;
  const bx = Math.cos(rad)*BRANCH_LEN;
  const by = Math.sin(rad)*BRANCH_LEN;
  nodes.push({x:bx, y:by, r:36, label:br.label, color:br.color, type:'branch', parent:0, tip:`<strong>${br.label.replace('\n',' ')}</strong>`});
  const brIdx = nodes.length-1;

  br.children.forEach((ch, ci)=>{
    const spread = (ci - (br.children.length-1)/2) * CHILD_SPREAD;
    const childRad = rad + spread * Math.PI/180;
    const cx = bx + Math.cos(childRad)*CHILD_LEN;
    const cy = by + Math.sin(childRad)*CHILD_LEN;
    nodes.push({x:cx, y:cy, r:28, label:ch.label, color:br.color, type:'child', parent:brIdx, tip:ch.tip});
  });
});

function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(W/2+panX, H/2+panY);
  ctx.scale(scale, scale);

  // Draw connections
  nodes.forEach((n,i)=>{
    if(n.parent!==undefined){
      const p=nodes[n.parent];
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      // Bezier curve
      const mx=(p.x+n.x)/2, my=(p.y+n.y)/2;
      ctx.quadraticCurveTo(mx + (n.y-p.y)*0.15, my - (n.x-p.x)*0.15, n.x, n.y);
      ctx.strokeStyle=n.color+'55';
      ctx.lineWidth=n.type==='branch'?2.5:1.5;
      ctx.stroke();
    }
  });

  // Draw nodes
  nodes.forEach(n=>{
    // Glow
    const grad=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r*1.5);
    grad.addColorStop(0,n.color+'22');grad.addColorStop(1,'transparent');
    ctx.fillStyle=grad;ctx.beginPath();ctx.arc(n.x,n.y,n.r*1.5,0,Math.PI*2);ctx.fill();

    // Node circle
    ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
    ctx.fillStyle=n.type==='center'?n.color+'25':'#0a1422';
    ctx.fill();
    ctx.strokeStyle=n.color;ctx.lineWidth=n.type==='center'?3:2;ctx.stroke();

    // Label
    ctx.fillStyle=n.type==='center'?'#ffffff':n.color;
    ctx.font=n.type==='center'?'bold 13px Playfair Display':n.type==='branch'?'bold 11px Playfair Display':'10px DM Mono';
    ctx.textAlign='center';ctx.textBaseline='middle';
    const lines=n.label.split('\n');
    lines.forEach((line,li)=>{
      ctx.fillText(line, n.x, n.y + (li-(lines.length-1)/2)*14);
    });
  });

  ctx.restore();
}

// ── Interaction ──
function getMousePos(e){
  const rect=wrap.getBoundingClientRect();
  return {x:e.clientX-rect.left, y:e.clientY-rect.top};
}

function screenToWorld(sx, sy){
  return {x:(sx-W/2-panX)/scale, y:(sy-H/2-panY)/scale};
}

wrap.addEventListener('mousedown',e=>{dragging=true;dragStart={x:e.clientX-panX,y:e.clientY-panY};});
wrap.addEventListener('mousemove',e=>{
  if(dragging){panX=e.clientX-dragStart.x;panY=e.clientY-dragStart.y;draw();return;}
  // Tooltip
  const pos=getMousePos(e);
  const wp=screenToWorld(pos.x,pos.y);
  let hit=null;
  for(let i=nodes.length-1;i>=0;i--){
    const n=nodes[i];
    const dx=wp.x-n.x, dy=wp.y-n.y;
    if(dx*dx+dy*dy<=n.r*n.r){hit=n;break;}
  }
  if(hit&&hit.tip){
    tip.innerHTML=hit.tip;tip.classList.add('show');
    tip.style.left=e.clientX+12+'px';tip.style.top=e.clientY-10+'px';
  } else {tip.classList.remove('show');}
});
wrap.addEventListener('mouseup',()=>dragging=false);
wrap.addEventListener('mouseleave',()=>{dragging=false;tip.classList.remove('show');});
wrap.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.1:1/1.1);},{passive:false});

// Touch
let lastTouch=null;
wrap.addEventListener('touchstart',e=>{if(e.touches.length===1){dragging=true;const t=e.touches[0];dragStart={x:t.clientX-panX,y:t.clientY-panY};}});
wrap.addEventListener('touchmove',e=>{e.preventDefault();if(dragging&&e.touches.length===1){const t=e.touches[0];panX=t.clientX-dragStart.x;panY=t.clientY-dragStart.y;draw();}},{passive:false});
wrap.addEventListener('touchend',()=>dragging=false);

function zoom(f){scale=Math.max(0.3,Math.min(3,scale*f));draw();}
function resetView(){scale=1;panX=0;panY=0;draw();}

resize();
</script>
</body>
</html>
