<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards — Triangles</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=DM+Mono:wght@400;500&family=Lato:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#040810;--card:#0a1422;--card2:#0f1c30;--border:#1a2d45;--text:#cce4ff;--muted:#4a6890;
  --amber:#f59e0b;--teal:#2dd4bf;--blue:#38bdf8;--green:#22c55e;--red:#f43f5e;--indigo:#818cf8;--purple:#d946ef;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Lato',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(217,70,239,.05) 0%,transparent 60%);}

.site-nav{display:flex;align-items:center;justify-content:space-between;padding:.42rem 1.2rem;width:100%;
  background:rgba(4,8,16,.9);backdrop-filter:blur(14px);border-bottom:1px solid rgba(26,45,69,.75);position:sticky;top:0;z-index:9999;}
.site-nav-logo{display:flex;align-items:center;text-decoration:none;}
.site-nav-img{height:28px;}
.site-nav-back{font-family:'DM Mono',monospace;font-size:.68rem;color:#7a9ab8;text-decoration:none;border:1px solid rgba(26,45,69,.9);border-radius:99px;padding:.2rem .65rem;}
.site-nav-back:hover{color:#dde6f5;}

header{text-align:center;padding:1.6rem 1rem .8rem;}
header h1{font-family:'Playfair Display',serif;font-size:clamp(1.3rem,4vw,2rem);font-weight:900;color:var(--purple);}
header p{color:var(--muted);font-family:'DM Mono',monospace;font-size:.72rem;margin-top:.3rem;}

.prog-row{display:flex;align-items:center;gap:1rem;padding:.5rem 1rem .8rem;width:100%;max-width:580px;}
.prog-bar{flex:1;height:5px;background:var(--border);border-radius:99px;overflow:hidden;}
.prog-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--purple),var(--blue));transition:width .4s ease;}
.prog-text{font-family:'DM Mono',monospace;font-size:.72rem;color:var(--muted);white-space:nowrap;}

.filters{display:flex;gap:.4rem;flex-wrap:wrap;justify-content:center;padding:.2rem 1rem .8rem;}
.f-btn{font-family:'Playfair Display',serif;font-weight:700;font-size:.72rem;padding:.3rem .9rem;border-radius:3px;
  border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;transition:all .2s;}
.f-btn:hover{color:var(--text);}
.f-btn.on{color:#040810;border-color:transparent;}
.f-all.on{background:var(--muted);color:var(--text)!important;}
.f-sim.on{background:var(--purple);}
.f-bpt.on{background:var(--blue);}
.f-crit.on{background:var(--amber);}
.f-area.on{background:var(--green);}
.f-pyth.on{background:var(--indigo);}
.f-app.on{background:var(--red);}

.stage{width:100%;max-width:580px;padding:0 1rem;perspective:1200px;}
.fc-wrap{width:100%;aspect-ratio:3/2;position:relative;cursor:pointer;
  transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,0,.2,1);}
.fc-wrap.flipped{transform:rotateY(180deg);}
.fc-face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.4rem;text-align:center;}
.fc-front{background:var(--card);border:1px solid var(--border);box-shadow:0 8px 32px rgba(0,0,0,.6);}
.fc-back{transform:rotateY(180deg);background:var(--card);border:1px solid var(--border);box-shadow:0 8px 32px rgba(0,0,0,.6);}
.fc-tag{font-family:'DM Mono',monospace;font-size:.65rem;font-weight:500;padding:.18rem .65rem;border-radius:2px;margin-bottom:.7rem;}
.fc-q{font-family:'Playfair Display',serif;font-size:clamp(.88rem,2.4vw,1.1rem);font-weight:700;line-height:1.45;}
.fc-hint{font-size:.68rem;color:var(--muted);margin-top:.5rem;font-family:'DM Mono',monospace;}
.fc-flip-hint{position:absolute;bottom:.75rem;font-size:.65rem;font-family:'DM Mono',monospace;color:#1a2d45;animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.fc-ans-lbl{font-family:'DM Mono',monospace;font-size:.65rem;color:var(--green);margin-bottom:.5rem;}
.fc-ans{font-size:clamp(.78rem,2vw,.95rem);line-height:1.65;color:var(--text);}
.fc-ans strong{color:var(--amber);}
.fc-ans em{color:var(--teal);font-style:normal;}
.known-badge{position:absolute;top:.7rem;right:.7rem;font-size:.62rem;font-family:'DM Mono',monospace;padding:.12rem .45rem;border-radius:2px;}
.known{background:rgba(34,197,94,.15);color:#4ade80;}
.unknown{background:rgba(239,68,68,.1);color:#f87171;}

.nav-row{display:flex;gap:.7rem;align-items:center;padding:1rem;}
.nav-btn{font-family:'Playfair Display',serif;font-weight:700;font-size:.85rem;padding:.5rem 1.3rem;border-radius:4px;
  border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;transition:all .2s;}
.nav-btn:hover:not(:disabled){border-color:#2a4a6a;color:var(--text);}
.nav-btn:disabled{opacity:.3;cursor:default;}
.nav-ctr{font-family:'DM Mono',monospace;font-size:.8rem;color:var(--muted);min-width:80px;text-align:center;}
.action-row{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center;padding:0 1rem .5rem;}
.act-btn{font-family:'DM Mono',monospace;font-size:.72rem;padding:.32rem .9rem;border-radius:3px;
  border:1px solid var(--border);background:var(--card2);color:var(--muted);cursor:pointer;transition:all .2s;}
.act-btn:hover{color:var(--text);border-color:#2a4a6a;}
.stats-bar{display:flex;gap:1.2rem;justify-content:center;padding:.3rem 0 1rem;font-family:'DM Mono',monospace;font-size:.7rem;color:var(--muted);}
.stats-bar span strong{color:var(--text);}
</style>
</head>
<body>
<nav class="site-nav">
  <a href="../../index.html" class="site-nav-logo"><img src="../../logos/learnr-colored-dark.svg" alt="learnr" class="site-nav-img"></a>
  <a href="../../index.html" class="site-nav-back">&#8592; Back to Portal</a>
</nav>
<header>
  <h1>Triangles</h1>
  <p>Class X · Mathematics Ch.6 · 36 Flashcards · 6 Categories</p>
</header>

<div class="prog-row">
  <div class="prog-bar"><div class="prog-fill" id="prog" style="width:0%"></div></div>
  <div class="prog-text" id="prog-text">0 / 36</div>
</div>

<div class="filters">
  <button class="f-btn f-all on" onclick="setFilter('all',this)">All (36)</button>
  <button class="f-btn f-sim" onclick="setFilter('sim',this)">🔺 Similarity (6)</button>
  <button class="f-btn f-bpt" onclick="setFilter('bpt',this)">📏 BPT (6)</button>
  <button class="f-btn f-crit" onclick="setFilter('crit',this)">✅ Criteria (6)</button>
  <button class="f-btn f-area" onclick="setFilter('area',this)">📐 Areas (6)</button>
  <button class="f-btn f-pyth" onclick="setFilter('pyth',this)">📊 Pythagoras (6)</button>
  <button class="f-btn f-app" onclick="setFilter('app',this)">🌍 Applications (6)</button>
</div>

<div class="stage">
  <div class="fc-wrap" id="fc" onclick="flip()">
    <div class="fc-face fc-front" id="fc-front"></div>
    <div class="fc-face fc-back" id="fc-back"></div>
  </div>
</div>

<div class="nav-row">
  <button class="nav-btn" id="prev-btn" onclick="nav(-1)" disabled>&#8592; Prev</button>
  <span class="nav-ctr" id="nav-ctr">1 / 36</span>
  <button class="nav-btn" id="next-btn" onclick="nav(1)">Next &#8594;</button>
</div>
<div class="action-row">
  <button class="act-btn" onclick="markKnown()">✓ Mark Known</button>
  <button class="act-btn" onclick="markReview()">↩ Need Review</button>
  <button class="act-btn" onclick="shuffle()">⇄ Shuffle</button>
  <button class="act-btn" onclick="resetAll()">↺ Reset</button>
</div>
<div class="stats-bar">
  <span>Known: <strong id="s-known">0</strong></span>
  <span>Review: <strong id="s-review">0</strong></span>
  <span>Remaining: <strong id="s-remain">36</strong></span>
</div>

<script>
const ALL_CARDS=[
// ── SIMILARITY BASICS (6) ──
{cat:'sim',q:'When are two figures said to be similar?',a:'When they have the <strong>same shape</strong> but not necessarily the same size — <em>corresponding angles equal</em> AND <em>corresponding sides proportional</em>.',hint:'Same shape, maybe different size'},
{cat:'sim',q:'What is the difference between similar and congruent figures?',a:'<strong>Congruent</strong> = same shape AND size (k=1).<br><strong>Similar</strong> = same shape, any size. All congruent figures are similar, but not vice-versa.',hint:'Congruent is a special similar'},
{cat:'sim',q:'What does the symbol ~ mean, and why does vertex order matter?',a:'~ means <em>"is similar to"</em>. In ΔABC ~ ΔPQR the order shows correspondence: A↔P, B↔Q, C↔R. <strong>Wrong order = wrong proportions.</strong>',hint:'Tilde and correspondence'},
{cat:'sim',q:'Name three types of figures that are always similar.',a:'Any two <strong>circles</strong>, any two <strong>squares</strong>, any two <strong>equilateral triangles</strong> are always similar.',hint:'Circles, squares, equilateral Δ'},
{cat:'sim',q:'For similar triangles, what is the scale factor k?',a:'The <strong>common ratio</strong> of corresponding sides: k = AB/PQ = BC/QR = CA/RP. If <em>k = 1</em>, the triangles are congruent.',hint:'Ratio of corresponding sides'},
{cat:'sim',q:'Are all similar figures congruent?',a:'<strong>No.</strong> Similar figures are congruent only when the scale factor is 1. Otherwise they have the same shape but different sizes.',hint:'Only when k = 1'},

// ── BPT / THALES (6) ──
{cat:'bpt',q:'State the Basic Proportionality Theorem (Thales Theorem).',a:'If a line is drawn <strong>parallel to one side</strong> of a triangle intersecting the other two sides, it divides them in the <em>same ratio</em>.',hint:'Parallel line divides sides proportionally'},
{cat:'bpt',q:'In ΔABC, DE ∥ BC. Write the proportionality result.',a:'<strong>AD/DB = AE/EC</strong><br>The parallel line DE splits AB and AC in equal ratios.',hint:'AD/DB = AE/EC'},
{cat:'bpt',q:'State the converse of BPT.',a:'If a line divides any two sides of a triangle in the <strong>same ratio</strong>, then the line is <em>parallel to the third side</em>.',hint:'Equal ratio ⇒ parallel'},
{cat:'bpt',q:'How is BPT proved?',a:'Using areas: triangles between the <strong>same parallels</strong> have equal areas. Comparing area ratios gives AD/DB = AE/EC.',hint:'Areas between same parallels'},
{cat:'bpt',q:'How is the Midpoint Theorem related to BPT?',a:'It is a <strong>special case</strong>: if D, E are midpoints of AB, AC then DE ∥ BC and DE = ½BC. Here the ratio k = <em>1/2</em>.',hint:'Special case with k = 1/2'},
{cat:'bpt',q:'The diagonals of a trapezium ABCD (AB∥DC) meet at O. What ratio result holds?',a:'<strong>AO/OC = BO/OD</strong> — the diagonals divide each other in the same ratio (follows from similar triangles).',hint:'Diagonals divide proportionally'},

// ── CRITERIA (6) ──
{cat:'crit',q:'What are the three criteria for similarity of triangles?',a:'<strong>AAA/AA</strong>, <strong>SSS</strong>, and <strong>SAS</strong> similarity.',hint:'AA, SSS, SAS'},
{cat:'crit',q:'State the AA similarity criterion.',a:'If <strong>two angles</strong> of one triangle equal two angles of another, the triangles are similar (the third angle matches automatically).',hint:'Two equal angles suffice'},
{cat:'crit',q:'State the SSS similarity criterion.',a:'If the <strong>corresponding sides</strong> of two triangles are in the same ratio, the triangles are similar.',hint:'All sides proportional'},
{cat:'crit',q:'State the SAS similarity criterion.',a:'If <strong>one angle</strong> of a triangle equals one angle of another AND the <em>including sides</em> are proportional, the triangles are similar.',hint:'Equal angle + proportional including sides'},
{cat:'crit',q:'Why is AA sufficient instead of AAA?',a:'Because the angles of a triangle sum to <strong>180°</strong>. If two pairs are equal, the third pair must also be equal.',hint:'Angle sum = 180°'},
{cat:'crit',q:'Is there an "SSA" similarity rule?',a:'<strong>No.</strong> SSA (or ASS) is not a valid criterion. Only AA, SSS and SAS prove similarity.',hint:'SSA is invalid'},

// ── AREAS (6) ──
{cat:'area',q:'How do the areas of two similar triangles compare?',a:'The ratio of areas equals the <strong>square</strong> of the ratio of corresponding sides:<br>ar(ABC)/ar(PQR) = <em>(AB/PQ)²</em>.',hint:'Square of the side ratio'},
{cat:'area',q:'If two similar triangles have sides in ratio 3:5, what is the ratio of their areas?',a:'(3/5)² = <strong>9/25</strong>. Areas scale as the square of the linear ratio.',hint:'Square the ratio'},
{cat:'area',q:'The ratio of areas of similar triangles also equals the square of which other ratios?',a:'The squares of the ratios of corresponding <strong>medians, altitudes, angle bisectors</strong> and <em>perimeters</em>.',hint:'Medians, altitudes, perimeters'},
{cat:'area',q:'Two similar triangles have areas 16 cm² and 25 cm². Find the ratio of their sides.',a:'Side ratio = √(16/25) = <strong>4/5</strong>. Take the square root of the area ratio.',hint:'Square-root the area ratio'},
{cat:'area',q:'Do perimeters of similar triangles scale with k or k²?',a:'Perimeters scale with <strong>k</strong> (the side ratio itself), NOT k². Only <em>areas</em> use k².',hint:'Perimeter uses k, area uses k²'},
{cat:'area',q:'If the ratio of corresponding medians of two similar triangles is 2:3, find the ratio of areas.',a:'Area ratio = (2/3)² = <strong>4/9</strong>. Medians scale like sides, so square the ratio.',hint:'Medians behave like sides'},

// ── PYTHAGORAS (6) ──
{cat:'pyth',q:'State the Pythagoras Theorem.',a:'In a right triangle, the <strong>square of the hypotenuse</strong> equals the sum of squares of the other two sides:<br>AC² = AB² + BC² (∠B = 90°).',hint:'c² = a² + b²'},
{cat:'pyth',q:'State the converse of the Pythagoras Theorem.',a:'If the square of the longest side equals the sum of squares of the other two, then the angle opposite the longest side is <strong>90°</strong>.',hint:'Used to test for a right angle'},
{cat:'pyth',q:'Name three common Pythagorean triplets.',a:'<strong>(3,4,5), (5,12,13), (8,15,17), (7,24,25)</strong> — and all their multiples like (6,8,10).',hint:'3-4-5 and friends'},
{cat:'pyth',q:'Is (6, 8, 10) a right triangle?',a:'Yes. 6² + 8² = 36 + 64 = 100 = 10². Since it satisfies the converse, it is a <strong>right triangle</strong>.',hint:'Check a²+b²=c²'},
{cat:'pyth',q:'How is Pythagoras proved in Class X?',a:'By dropping a perpendicular from the right angle to the hypotenuse, creating <strong>two smaller triangles similar</strong> to the original; combining relations gives c² = a²+b².',hint:'Uses similar triangles'},
{cat:'pyth',q:'A ladder 13 m long rests against a wall reaching 12 m high. How far is its foot from the wall?',a:'base² = 13² − 12² = 169 − 144 = 25 → base = <strong>5 m</strong>.',hint:'It is a 5-12-13 triplet'},

// ── APPLICATIONS (6) ──
{cat:'app',q:'A 6 m pole casts a 4 m shadow. A tower casts a 20 m shadow at the same time. Find the tower height.',a:'Height/shadow is constant: h/20 = 6/4 → h = <strong>30 m</strong> (similar triangles).',hint:'Equal height-to-shadow ratio'},
{cat:'app',q:'Why can similar triangles measure a river\'s width without crossing it?',a:'By constructing a triangle on the near bank similar to one spanning the river; corresponding sides in proportion give the <strong>unknown width</strong>.',hint:'Proportional corresponding sides'},
{cat:'app',q:'How is Pythagoras used in a ladder-against-wall problem?',a:'ladder² = wall height² + base distance². Knowing any two, find the third.',hint:'Right triangle relation'},
{cat:'app',q:'Two poles 6 m and 11 m tall stand 12 m apart. Find the distance between their tops.',a:'Vertical gap = 11−6 = 5 m. Distance = √(12² + 5²) = √169 = <strong>13 m</strong>.',hint:'Right triangle with legs 12 and 5'},
{cat:'app',q:'How does map scaling use similarity?',a:'A map is similar to the actual region: <strong>actual distance = map distance × scale factor</strong>.',hint:'Multiply by the scale factor'},
{cat:'app',q:'A girl 90 cm tall walks away from a 3.6 m lamp-post. How does her shadow length relate?',a:'Lamp-post and girl form similar triangles; shadow length is found from the proportion <em>height/shadow</em> of the two similar triangles.',hint:'Similar triangles of light'},
];

let deck=[...ALL_CARDS.map((_,i)=>i)];
let current=0,flipped=false,filterCat='all';
const known=new Set(),review=new Set();

function filteredDeck(){return filterCat==='all'?deck:deck.filter(i=>ALL_CARDS[i].cat===filterCat);}
function setFilter(cat,btn){filterCat=cat;document.querySelectorAll('.f-btn').forEach(b=>b.classList.remove('on'));btn.classList.add('on');current=0;render();}

function render(){
  const fd=filteredDeck();
  if(!fd.length){document.getElementById('fc-front').innerHTML='<div class="fc-q">No cards in this category.</div>';return;}
  const idx=fd[current%fd.length],card=ALL_CARDS[idx],fc=document.getElementById('fc');
  fc.classList.remove('flipped');flipped=false;
  const catColors={sim:['var(--purple)','rgba(217,70,239,.15)'],bpt:['var(--blue)','rgba(56,189,248,.15)'],
    crit:['var(--amber)','rgba(245,158,11,.15)'],area:['var(--green)','rgba(34,197,94,.15)'],
    pyth:['var(--indigo)','rgba(129,140,248,.15)'],app:['var(--red)','rgba(244,63,94,.15)']};
  const catNames={sim:'🔺 Similarity',bpt:'📏 BPT',crit:'✅ Criteria',area:'📐 Areas',pyth:'📊 Pythagoras',app:'🌍 Applications'};
  const [cc,cb]=catColors[card.cat]||['var(--muted)','rgba(100,116,139,.15)'];
  const isK=known.has(idx),isR=review.has(idx);
  const badge=isK?'<span class="known-badge known">✓ Known</span>':isR?'<span class="known-badge unknown">↩ Review</span>':'';
  document.getElementById('fc-front').innerHTML=`${badge}<span class="fc-tag" style="background:${cb};color:${cc}">${catNames[card.cat]}</span><div class="fc-q">${card.q}</div>${card.hint?`<div class="fc-hint">Hint: ${card.hint}</div>`:''}<div class="fc-flip-hint">tap to reveal answer</div>`;
  document.getElementById('fc-back').innerHTML=`${badge}<div class="fc-ans-lbl">✦ ANSWER</div><div class="fc-ans">${card.a}</div>`;
  document.getElementById('nav-ctr').textContent=`${(current%fd.length)+1} / ${fd.length}`;
  document.getElementById('prev-btn').disabled=current===0;
  document.getElementById('next-btn').disabled=current>=fd.length-1;
  updateProgress();
}
function flip(){flipped=!flipped;document.getElementById('fc').classList.toggle('flipped',flipped);}
function nav(d){const fd=filteredDeck();current=Math.max(0,Math.min(fd.length-1,current+d));render();}
function markKnown(){const fd=filteredDeck();if(fd.length){known.add(fd[current%fd.length]);review.delete(fd[current%fd.length]);render();updateStats();}}
function markReview(){const fd=filteredDeck();if(fd.length){review.add(fd[current%fd.length]);known.delete(fd[current%fd.length]);render();updateStats();}}
function shuffle(){for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]];}current=0;render();}
function resetAll(){known.clear();review.clear();deck=[...ALL_CARDS.map((_,i)=>i)];current=0;render();updateStats();}
function updateProgress(){const fd=filteredDeck(),seen=fd.slice(0,current+1).length,pct=fd.length?Math.round(seen/fd.length*100):0;document.getElementById('prog').style.width=pct+'%';document.getElementById('prog-text').textContent=`${seen} / ${fd.length}`;}
function updateStats(){document.getElementById('s-known').textContent=known.size;document.getElementById('s-review').textContent=review.size;document.getElementById('s-remain').textContent=ALL_CARDS.length-known.size-review.size;}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')nav(1);if(e.key==='ArrowLeft')nav(-1);if(e.key===' '||e.key==='Enter'){e.preventDefault();flip();}});
render();updateStats();
</script>
</body>
</html>
