<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mind Map — Arithmetic Progressions</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #040810; font-family: 'Nunito', sans-serif; overflow: hidden; width: 100vw; height: 100vh; }
canvas { position: absolute; inset: 0; }

#ui {
  position: absolute; top: 0; left: 0; right: 0;
  display: flex; justify-content: space-between; align-items: center;
  padding: .8rem 1.2rem; z-index: 10; pointer-events: none;
}
#ui h1 {
  font-family: 'Syne', sans-serif; font-size: 1.1rem; font-weight: 800;
  background: linear-gradient(135deg,#2dd4bf,#38bdf8,#818cf8);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
#ui p { font-family: 'DM Mono', monospace; font-size: .68rem; color: #475569; margin-top: .1rem; }

.ctrl-bar {
  position: absolute; bottom: 1rem; left: 50%; transform: translateX(-50%);
  display: flex; gap: .5rem; z-index: 10;
}
.ctrl-btn {
  font-family: 'Syne', sans-serif; font-weight: 700; font-size: .75rem;
  padding: .4rem 1rem; border-radius: 99px;
  border: 1.5px solid #334155; background: rgba(30,41,59,.9);
  color: #94a3b8; cursor: pointer; transition: all .2s; pointer-events: all;
}
.ctrl-btn:hover { border-color: #64748b; color: #e2e8f0; }

#tooltip {
  position: absolute; z-index: 20; pointer-events: none;
  background: #1e293b; border: 1px solid #334155;
  border-radius: 12px; padding: .7rem 1rem;
  max-width: 270px; font-size: .82rem; color: #e2e8f0;
  line-height: 1.6; display: none;
  box-shadow: 0 8px 24px rgba(0,0,0,.6);
}
#tooltip strong { font-family: 'Syne', sans-serif; display: block; margin-bottom: .3rem; }

.site-nav {
  display:flex; align-items:center; justify-content:space-between;
  padding:.42rem 1.2rem; width:100%; align-self:stretch; flex-shrink:0;
  background:rgba(4,8,16,.9); backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(26,45,69,.75);
  position:sticky; top:0; z-index:9999;
}
.site-nav-logo { display:flex; align-items:center; text-decoration:none; }
.site-nav-img  { height:28px; width:auto; display:block; border-radius:4px; }
.site-nav-back {
  font-family:'DM Mono',monospace; font-size:.68rem;
  color:#7a9ab8; text-decoration:none; transition:all .2s;
  border:1px solid rgba(26,45,69,.9); border-radius:99px;
  padding:.2rem .65rem; white-space:nowrap;
}
.site-nav-back:hover { color:#dde6f5; border-color:#2a4060; background:rgba(255,255,255,.04); }
</style>
</head>
<body>
<nav class="site-nav"><a href="../../index.html" class="site-nav-logo"><img src="../../logos/learnr-colored-dark.svg" alt="learnr" class="site-nav-img"></a><a href="../../index.html" class="site-nav-back">&#8592; Back to Portal</a></nav>
<div id="ui">
  <div>
    <h1>Arithmetic Progressions</h1>
    <p>Class X · CBSE · Mind Map — hover nodes to explore</p>
  </div>
</div>

<div class="ctrl-bar">
  <button class="ctrl-btn" onclick="zoom(1.2)">＋ Zoom</button>
  <button class="ctrl-btn" onclick="zoom(0.83)">－ Zoom</button>
  <button class="ctrl-btn" onclick="resetView()">⌖ Reset</button>
</div>

<div id="tooltip"></div>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const tip = document.getElementById('tooltip');

let W, H, scale = 1, ox = 0, oy = 0;
let dragging = false, dragStart = {x:0,y:0}, dragOrigin = {x:0,y:0};

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  ox = W/2; oy = H/2 + 20;
  draw();
}
window.addEventListener('resize', resize);

const CENTER = {
  id:'c', label:'Arithmetic\nProgressions', x:0, y:0, r:60,
  color:'#04140f', stroke:'#2dd4bf', textColor:'#5eead4', fontSize:14
};

const BRANCHES = [
  {
    id:'basic', label:'Basics of\nan AP', x:0, y:-290, r:44,
    color:'#001a18', stroke:'#2dd4bf', textColor:'#99f6e4',
    info:'An Arithmetic Progression is a list of numbers in which each term is obtained by adding a fixed number (d) to the previous term.\nGeneral AP: a, a+d, a+2d, a+3d, …',
    children:[
      { id:'b1', label:'First Term\na', x:-180, y:-410, r:34, color:'#001a18', stroke:'#5eead4', textColor:'#ccfbf1',
        info:'The first term is denoted by "a" (or a₁).\nExample: In 3, 7, 11, 15, … the first term a = 3.\nEvery AP is built starting from a.' },
      { id:'b2', label:'Common\nDifference d', x:0, y:-440, r:34, color:'#001a18', stroke:'#5eead4', textColor:'#ccfbf1',
        info:'d = the fixed number added each time.\nd = a₂ − a₁ = a₃ − a₂ = …\nIt must be the SAME between all consecutive terms for the list to be an AP.' },
      { id:'b3', label:'Finite &\nInfinite', x:180, y:-410, r:34, color:'#001a18', stroke:'#5eead4', textColor:'#ccfbf1',
        info:'Finite AP: has a last term (e.g., 2,4,6,…,100).\nInfinite AP: continues forever (e.g., 1,4,7,10,…).\nA finite AP has a fixed number of terms n.' },
    ]
  },
  {
    id:'cd', label:'Common\nDifference', x:-300, y:-185, r:44,
    color:'#1a0f00', stroke:'#f59e0b', textColor:'#fde68a',
    info:'d = aₙ − aₙ₋₁\nThe difference between any term and its preceding term. It defines the "step" of the AP and can be positive, negative or zero.',
    children:[
      { id:'c1', label:'d = aₙ − aₙ₋₁', x:-510, y:-300, r:34, color:'#1a0f00', stroke:'#fbbf24', textColor:'#fef3c7',
        info:'To find d, subtract any term from the term after it.\nExample: 5, 8, 11, 14 → d = 8−5 = 3.\nCheck: 11−8 = 3 ✓, 14−11 = 3 ✓' },
      { id:'c2', label:'Sign of d', x:-540, y:-170, r:34, color:'#1a0f00', stroke:'#fbbf24', textColor:'#fef3c7',
        info:'d > 0 → increasing AP (2,5,8,…)\nd < 0 → decreasing AP (10,7,4,…)\nd = 0 → constant AP (5,5,5,…)\nAll are valid APs.' },
      { id:'c3', label:'Test for\nan AP', x:-510, y:-55, r:34, color:'#1a0f00', stroke:'#fbbf24', textColor:'#fef3c7',
        info:'A list is an AP only if aₖ₊₁ − aₖ is the SAME for all k.\nIf the differences vary, it is NOT an AP.\nExample: 1,4,9,16 → diffs 3,5,7 → not an AP.' },
    ]
  },
  {
    id:'nth', label:'nth Term\naₙ', x:300, y:-185, r:44,
    color:'#001a25', stroke:'#38bdf8', textColor:'#bae6fd',
    info:'aₙ = a + (n − 1)d\nGives ANY term directly without listing all previous terms. Also called the general term.',
    children:[
      { id:'n1', label:'aₙ=a+(n−1)d', x:510, y:-300, r:34, color:'#001a25', stroke:'#7dd3fc', textColor:'#e0f2fe',
        info:'The nth term formula:\naₙ = a + (n−1)d\nwhere a = first term, d = common difference, n = term number.\nExample: 3,7,11,… find a₁₀ = 3+(9)(4) = 39.' },
      { id:'n2', label:'nth Term\nfrom End', x:540, y:-170, r:34, color:'#001a25', stroke:'#7dd3fc', textColor:'#e0f2fe',
        info:'nth term from the end of a finite AP with last term l:\n= l − (n−1)d\nUseful when counting backward from the last term.' },
      { id:'n3', label:'Find n or d', x:510, y:-55, r:34, color:'#001a25', stroke:'#7dd3fc', textColor:'#e0f2fe',
        info:'The formula aₙ=a+(n−1)d has 4 quantities.\nGiven any 3, you can find the 4th.\nExample: Is 78 a term of 3,7,11,…? 78=3+(n−1)4 → n=19.75 → No (n not a whole number).' },
    ]
  },
  {
    id:'sum', label:'Sum of\nn Terms', x:-300, y:185, r:44,
    color:'#001a08', stroke:'#22c55e', textColor:'#86efac',
    info:'Sₙ = n/2 [2a + (n−1)d]\nSₙ = n/2 (a + l)\nThe sum of the first n terms of an AP. Discovered by Gauss.',
    children:[
      { id:'s1', label:'Sₙ=n/2\n[2a+(n−1)d]', x:-510, y:80, r:36, color:'#001a08', stroke:'#4ade80', textColor:'#bbf7d0',
        info:'The main sum formula:\nSₙ = n/2 [2a + (n−1)d]\nUse this when the last term is unknown.\nExample: Sum of first 20 terms of 2,5,8,… = 10[4+57] = 610.' },
      { id:'s2', label:'Sₙ=n/2\n(a+l)', x:-540, y:210, r:36, color:'#001a08', stroke:'#4ade80', textColor:'#bbf7d0',
        info:'When the last term l = aₙ is known:\nSₙ = n/2 (a + l)\nSum = (number of terms) × (average of first & last term).\nExample: 1+2+…+100 = 100/2(1+100) = 5050.' },
      { id:'s3', label:'aₙ = Sₙ − Sₙ₋₁', x:-500, y:340, r:36, color:'#001a08', stroke:'#4ade80', textColor:'#bbf7d0',
        info:'A key relation: the nth term equals the difference of consecutive sums.\naₙ = Sₙ − Sₙ₋₁\nUseful when Sₙ is given as a formula in n.' },
    ]
  },
  {
    id:'prop', label:'Properties\n& Tricks', x:300, y:185, r:44,
    color:'#0a0020', stroke:'#818cf8', textColor:'#c7d2fe',
    info:'Smart symmetric selections and properties that simplify solving AP problems, especially when sums or products of terms are given.',
    children:[
      { id:'p1', label:'3 Terms:\na−d, a, a+d', x:510, y:80, r:36, color:'#0a0020', stroke:'#a5b4fc', textColor:'#e0e7ff',
        info:'For 3 unknown terms in AP, choose:\na−d, a, a+d\nTheir sum = 3a (d cancels), which makes equations easy.\nUsed when a sum is given.' },
      { id:'p2', label:'4 Terms:\na−3d…a+3d', x:540, y:210, r:36, color:'#0a0020', stroke:'#a5b4fc', textColor:'#e0e7ff',
        info:'For 4 terms in AP, choose:\na−3d, a−d, a+d, a+3d (common diff = 2d)\nSum = 4a. Symmetric choice cancels d and simplifies.' },
      { id:'p3', label:'Add/Subtract\nConstant', x:500, y:340, r:36, color:'#0a0020', stroke:'#a5b4fc', textColor:'#e0e7ff',
        info:'If a constant is added to (or subtracted from) each term of an AP, the result is still an AP with the SAME d.\nMultiplying each term by k gives an AP with new common difference kd.' },
    ]
  },
  {
    id:'app', label:'Applications', x:0, y:290, r:44,
    color:'#1a0010', stroke:'#f43f5e', textColor:'#fda4af',
    info:'APs model many real-life situations with constant change — savings, salaries, seating, stacking, and patterns.',
    children:[
      { id:'a1', label:'Money &\nSavings', x:-170, y:420, r:34, color:'#1a0010', stroke:'#fb7185', textColor:'#fecdd3',
        info:'Fixed yearly increments in salary, monthly savings increasing by a fixed amount, loan instalments — all form APs.\nExample: salary ₹25000 rising ₹1000 each year.' },
      { id:'a2', label:'Patterns &\nStacking', x:0, y:460, r:34, color:'#1a0010', stroke:'#fb7185', textColor:'#fecdd3',
        info:'Logs stacked in rows, seats in a theatre increasing each row, number of bricks in steps — classic AP problems.\nExample: 20,19,18,… logs in rows.' },
      { id:'a3', label:'Number\nProblems', x:170, y:420, r:34, color:'#1a0010', stroke:'#fb7185', textColor:'#fecdd3',
        info:'Sum of first n natural numbers, multiples of a number in a range, or terms satisfying a condition.\nExample: How many multiples of 4 lie between 10 and 250?' },
    ]
  }
];

const allNodes = [CENTER];
const allEdges = [];
BRANCHES.forEach(b => {
  allNodes.push(b);
  allEdges.push({from:'c', to:b.id});
  (b.children||[]).forEach(ch => {
    allNodes.push(ch);
    allEdges.push({from:b.id, to:ch.id});
  });
});

function getNode(id) { return allNodes.find(n=>n.id===id); }

canvas.addEventListener('mousedown', e => { dragging=true; dragStart={x:e.clientX,y:e.clientY}; dragOrigin={x:ox,y:oy}; });
canvas.addEventListener('mousemove', e => {
  if (dragging) { ox = dragOrigin.x+(e.clientX-dragStart.x); oy = dragOrigin.y+(e.clientY-dragStart.y); draw(); return; }
  const mx=(e.clientX-ox)/scale, my=(e.clientY-oy)/scale;
  let found=null;
  allNodes.forEach(n=>{ const dx=mx-n.x,dy=my-n.y; if(Math.sqrt(dx*dx+dy*dy)<n.r+6) found=n; });
  if(found && found.info){ tip.style.display='block'; tip.style.left=(e.clientX+14)+'px'; tip.style.top=Math.min(e.clientY-10,window.innerHeight-220)+'px';
    tip.innerHTML=`<strong>${found.label.replace(/\n/g,' ')}</strong>${found.info.replace(/\n/g,'<br>')}`;
    canvas.style.cursor='pointer';
  } else { tip.style.display='none'; canvas.style.cursor='grab'; }
});
canvas.addEventListener('mouseup', ()=>dragging=false);
canvas.addEventListener('mouseleave', ()=>{ dragging=false; tip.style.display='none'; });
canvas.addEventListener('wheel', e=>{ e.preventDefault(); const f=e.deltaY<0?1.1:0.91; zoomAt(f,e.clientX,e.clientY); },{passive:false});

let lastTouchDist=null;
canvas.addEventListener('touchstart',e=>{ if(e.touches.length===1){ dragging=true; dragStart={x:e.touches[0].clientX,y:e.touches[0].clientY}; dragOrigin={x:ox,y:oy}; }});
canvas.addEventListener('touchmove',e=>{ e.preventDefault();
  if(e.touches.length===1&&dragging){ ox=dragOrigin.x+(e.touches[0].clientX-dragStart.x); oy=dragOrigin.y+(e.touches[0].clientY-dragStart.y); draw(); }
  if(e.touches.length===2){ const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    if(lastTouchDist){ const cx=(e.touches[0].clientX+e.touches[1].clientX)/2,cy=(e.touches[0].clientY+e.touches[1].clientY)/2; zoomAt(d/lastTouchDist,cx,cy); }
    lastTouchDist=d; }
},{passive:false});
canvas.addEventListener('touchend',()=>{ dragging=false; lastTouchDist=null; });

function zoomAt(f,cx,cy){ const prev=scale; scale=Math.max(.3,Math.min(2.5,scale*f)); ox=cx-(cx-ox)*(scale/prev); oy=cy-(cy-oy)*(scale/prev); draw(); }
function zoom(f){ zoomAt(f,W/2,H/2); }
function resetView(){ scale=1; ox=W/2; oy=H/2+20; draw(); }

function draw() {
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(ox,oy);
  ctx.scale(scale,scale);

  ctx.save();
  ctx.strokeStyle='rgba(255,255,255,.025)';
  ctx.lineWidth=1;
  for(let x=-1000;x<1000;x+=60){ ctx.beginPath();ctx.moveTo(x,-1000);ctx.lineTo(x,1000);ctx.stroke(); }
  for(let y=-1000;y<1000;y+=60){ ctx.beginPath();ctx.moveTo(-1000,y);ctx.lineTo(1000,y);ctx.stroke(); }
  ctx.restore();

  allEdges.forEach(e=>{
    const a=getNode(e.from),b=getNode(e.to);
    if(!a||!b)return;
    const grd=ctx.createLinearGradient(a.x,a.y,b.x,b.y);
    grd.addColorStop(0,a.stroke+'88');
    grd.addColorStop(1,b.stroke+'44');
    ctx.beginPath();
    const cx=(a.x+b.x)/2, cy=(a.y+b.y)/2-30;
    ctx.moveTo(a.x,a.y);
    ctx.quadraticCurveTo(cx,cy,b.x,b.y);
    ctx.strokeStyle=grd;
    ctx.lineWidth=e.from==='c'?2.5:1.5;
    ctx.setLineDash(e.from==='c'?[]:[4,4]);
    ctx.stroke();
    ctx.setLineDash([]);
  });

  allNodes.forEach(n=>{
    ctx.save();
    ctx.shadowColor=n.stroke;
    ctx.shadowBlur=n.id==='c'?30:16;
    ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
    ctx.fillStyle=n.color;
    ctx.fill();
    ctx.restore();

    ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
    ctx.strokeStyle=n.stroke;
    ctx.lineWidth=n.id==='c'?3:2;
    ctx.stroke();

    ctx.fillStyle=n.textColor;
    ctx.font=`700 ${n.fontSize||11}px Nunito,sans-serif`;
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    const lines=n.label.split('\n');
    const lh=14;
    const startY=n.y-(lines.length-1)*lh/2;
    lines.forEach((l,i)=>ctx.fillText(l,n.x,startY+i*lh));
  });

  ctx.restore();
}

resize();
</script>
</body>
</html>
